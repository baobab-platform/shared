schema:
  name: baobab-supplier-onboarding-system-of-record
  version: "1.0"
  rule: >
    No record is implicitly bidirectional; the declared process owner wins
    its attributes and corrections are explicit. This file is scoped to the
    supplier-onboarding domain only. It does not amend, and must never be
    read as amending, contracts/erp/v1/system-of-record.yaml — in
    particular that file's "Organisation" concept is canonical_owner
    control-plane (ADR-BCP-018), while "Supplier" remains canonical_owner
    erp. Both are referenced below, never redefined.

concepts:
  - concept: Supplier Application
    canonical_owner: hosting-estate
    producer: [digital-estates]
    consumers: [erp, reporting]
    external_identifier: estate-minted application ID (see domain.schema.json#/$defs/estateResourceId); nullable canonical_organisation_id refers to a CP-attested mapping when present; the hosting estate may not mint it
    idempiere_representation: none until ERP provisioning exists; on approval an application becomes an input to a future Business Partner vendor-role record (see contracts/erp/v1/system-of-record.yaml's Supplier concept), never the same record
    medusa_representation: none
    synchronisation_direction: estate_to_authorised_consumers
    consistency: estate authoritative pre-approval; superseded by ERP's Supplier record once provisioning exists
    mechanism: estate-owned database and this contract's versioned events
    conflict_resolution: an estate application is neither a canonical Organisation nor an ERP Supplier; only CP-governed Organisation mappings can join them, and ambiguous mappings are quarantined

  - concept: Supplier Capability
    canonical_owner: hosting-estate
    producer: [digital-estates]
    consumers: [erp, reporting]
    external_identifier: estate-local capability ID scoped to one Supplier Application
    idempiere_representation: none until ERP provisioning exists
    medusa_representation: none
    synchronisation_direction: estate_to_authorised_consumers
    consistency: estate authoritative; declared != verified
    mechanism: estate-owned database and this contract's versioned events
    conflict_resolution: a capability never implies approval of any specific product proposal; product-level approval is a distinct, not-yet-defined contract

  - concept: Supplier Certification
    canonical_owner: hosting-estate
    producer: [digital-estates]
    consumers: [erp, reporting]
    external_identifier: estate-local certification ID scoped to one Supplier Application
    idempiere_representation: none until ERP provisioning exists
    medusa_representation: none
    synchronisation_direction: estate_to_authorised_consumers
    consistency: estate authoritative; declared != verified
    mechanism: estate-owned database and this contract's versioned events
    conflict_resolution: certification metadata only; document custody is a storage decision each estate makes for itself, not covered by this contract

  - concept: Supplier KYB Evidence
    canonical_owner: hosting-estate
    producer: [digital-estates]
    consumers: [erp, reporting]
    external_identifier: estate-local kyb evidence ID scoped to one Supplier Application
    idempiere_representation: none; approved decisions inform later ERP Supplier provisioning but never become C_BPartner document blobs
    medusa_representation: none
    synchronisation_direction: estate_to_authorised_consumers
    consistency: estate authoritative pre-approval; declared evidence is not verification
    mechanism: estate-owned metadata and versioned supplier-onboarding events
    conflict_resolution: failed, expired or incomplete evidence blocks approval; ambiguous provider results require staff review

  - concept: Supplier KYB Decision
    canonical_owner: hosting-estate
    producer: [digital-estates]
    consumers: [erp, reporting]
    external_identifier: Supplier Application plus monotonically increasing revision
    idempiere_representation: readiness input only; not an ERP Supplier or Business Partner
    medusa_representation: none
    synchronisation_direction: estate_to_authorised_consumers
    consistency: latest non-superseded revision wins; verified is required before approval
    mechanism: versioned supplier-onboarding events and estate audit trail
    conflict_resolution: fail closed on missing, failed or expired decision

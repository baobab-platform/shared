asyncapi: 3.1.0
info:
  title: Baobab-Platform Baobab ERP boundary events
  version: 1.1.0
  description: Vendor-neutral, tenant-scoped ERP consequences using the canonical Baobab event envelope.
defaultContentType: application/json
channels:
  tradeToErp:
    address: baobab-platform.erp.commands.v1
    messages:
      commerceOrderPlaced: { $ref: "#/components/messages/CommerceOrderPlaced" }
      commerceCustomerProjected: { $ref: "#/components/messages/CommerceCustomerProjected" }
  erpOutcomes:
    address: baobab-platform.erp.outcomes.v1
    messages:
      orderConsequenceChanged: { $ref: "#/components/messages/OrderConsequenceChanged" }
      businessPartnerChanged: { $ref: "#/components/messages/BusinessPartnerChanged" }
      inventoryAvailabilityChanged: { $ref: "#/components/messages/InventoryAvailabilityChanged" }
      warehouseChanged: { $ref: "#/components/messages/WarehouseChanged" }
      invoiceChanged: { $ref: "#/components/messages/InvoiceChanged" }
      paymentAccountingChanged: { $ref: "#/components/messages/PaymentAccountingChanged" }
      provisioningChanged: { $ref: "#/components/messages/ProvisioningChanged" }
operations:
  receiveTradeConsequences:
    action: receive
    channel: { $ref: "#/channels/tradeToErp" }
  publishErpOutcomes:
    action: send
    channel: { $ref: "#/channels/erpOutcomes" }
components:
  messages:
    CommerceOrderPlaced:
      name: com.baobab-platform.trade.order.placed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./commerce-order-consequence.schema.json }
    CommerceCustomerProjected:
      name: com.baobab-platform.trade.customer.projected.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./customer-projection.schema.json }
    OrderConsequenceChanged:
      name: com.baobab-platform.erp.order.consequence-changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./order-consequence-status.schema.json }
    BusinessPartnerChanged:
      name: com.baobab-platform.erp.business-partner.changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./business-partner-projection.schema.json }
    InventoryAvailabilityChanged:
      name: com.baobab-platform.erp.inventory.availability-changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./inventory-availability.schema.json }
    WarehouseChanged:
      name: com.baobab-platform.erp.warehouse.changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./warehouse-projection.schema.json }
    InvoiceChanged:
      name: com.baobab-platform.erp.invoice.changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./invoice-outcome.schema.json }
    PaymentAccountingChanged:
      name: com.baobab-platform.erp.payment.accounting-changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./payment-outcome.schema.json }
    ProvisioningChanged:
      name: com.baobab-platform.erp.provisioning.changed.v1
      summary: ERP's provisioning operation moved to a new revision
      description: >-
        One event per committed state change of a provisioning command, recorded in ERP's transactional outbox in the
        same database transaction as the change, so a state ERP committed is never left unannounced. Its identity is a
        function of the change, not of the delivery: id is the version 5 UUID, in the URL namespace, of
        urn:baobab-platform:event:erp-provisioning:{operation_id}:{revision}, and idempotencykey is
        erp-provisioning-{operation_id}-r{revision}, so every redelivery, replay or re-publication of the same revision
        is the same event and a consumer deduplicates by (source, id). Delivery is at-least-once and unordered: a consumer applies
        an event only if its revision is newer than the one it holds. The event is a trigger to inspect authoritative
        state; data carries the same fields as GET /provisioning-operations/{operation_id}. Over HTTPS the event travels
        by signed delivery (../../events/v1/signed-delivery.schema.json,
        docs/architecture/signed-event-delivery.md); the event contract does not depend on that transport.
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./provisioning-state.schema.json }

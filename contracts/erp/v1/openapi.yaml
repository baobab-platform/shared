openapi: 3.1.0
info:
  title: Baobab-Platform Baobab ERP Boundary API
  version: 1.3.0
  description: Vendor-neutral synchronous provisioning and query contract. Business state propagation uses the ERP AsyncAPI contract.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://erp.baobab-platform.com/v1
    description: Production placeholder; activation requires an approved domain binding.
security:
  - workloadOidc: [erp:read]
x-baobab-context-contract: ../../control-plane/v1/access-token-claims.schema.json
paths:
  /provisioning-operations:
    post:
      operationId: requestErpProvisioning
      summary: Request configuration-driven ERP capability provisioning
      description: >-
        The request names the exact Control Plane plan that authorises it (control_plane_authority: tenant_provisioning_id,
        plan_id, plan_version, plan_digest). ERP reads Control Plane's ERP assignment for each legal entity and provisions
        only when the tenant, the provisioning, that exact plan id, version and digest, and the legal entity all agree;
        otherwise it answers 409 with the problem code PLAN_AUTHORITY_MISMATCH and provisions nothing, so a replan between
        approval and execution can never change what ERP executes. Requested countries and currencies are intent, not
        authority. The accounting configuration comes from a Finance-approved baseline, never from the request or from
        Control Plane. Replaying the same Idempotency-Key with the same request returns the prior operation.
        Tenant authority is a trusted Control Plane context (context_id, required): the tenant_id in the body must equal
        the validated context's tenant, and context authority and plan authority are independent, so a valid context
        never replaces the plan tuple nor the tuple a context. context_id is authorisation evidence, not part of the
        request's identity: a replay with the same Idempotency-Key and request but a fresh context_id (contexts expire)
        returns the prior operation. A context that cannot be validated for the caller is 403 ERP_CONTEXT_REJECTED
        whatever the reason (the reasons are deliberately indistinguishable); a missing or malformed context_id is 400;
        Control Plane being unreachable is 503 and nothing is provisioned. Provisioning acts for a tenant that is not yet
        ACTIVE, so the context must be a TENANT_PROVISIONING context (control-plane/v1 authority_purpose) whose
        provisioning_authority equals control_plane_authority member by member (tenant_provisioning_id, plan_id,
        plan_version, plan_digest); a RUNTIME context, or a provisioning context bound to any other plan, is refused as
        403 ERP_CONTEXT_REJECTED and nothing is provisioned, and that refusal is as indistinguishable as every other.
        The accounting configuration is the Finance-approved baseline of each legal entity, which this request REFERS to and
        never carries: finance_baselines names, for every legal entity, the exact baseline version (baseline_id, version,
        digest) relied on, and ERP re-resolves each against its own authoritative store before provisioning anything. A
        reference ERP does not hold exactly (unknown baseline, another version or digest, another legal entity, a
        legal entity of another tenant or outside this provisioning, or a baseline ERP does not own) is 409
        FINANCE_BASELINE_MISMATCH; an exact reference whose version is not EFFECTIVE (withdrawn,
        superseded or not yet effective) is 409 FINANCE_BASELINE_NOT_USABLE; functional_currencies that differ from the
        referenced baselines' is 409 PLAN_AUTHORITY_MISMATCH. Each refusal provisions nothing and is not retried.
      security:
        - workloadOidc: [erp:provision]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./provisioning-request.schema.json }
      responses:
        "202":
          description: Provisioning accepted or the prior idempotent result returned
          content:
            application/json:
              schema: { $ref: ./provisioning-state.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /provisioning-operations/{operation_id}:
    get:
      operationId: getErpProvisioningOperation
      summary: Query current provisioning state
      description: >-
        An operation's state is tenant-scoped, so a caller must not obtain it merely by knowing its operation_id:
        context_id is required, and the operation is returned only when it belongs to the tenant of the context
        validated for the caller (otherwise 404). A context that cannot be validated for the caller is 403
        ERP_CONTEXT_REJECTED; Control Plane being unreachable is 503. The context must be a TENANT_PROVISIONING
        context (control-plane/v1 authority_purpose) whose provisioning_authority equals the control_plane_authority the
        operation was accepted under; a RUNTIME context, or one bound to another provisioning or plan, is 403
        ERP_CONTEXT_REJECTED. This operation requires erp:provision, not
        erp:read: observing a provisioning operation is part of provisioning, so the identity that submits one can
        follow it without holding the erp:read scope of ERP's business data reads (mappings, order consequences,
        inventory availability). ERP also publishes com.baobab-platform.erp.provisioning.changed.v1; observing that
        event is the normal way to follow an operation, and this query is its recovery and reconciliation fallback.
      security:
        - workloadOidc: [erp:provision]
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/ContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Current operation state
          content:
            application/json:
              schema: { $ref: ./provisioning-state.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /legal-entities/{legal_entity_id}/effective-finance-baseline:
    get:
      operationId: getEffectiveFinanceBaseline
      summary: Resolve the Finance baseline version in force for a legal entity
      description: >-
        Names the approved Finance baseline version that is EFFECTIVE for the legal entity on effective_on (default: today,
        UTC), so a caller can reference it in a provisioning request. ERP is the authority: this operation reads, and
        never creates, approves or infers a baseline, and a legal entity with no approved baseline in force is 404
        (Control Plane must not provision it; Finance approves a baseline in ERP first). Like the provisioning operations
        it requires erp:provision and a TENANT_PROVISIONING context (control-plane/v1 authority_purpose), because it
        serves provisioning of a tenant that is not yet ACTIVE; a RUNTIME context is 403 ERP_CONTEXT_REJECTED, as is any
        context that cannot be validated for the caller. The legal entity must belong to the tenant of the validated
        context, and one that does not is indistinguishable from one that does not exist (404). Control Plane being
        unreachable is 503. Only functional_currency of the accounting configuration is disclosed.
      security:
        - workloadOidc: [erp:provision]
      parameters:
        - $ref: "#/components/parameters/LegalEntityId"
        - name: effective_on
          in: query
          required: false
          description: The date on which the baseline must be in force (a calendar date, UTC). Defaults to today.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/ContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The baseline version in force
          content:
            application/json:
              schema: { $ref: ./finance-baseline.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /finance-baselines/{baseline_id}:
    get:
      operationId: getFinanceBaseline
      summary: Resolve one exact Finance baseline version
      description: >-
        Resolves exactly the version and digest named, never "the latest" and never whatever finance configuration ERP
        holds now. An unknown baseline, or one that belongs to a legal entity outside the validated context's tenant, is
        404 (indistinguishable). A known baseline whose version does not exist, or whose digest for that version differs, is
        409 FINANCE_BASELINE_MISMATCH. A matching baseline is returned with its current status whatever that is, so a caller and
        an auditor can see that a version was SUPERSEDED or WITHDRAWN; whether a version may be PROVISIONED against is
        decided by POST /provisioning-operations (409 FINANCE_BASELINE_NOT_USABLE unless EFFECTIVE). It requires
        erp:provision and a TENANT_PROVISIONING context exactly as getEffectiveFinanceBaseline does (a RUNTIME context, or
        any context that cannot be validated for the caller, is 403 ERP_CONTEXT_REJECTED; Control Plane being unreachable is
        503), and discloses only functional_currency of the accounting configuration.
      security:
        - workloadOidc: [erp:provision]
      parameters:
        - $ref: "#/components/parameters/FinanceBaselineId"
        - name: version
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/version }
        - name: digest
          in: query
          required: true
          schema: { $ref: ./finance-baseline.schema.json#/$defs/financeBaselineDigest }
        - $ref: "#/components/parameters/ContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The exact baseline version, with its current status
          content:
            application/json:
              schema: { $ref: ./finance-baseline.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /mappings/{mapping_id}:
    get:
      operationId: getErpMapping
      summary: Query public canonical-to-ERP mapping metadata
      description: Vendor bindings and iDempiere internal identifiers are never returned.
      parameters:
        - $ref: "#/components/parameters/MappingId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Mapping visible within the authorised tenant context
          content:
            application/json:
              schema: { $ref: ./mapping.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mappings:
    get:
      operationId: findErpMappings
      summary: Find every active or historical ERP mapping for one canonical resource
      description: A canonical resource may have several temporal ERP mappings. Results never expose vendor bindings.
      parameters:
        - name: owner
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/canonicalReference/properties/owner }
        - name: resource_type
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/canonicalReference/properties/resource_type }
        - name: resource_id
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/canonicalResourceId }
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Authorised temporal mappings, including an empty result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /order-consequences/{commerce_order_id}:
    get:
      operationId: getOrderConsequenceStatus
      summary: Query the latest ERP consequence status for a Trade order
      description: >-
        Tenant authority is a trusted Control Plane context: context_id is required and the order is read only within
        the tenant of the context validated for the caller. A context that cannot be validated for the caller is 403
        ERP_CONTEXT_REJECTED; a missing or malformed context_id is 400; Control Plane being unreachable is 503. Business-data reads act only for an ACTIVE
        tenant, so the context must be a RUNTIME context: a TENANT_PROVISIONING context is refused as 403 ERP_CONTEXT_REJECTED.
      parameters:
        - $ref: "#/components/parameters/CommerceOrderId"
        - $ref: "#/components/parameters/ContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Latest status projection
          content:
            application/json:
              schema: { $ref: ./order-consequence-status.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /inventory-availability:
    get:
      operationId: queryInventoryAvailability
      summary: Query an ERP-owned physical availability projection
      description: |
        Request parameters conform to InventoryAvailabilityQuery (inventory-availability-query.schema.json).
        Query results respect warehouse-level granularity; Trade reservations remain Trade-owned (not included in availability).
        The figures are read from the engine's own physical inventory (ADR-ERP-015), never from a Baobab-side stock ledger and
        never from Trade; erp_allocated is quantity the engine has committed, not a commerce reservation, and erp_available is
        derived from them. Tenant authority is a trusted Control Plane context: context_id is required, and a context that
        cannot be validated for the caller is 403 ERP_CONTEXT_REJECTED; as for every business-data read the context must
        be a RUNTIME context, and a TENANT_PROVISIONING context is refused the same way. An unmapped SKU or warehouse is 404. When the engine
        cannot be reached the answer is 503 and no figure is returned: the read can be retried and no stale or estimated
        quantity is substituted.
      parameters:
        - name: sku_id
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/canonicalResourceId }
          description: Canonical SKU identifier (from Trade or shared registry, never vendor or iDempiere reference)
        - name: warehouse_id
          in: query
          required: true
          schema: { $ref: ./domain.schema.json#/$defs/erpResourceId }
          description: ERP warehouse identifier (minted by Baobab ERP boundary, binds to iDempiere or ERPNext warehouse)
        - $ref: "#/components/parameters/ContextId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Current physical availability; Trade reservations remain Trade-owned
          content:
            application/json:
              schema: { $ref: ./inventory-availability.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        minLength: 16
        maxLength: 128
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: "^00-(?!00000000000000000000000000000000)[0-9a-f]{32}-(?!0000000000000000)[0-9a-f]{16}-[0-9a-f]{2}$"
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: { $ref: ./domain.schema.json#/$defs/operationId }
    MappingId:
      name: mapping_id
      in: path
      required: true
      schema: { $ref: ./domain.schema.json#/$defs/mappingId }
    ContextId:
      name: context_id
      in: query
      required: true
      description: >-
        The Control Plane PlatformContext (POST /v1/platform-context/resolve) that carries the tenant authority of this call.
        It is not a bearer credential: ERP asks Control Plane to validate it for the actual caller, presenting the caller's
        token as subject evidence, and uses only the tenant Control Plane returns.
      schema: { $ref: ../../control-plane/v1/domain.schema.json#/$defs/uuid }
    LegalEntityId:
      name: legal_entity_id
      in: path
      required: true
      schema: { $ref: ../../control-plane/v1/domain.schema.json#/$defs/legalEntityId }
    FinanceBaselineId:
      name: baseline_id
      in: path
      required: true
      schema: { $ref: ./finance-baseline.schema.json#/$defs/financeBaselineId }
    CommerceOrderId:
      name: commerce_order_id
      in: path
      required: true
      schema: { $ref: ./domain.schema.json#/$defs/canonicalResourceId }
  schemas:
    ProblemDetails: { $ref: ../../errors/v1/problem-details.schema.json }
    MappingCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: ./mapping.schema.json }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Tenant, entitlement or authority denied
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Resource not found within the authorised tenant context
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: >-
        Incompatible state or idempotency replay. Problem codes of the provisioning operations: PLAN_AUTHORITY_MISMATCH
        (the request disagrees with the approved Control Plane plan or the Finance baselines' currencies),
        FINANCE_BASELINE_MISMATCH (a Finance baseline reference is not what ERP holds), FINANCE_BASELINE_NOT_USABLE (the exact
        baseline version is withdrawn, superseded or not yet effective) and IDEMPOTENCY_KEY_REUSED. None is retryable
        with the same request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ServiceUnavailable:
      description: |
        A dependency this operation needs is temporarily unavailable (for example Control Plane's ERP assignment or the
        Finance baseline store), so nothing was provisioned and the same request can be retried with the same
        Idempotency-Key. This is an implemented capability that is temporarily unavailable; it is distinct from 501,
        where the capability is absent from this engine release. For a read, the dependency is the engine itself: no
        figure is returned and the read can be retried.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotImplemented:
      description: |
        The ERP provider recognises this canonical boundary operation, but the backing capability is not
        implemented in this engine release. This is not a transient outage and must not be interpreted as
        production readiness: 501 means the implementation or capability is absent, whereas 503 means an
        implemented capability is temporarily unavailable. An engine release that claims a capability and
        answers 501 for its operation is not ready and must not be certified for that capability.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
  securitySchemes:
    workloadOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.baobab-platform.com/.well-known/openid-configuration
      description: >-
        Short-lived workload or delegated identity token transported over the infrastructure-owned mTLS path. For the
        six operations that take a context_id (provisioning command and state, the two Finance baseline reads
        getEffectiveFinanceBaseline and getFinanceBaseline, order consequences, inventory availability) the tenant authority is a trusted Control Plane context, never this token alone: ERP validates
        the context for the actual caller through Control Plane (POST /v1/platform-context/validate, presenting this
        token as subject evidence), a token tenant_id is optional and, when present, must equal the validated
        context's tenant, and a tenant named in a request or by a scope is never authority. The mapping reads
        (getErpMapping, findErpMappings) still take the tenant from the token's tenant_id claim until a separate
        decision.

asyncapi: 3.1.0
info:
  title: Baobab-Platform Baobab TradeLane lifecycle events
  version: 1.0.0
  description: >
    TradeLane lifecycle events (Gate ZB-01, ADR-SHARED-008 SS5). Uses the
    same canonical event envelope and com.baobab-platform.<context>.<...>.v<N>
    naming convention already shipped for identity, ERP, supplier-onboarding,
    capability and product events. No message broker exists yet anywhere in
    this ecosystem to carry these; this contract exists so producers and
    future consumers have a stable shape to build against once one does.
defaultContentType: application/json
channels:
  tradeLaneEvents:
    address: baobab-platform.trade-lane.events.v1
    messages:
      tradeLaneActivated: { $ref: "#/components/messages/TradeLaneActivated" }
      tradeLaneSuspended: { $ref: "#/components/messages/TradeLaneSuspended" }
operations:
  publishTradeLaneEvents:
    action: send
    channel: { $ref: "#/channels/tradeLaneEvents" }
components:
  messages:
    TradeLaneActivated:
      name: com.baobab-platform.market.trade-lane.activated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/tradeLaneActivatedEventData }
    TradeLaneSuspended:
      name: com.baobab-platform.market.trade-lane.suspended.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/tradeLaneSuspendedEventData }

asyncapi: 3.1.0
info:
  title: Baobab-Platform Baobab IntercompanyTransaction lifecycle events
  version: 1.0.0
  description: >
    IntercompanyTransaction lifecycle events (Gate ZB-01, ADR-SHARED-008
    SS5). Uses the same canonical event envelope and
    com.baobab-platform.<context>.<...>.v<N> naming convention already shipped for
    identity, ERP, supplier-onboarding, capability and product events. No
    message broker exists yet anywhere in this ecosystem to carry these;
    this contract exists so producers and future consumers have a stable
    shape to build against once one does.
defaultContentType: application/json
channels:
  intercompanyTransactionEvents:
    address: baobab-platform.intercompany.events.v1
    messages:
      intercompanyTransactionInitiated: { $ref: "#/components/messages/IntercompanyTransactionInitiated" }
      intercompanyTransactionSettled: { $ref: "#/components/messages/IntercompanyTransactionSettled" }
operations:
  publishIntercompanyTransactionEvents:
    action: send
    channel: { $ref: "#/channels/intercompanyTransactionEvents" }
components:
  messages:
    IntercompanyTransactionInitiated:
      name: com.baobab-platform.internal-trade.intercompany-transaction.initiated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/intercompanyTransactionInitiatedEventData }
    IntercompanyTransactionSettled:
      name: com.baobab-platform.internal-trade.intercompany-transaction.settled.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/intercompanyTransactionSettledEventData }

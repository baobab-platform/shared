asyncapi: 3.1.0
info:
  title: Nabhold Baobab product and subscription lifecycle events
  version: 1.0.0
  description: >
    Product, ProductVersion, ProductSubscription and EntitlementProjection
    lifecycle events (Technical Specification SS31, SS88, SS91). Uses the
    same canonical event envelope and com.nabhold.<context>.<...>.v<N>
    naming convention already shipped for identity, ERP, supplier-onboarding
    and capability events (see ADR-SHARED-008) — this package does not
    introduce a different naming scheme. As with contracts/capability/v1,
    no message broker exists yet anywhere in this ecosystem to carry these;
    this contract exists so producers and future consumers have a stable
    shape to build against once one does.
defaultContentType: application/json
channels:
  productEvents:
    address: nabhold.product.events.v1
    messages:
      productCreated: { $ref: "#/components/messages/ProductCreated" }
      productDeprecated: { $ref: "#/components/messages/ProductDeprecated" }
      productVersionPublished: { $ref: "#/components/messages/ProductVersionPublished" }
      productVersionDeprecated: { $ref: "#/components/messages/ProductVersionDeprecated" }
      subscriptionCreated: { $ref: "#/components/messages/SubscriptionCreated" }
      subscriptionActivated: { $ref: "#/components/messages/SubscriptionActivated" }
      subscriptionSuspended: { $ref: "#/components/messages/SubscriptionSuspended" }
      subscriptionCancelled: { $ref: "#/components/messages/SubscriptionCancelled" }
      entitlementProjectionUpdated: { $ref: "#/components/messages/EntitlementProjectionUpdated" }
operations:
  publishProductEvents:
    action: send
    channel: { $ref: "#/channels/productEvents" }
components:
  messages:
    ProductCreated:
      name: com.nabhold.product.product.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/productLifecycleEventData }
    ProductDeprecated:
      name: com.nabhold.product.product.deprecated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/productLifecycleEventData }
    ProductVersionPublished:
      name: com.nabhold.product.product-version.published.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/productVersionLifecycleEventData }
    ProductVersionDeprecated:
      name: com.nabhold.product.product-version.deprecated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/productVersionLifecycleEventData }
    SubscriptionCreated:
      name: com.nabhold.product.subscription.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/subscriptionLifecycleEventData }
    SubscriptionActivated:
      name: com.nabhold.product.subscription.activated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/subscriptionLifecycleEventData }
    SubscriptionSuspended:
      name: com.nabhold.product.subscription.suspended.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/subscriptionLifecycleEventData }
    SubscriptionCancelled:
      name: com.nabhold.product.subscription.cancelled.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/subscriptionLifecycleEventData }
    EntitlementProjectionUpdated:
      name: com.nabhold.product.entitlement-projection.updated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/entitlementProjectionEventData }

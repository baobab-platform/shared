asyncapi: 3.1.0
info:
  title: Baobab-Platform control-plane events
  version: 1.1.0
  description: Versioned tenant lifecycle events using the canonical Baobab cross-engine envelope.
defaultContentType: application/json
channels:
  tenantLifecycle:
    address: baobab-platform.control-plane.tenant.v1
    messages:
      provisioningStarted:
        $ref: "#/components/messages/ProvisioningStarted"
      provisioningStateChanged:
        $ref: "#/components/messages/ProvisioningStateChanged"
operations:
  publishTenantLifecycle:
    action: send
    channel:
      $ref: "#/channels/tenantLifecycle"
components:
  messages:
    ProvisioningStarted:
      name: com.baobab-platform.control-plane.tenant.provisioning-started.v1
      payload:
        allOf:
          - $ref: ./event-envelope.schema.json
          - type: object
            properties:
              data:
                $ref: ./provisioning-started.schema.json
    ProvisioningStateChanged:
      name: com.baobab-platform.control-plane.tenant.provisioning-state-changed.v1
      payload:
        allOf:
          - $ref: ./event-envelope.schema.json
          - type: object
            properties:
              data:
                $ref: ./provisioning-state-changed.schema.json

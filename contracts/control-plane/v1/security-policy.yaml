schema:
  name: "baobab-control-plane-security-policy"
  version: "1.0"
tokens:
  signature:
    asymmetric_only: true
    allowed_algorithms: ["RS256", "ES256"]
  validation:
    required_claims: ["iss", "sub", "aud", "exp", "iat", "jti", "scope", "actor_type"]
    clock_skew_seconds: 30
    maximum_token_lifetime_seconds: 900
    jwks_rotation_required: true
  audience: "baobab-control-plane"
authorization:
  management:
    actor_type: "human"
    scopes:
      register_tenant: "tenant:write"
  context_resolution:
    scopes:
      resolve: "context:resolve"
transport:
  workload_to_control_plane:
    mtls_required: true
    termination_owner: "baobab-platform/infrastructure"
    application_token_required: true
    caller_identity_headers_authoritative: false
audit:
  required_fields: ["actor_id", "actor_type", "action", "target", "timestamp", "correlation_id", "idempotency_key", "result", "policy_decision"]
failure_posture:
  unknown_principal: "deny"
  invalid_token: "deny"
  missing_scope: "deny"
  unavailable_jwks_without_cached_key: "deny"

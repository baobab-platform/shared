openapi: 3.1.0
info:
  title: Governed estate resource assignment
  version: 1.0.0
  description: >-
    Control Plane operations through which a Digital Estate's provenance is
    established for native commitments that do not arrive through a governed
    BFF (ADR-SHARED-042 section 14, Decision 9, Platform Owner ruling of 23
    October 2026). Humans propose, approve (four-eyes), suspend, reinstate and
    revoke assignments; a Trade workload resolves a short-lived attestation
    for one native commitment operation. These are operations, not catalogued
    capabilities: no capability key is registered for them.


    For every resolve request the Control Plane MUST: (1) verify the caller's
    own workload token, its registered ACTIVE workload and the operation
    scope; (2) for WORKLOAD, verify and introspect the server application's
    own IAM workload token itself, and for NATIVE_RESOURCE, verify the native
    configuration against its own record of Trade's Trade-0 attestation for
    the calling engine instance; (3) select only ACTIVE, approved, currently
    effective assignments of that exact subject, estate, engine instance,
    Market and operation; and (4) attest exactly one, or deny. Ambiguity is
    never resolved by order. A Medusa key, sales channel, domain or asserted
    estate is never provenance. An attestation establishes estate provenance
    only; the commerce model still comes from resolveEstateCommerceProfile,
    and no seller, buyer, market or purchasing authority is granted.
paths:
  /internal/estate/v1/resource-assignments/resolve:
    post:
      operationId: resolveEstateResourceAssignment
      summary: Attest the governed estate provenance of one non-BFF native commitment operation
      description: >-
        Read-only. Returns an EstateResourceAssignmentAttestation valid for at
        most 60 seconds, recorded by CP before it is returned.
      security:
        - EstateAssignmentWorkload: ["estate:resource-assignment:resolve"]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignmentResolveRequest
      responses:
        "200":
          description: Attested.
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignmentAttestation
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >-
            CALLER_NOT_PERMITTED, WORKLOAD_EVIDENCE_INVALID,
            NATIVE_RESOURCE_NOT_ATTESTED, ASSIGNMENT_NOT_ACTIVE,
            OPERATION_NOT_PERMITTED, MARKET_NOT_PERMITTED or
            ENGINE_INSTANCE_NOT_PERMITTED.
          content:
            application/problem+json:
              schema: { $ref: ../../errors/v1/problem-details.schema.json }
        "404":
          description: ASSIGNMENT_NOT_FOUND.
          content:
            application/problem+json:
              schema: { $ref: ../../errors/v1/problem-details.schema.json }
        "409":
          description: ASSIGNMENT_AMBIGUOUS. Nothing is attested.
          content:
            application/problem+json:
              schema: { $ref: ../../errors/v1/problem-details.schema.json }
        "503":
          description: RESOLUTION_UNAVAILABLE. Never a fallback.
          content:
            application/problem+json:
              schema: { $ref: ../../errors/v1/problem-details.schema.json }
  /v1/estate/resource-assignments:
    post:
      operationId: proposeEstateResourceAssignment
      summary: Propose a governed estate resource assignment
      description: >-
        Creates a PROPOSED assignment at revision 1, proposed by the verified
        human caller. CP derives the Tenant from the estate. A proposal is
        never attested.
      security:
        - adminOidc: ["estate:resource-assignment:write"]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignmentProposal
      responses:
        "201":
          $ref: "#/components/responses/Assignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/estate/resource-assignments/{assignment_id}:
    get:
      operationId: getEstateResourceAssignment
      summary: Read one assignment
      security:
        - adminOidc: ["estate:resource-assignment:write"]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/Assignment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/estate/resource-assignments/{assignment_id}/approval-transitions:
    post:
      operationId: approveOrReinstateEstateResourceAssignment
      summary: Approve or reinstate an assignment after independent four-eyes review
      description: >-
        APPROVE and REINSTATE only. Requires approval scope, current revision, independent human approver and a nonoverlapping assignment; REVOKED is terminal.
      security:
        - adminOidc: ["estate:resource-assignment:approve"]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignmentTransition
                - type: object
                  properties:
                    action: { enum: [APPROVE, REINSTATE] }
      responses:
        "200":
          $ref: "#/components/responses/Assignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict
  /v1/estate/resource-assignments/{assignment_id}/restriction-transitions:
    post:
      operationId: suspendOrRevokeEstateResourceAssignment
      summary: Suspend or revoke an assignment to stop future attestations
      description: >-
        SUSPEND and REVOKE only. Requires write scope and current revision; revoked is terminal. The status change makes future attestations unavailable immediately.
      security:
        - adminOidc: ["estate:resource-assignment:write"]
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignmentTransition
                - type: object
                  properties:
                    action: { enum: [SUSPEND, REVOKE] }
      responses:
        "200":
          $ref: "#/components/responses/Assignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Must equal the body correlation_id where the body carries one.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    AssignmentId:
      name: assignment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Assignment:
      description: The assignment after the operation.
      content:
        application/json:
          schema:
            $ref: estate-resource-assignment.schema.json#/$defs/EstateResourceAssignment
    Problem:
      description: Malformed request (unknown field, invalid scope combination or correlation mismatch).
      content:
        application/problem+json:
          schema: { $ref: ../../errors/v1/problem-details.schema.json }
    Unauthenticated:
      description: The caller's own token is missing or invalid.
      content:
        application/problem+json:
          schema: { $ref: ../../errors/v1/problem-details.schema.json }
    Forbidden:
      description: The caller lacks the scope, or SELF_APPROVAL.
      content:
        application/problem+json:
          schema: { $ref: ../../errors/v1/problem-details.schema.json }
    NotFound:
      description: No such assignment.
      content:
        application/problem+json:
          schema: { $ref: ../../errors/v1/problem-details.schema.json }
    Conflict:
      description: REVISION_CONFLICT, ASSIGNMENT_OVERLAP, ASSIGNMENT_TERMINAL or an idempotency key reused with a different body.
      content:
        application/problem+json:
          schema: { $ref: ../../errors/v1/problem-details.schema.json }
  securitySchemes:
    EstateAssignmentWorkload:
      type: oauth2
      description: A Baobab workload token issued for audience baobab-control-plane.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            "estate:resource-assignment:resolve": Read-only estate resource assignment attestation.
    adminOidc:
      type: openIdConnect
      description: A Baobab human administrator token issued for audience baobab-control-plane.
      openIdConnectUrl: /.well-known/openid-configuration

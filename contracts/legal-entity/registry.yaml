# ==============================================================================
# NABHOLD GROUP AFRICA
# Canonical Legal Entity Registry
#
# Target path: baobab-platform/shared/contracts/legal-entity/registry.yaml
#
# Purpose
# -------
# This is the single source of truth for legal-entity identity across every
# Baobab-Platform system. It exists to prevent the same entity acquiring different
# names in different repositories (e.g. "thamani", "THAMANI", "thamani-global",
# "THG", "tenant-002" all referring to the same company).
#
# Every downstream system MUST reference `id` from this file. No repository
# may invent its own spelling of a legal-entity identifier.
#
# Consumers of this contract
# ---------------------------
#   baobab-platform/baobab-cp        -> tenant.entity_id references an `id` below
#   baobab-platform/infrastructure   -> resource ownership tags reference an `id` below
#   baobab-platform/{nabhold,zuribeans,thamani,equator-estate}
#                             -> each repo's own config declares which `id`
#                                it represents (self-reference, exactly one)
#
# Governance tier
# ----------------
# This is a GOVERNANCE contract (see ADR-0001 section 2.5): it declares
# identity and approved product-consumption intent, not runtime tenancy state
# or implementation. The Control Plane remains authoritative for provisioned
# tenants and enforced entitlements. This registry must never contain cloud
# resource names, database connection strings, or infrastructure specifics.
#
# Versioning
# ----------
# The registry schema is versioned independently of any individual entity's
# data. Adding a new entity is a MINOR schema change. Removing/renaming an
# `id` that is already referenced elsewhere is a BREAKING change and requires
# coordinated updates across baobab, infrastructure, and the affected
# digital estate repo before merge.
#
# Data completeness
# ------------------
# Fields marked `null  # TBD` are intentionally left unpopulated. They must
# be completed by an authoritative source (Legal / Company Secretarial) before
# this contract is relied upon for compliance, billing, or regulatory purposes.
# No value has been guessed or fabricated to fill these fields.
#
# Governing decision record: ADR-0001 (baobab-platform/shared/docs/adr/)
# ==============================================================================

schema:
  name: "baobab-platform-legal-entity-registry"
  version: "1.1"

# ------------------------------------------------------------------------------
# Entities
# ------------------------------------------------------------------------------

entities:

  # ---------------------------------------------------------------------------
  - id: "NABHOLD"
    legal_name: "Nabhold Group Africa"
    role: "holding_company"

    jurisdiction: null            # TBD — pending Legal / Company Secretarial
    registration_identifier: null # TBD — pending Legal / Company Secretarial

    business_model: null          # not applicable — holding company, not an
                                   # operating subsidiary

    baobab_tenant: true           # Approved consumption intent. The Control
                                   # Plane must still provision a distinct
                                   # tenant_id and ERP entitlement; this value
                                   # does not make entity_id a tenant identity.

    digital_estate:
      repository: "baobab-platform/nabhold"
      status: "planned"           # repository created, implementation pending

    baobab_products:
      - product: "baobab-erp"
        confirmed: true           # approved 2026-09-01: the holding company
                                   # requires ERP capability independently of
                                   # its corporate digital estate

  # ---------------------------------------------------------------------------
  - id: "ZURIBEANS"
    legal_name: "Zuribeans"
    role: "subsidiary"
    legacy_aliases: ["zuribeans_za"] # accepted only at migration input boundaries

    jurisdiction: null            # TBD
    registration_identifier: null # TBD

    business_model: "B2B"
    baobab_tenant: true

    digital_estate:
      repository: "baobab-platform/zuribeans"
      status: "active"

    baobab_products:
      - product: "baobab-trade"
        confirmed: true            # confirmed by Chief Software Engineer
                                    # 2026-08-26

    markets: []                    # populated only after the canonical market.
                                    # region and domain contract is approved

  # ---------------------------------------------------------------------------
  - id: "THAMANI-GLOBAL"
    legal_name: "Thamani Global"
    role: "subsidiary"

    jurisdiction: null            # TBD
    registration_identifier: null # TBD

    business_model: "B2C"
    baobab_tenant: true

    digital_estate:
      repository: "baobab-platform/thamani"
      status: "planned"

    baobab_products:
      - product: "baobab-trade"
        confirmed: true            # confirmed by Chief Software Engineer
                                    # 2026-08-26

    markets: []

  # ---------------------------------------------------------------------------
  - id: "EQUATOR-ESTATE"
    legal_name: "Equator & Estate Co."
    role: "subsidiary"

    jurisdiction: null            # TBD
    registration_identifier: null # TBD

    business_model: "B2B2C"
    baobab_tenant: true

    digital_estate:
      repository: "baobab-platform/equator-estate"
      status: "planned"

    baobab_products:
      - product: "property-intelligence"
        confirmed: false           # INFERRED, not yet explicitly confirmed —
                                    # see ADR-0001 section 2.3, open item 3

    markets: []

# ------------------------------------------------------------------------------
# Cross-cutting products
#
# Products consumed by more than one entity as a shared substrate rather than
# a per-tenant capability are declared here, not repeated on every entity.
# ------------------------------------------------------------------------------

cross_cutting_products:

  - product: "baobab-intelligence-engine"
    short_name: "BIE"
    consumed_by: "all_baobab_tenants"
    confirmed: false               # INFERRED, not yet explicitly confirmed —
                                    # see ADR-0001 section 2.3, open item 3

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------

notes:
  - >
    `baobab_tenant` records approved platform-consumption intent for bootstrap
    and reconciliation. It is not runtime tenant state. `baobab-platform/baobab-cp`
    owns the provisioned tenant_id, lifecycle, and enforced product
    entitlements, and must map them explicitly to an entity id in this registry.
  - >
    A digital estate does not confer tenancy. NABHOLD is tenant-eligible because
    it consumes Baobab ERP, not because `baobab-platform/nabhold` exists. The estate and
    ERP tenant may be deployed, released, and secured independently.
  - >
    This registry declares identity, not infrastructure. It must not be
    extended with cloud resource identifiers, connection strings, or
    deployment topology — those belong in `baobab-platform/infrastructure`, which
    references entities here by `id` only.
  - >
    "confirmed: false" markers are not placeholders to be silently flipped
    to true. They must be updated only after explicit confirmation from an
    authoritative source, per this project's evidence-before-action standard.

asyncapi: 3.1.0
info:
  title: Baobab-Platform Baobab Shipment lifecycle events
  version: 1.0.0
  description: >
    Shipment lifecycle events (Gate ZB-01, ADR-SHARED-008 SS5). Uses the
    same canonical event envelope and com.baobab-platform.<context>.<...>.v<N>
    naming convention already shipped for identity, ERP, supplier-onboarding,
    capability and product events. No message broker exists yet anywhere in
    this ecosystem to carry these; this contract exists so producers and
    future consumers have a stable shape to build against once one does.
defaultContentType: application/json
channels:
  shipmentEvents:
    address: baobab-platform.shipment.events.v1
    messages:
      shipmentCreated: { $ref: "#/components/messages/ShipmentCreated" }
      shipmentStatusChanged: { $ref: "#/components/messages/ShipmentStatusChanged" }
      shipmentDelivered: { $ref: "#/components/messages/ShipmentDelivered" }
operations:
  publishShipmentEvents:
    action: send
    channel: { $ref: "#/channels/shipmentEvents" }
components:
  messages:
    ShipmentCreated:
      name: com.baobab-platform.trade.shipment.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/shipmentCreatedEventData }
    ShipmentStatusChanged:
      name: com.baobab-platform.trade.shipment.status-changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/shipmentStatusChangedEventData }
    ShipmentDelivered:
      name: com.baobab-platform.trade.shipment.delivered.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/shipmentDeliveredEventData }

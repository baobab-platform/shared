asyncapi: 3.1.0
info:
  title: Nabhold Baobab Quotation lifecycle events
  version: 1.0.0
  description: >
    Quotation lifecycle events (Gate ZB-01, ADR-SHARED-008 SS5). Uses the
    same canonical event envelope and com.nabhold.<context>.<...>.v<N>
    naming convention already shipped for identity, ERP, supplier-onboarding,
    capability and product events. No message broker exists yet anywhere in
    this ecosystem to carry these; this contract exists so producers and
    future consumers have a stable shape to build against once one does.
defaultContentType: application/json
channels:
  quotationEvents:
    address: nabhold.quotation.events.v1
    messages:
      quotationSubmitted: { $ref: "#/components/messages/QuotationSubmitted" }
      quotationAccepted: { $ref: "#/components/messages/QuotationAccepted" }
      quotationRejected: { $ref: "#/components/messages/QuotationRejected" }
operations:
  publishQuotationEvents:
    action: send
    channel: { $ref: "#/channels/quotationEvents" }
components:
  messages:
    QuotationSubmitted:
      name: com.nabhold.commercial.quotation.submitted.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/quotationSubmittedEventData }
    QuotationAccepted:
      name: com.nabhold.commercial.quotation.accepted.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/quotationDecidedEventData }
    QuotationRejected:
      name: com.nabhold.commercial.quotation.rejected.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/quotationDecidedEventData }

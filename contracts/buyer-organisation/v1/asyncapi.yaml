asyncapi: 3.1.0
info:
  title: Nabhold Baobab buyer-organisation lifecycle events
  version: 1.0.0
  description: >
    BuyerOrganisation lifecycle events (Gate ZB-01, ADR-SHARED-008 SS5). Uses
    the same canonical event envelope and com.nabhold.<context>.<...>.v<N>
    naming convention already shipped for identity, ERP, supplier-onboarding,
    capability and product events. No message broker exists yet anywhere in
    this ecosystem to carry these; this contract exists so producers and
    future consumers have a stable shape to build against once one does.
defaultContentType: application/json
channels:
  buyerOrganisationEvents:
    address: nabhold.buyer-organisation.events.v1
    messages:
      buyerOrganisationRegistered: { $ref: "#/components/messages/BuyerOrganisationRegistered" }
      buyerOrganisationStatusChanged: { $ref: "#/components/messages/BuyerOrganisationStatusChanged" }
operations:
  publishBuyerOrganisationEvents:
    action: send
    channel: { $ref: "#/channels/buyerOrganisationEvents" }
components:
  messages:
    BuyerOrganisationRegistered:
      name: com.nabhold.customer.buyer-organisation.registered.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/buyerOrganisationRegisteredEventData }
    BuyerOrganisationStatusChanged:
      name: com.nabhold.customer.buyer-organisation.status-changed.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/buyerOrganisationStatusChangedEventData }

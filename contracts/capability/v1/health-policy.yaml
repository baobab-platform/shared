# health-policy.yaml
# How a HealthObservation (health.schema.json) affects whether a binding
# or provider is eligible (ADR-SHARED-007 §37, ADR-BCP-006). This is step 1
# of scope-specificity.yaml: a candidate that fails this policy is never
# scored. Capability resolution, provider relocation and the provisioning
# planner apply the same rule, because the planner's candidates come from
# the same eligibility gate.

policy_version: 1

# A subject's effective health is the status of its newest observation,
# unless that observation has expired (now >= expires_at) or there is none.
# Then the effective health is UNKNOWN. An expired HEALTHY is not HEALTHY.
effective_status:
  expired_observation: UNKNOWN
  missing_observation: UNKNOWN

# A capability is critical for a request when its membership criticality
# in the composition being served or provisioned is one of these
# (composition.schema.json, domain.schema.json capabilityMembershipCriticality).
critical_membership_criticalities:
  - MANDATORY

# Effective statuses eligible for each class of capability. UNKNOWN is
# never eligible for a critical capability: absence of evidence is not
# evidence of health.
eligible_statuses:
  critical:
    - HEALTHY
    - DEGRADED
  non_critical:
    - HEALTHY
    - DEGRADED
    - UNKNOWN

# Denial codes the Control Plane returns when this policy excludes every
# candidate. Both are registered in reason-code-registry.yaml.
denial_reason_codes:
  resolution:
    UNKNOWN: PROVIDER_HEALTH_UNKNOWN
    UNAVAILABLE: PROVIDER_UNAVAILABLE
  provisioning: NO_HEALTHY_PROVIDER

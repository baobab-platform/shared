asyncapi: 3.1.0
info:
  title: Provider-neutral People workforce and payroll facts
  version: 1.0.0
  description: Canonical schemas; PROPOSED event types have no qualified producer or runtime authority.
defaultContentType: application/json
channels:
  peopleEvents:
    address: baobab-platform.people.events.v1
    messages:
      employmentProposalRecorded: { $ref: "#/components/messages/EmploymentProposalRecorded" }
      payrollEvidenceVerified: { $ref: "#/components/messages/PayrollEvidenceVerified" }
operations:
  publishPeopleEvents:
    action: send
    channel: { $ref: "#/channels/peopleEvents" }
components:
  messages:
    EmploymentProposalRecorded:
      name: com.baobab-platform.workforce.employment.proposal-recorded.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/employmentProposalRecorded }
    PayrollEvidenceVerified:
      name: com.baobab-platform.payroll.evidence.receipt-verified.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./events.schema.json#/$defs/payrollEvidenceVerified }

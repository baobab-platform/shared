# ==============================================================================
# BAOBAB-PLATFORM GROUP AFRICA
# Development Environment Contract — Schema
#
# Target path: baobab-platform/shared/contracts/development-environment/schema.yaml
#
# Purpose
# -------
# Defines the STRUCTURE that every repository's own environment declaration
# (`.baobab-platform/environment.yaml`) must conform to, and defines the named
# PROFILES available to declare against. This file is the schema; it is not
# itself a declaration for any single repository.
#
# This is a GOVERNANCE contract (ADR-0001 section 2.5): it fixes structure
# and validation rules, not specific tool versions. Specific versions live in
# `baobab-platform/baobab-dev`'s `config/versions.yaml` -> `versions.lock`, which
# remains the single source of truth for "what baobab-dev actually provides."
#
# Relationship between the pieces
# ---------------------------------
#   this schema                  -> "what may a declaration say?"
#   <repo>/.baobab-platform/environment.yaml
#                                 -> "what does THIS repo require?"
#   baobab-dev/config/versions.lock
#                                 -> "what does baobab-dev actually provide?"
#
# A compatibility validator (CI, to be implemented in baobab-platform/shared) reads
# a consuming repo's declaration, resolves its declared `profile`, and checks
# each required capability against versions.lock, filtered to that profile's
# capability domain subset (see `profiles` below).
#
# Consuming repositories (six, per ADR-0001 section 2.8a)
# -----------------------------------------------------------
#   baobab-platform/baobab            -> profile: full
#   baobab-platform/baobab-platform            \
#   baobab-platform/zuribeans           |
#   baobab-platform/thamani             |-> profile: frontend
#   baobab-platform/equator-estate     /
#   baobab-platform/infrastructure     -> profile: infra
#
# `baobab-platform/infrastructure` joined 2026-09-03 — it previously declared
# `profile: "full"` for lack of anything better (see `profiles.infra` below
# for why that was wrong for what it actually runs). Update ADR-0001 section
# 2.8a to match if it still enumerates only five.
#
# Every declaration file, regardless of repo, MUST live at the same relative
# path: `.baobab-platform/environment.yaml`. This is what allows one validator
# implementation to serve all six repos.
#
# Versioning
# ----------
# This schema is versioned independently of `baobab-dev`'s toolchain version
# and independently of any individual repo's declaration.
#
# Governing decision record: ADR-0001 (baobab-platform/shared/docs/adr/)
# ==============================================================================

schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"

# ------------------------------------------------------------------------------
# Provider
# ------------------------------------------------------------------------------

provider:
  name: "baobab-dev"
  repository: "baobab-platform/baobab-dev"
  source_of_truth: "config/versions.yaml -> config/versions.lock"

# ------------------------------------------------------------------------------
# Profiles
#
# A profile is a named subset of baobab-dev's capability domains (as defined
# in versions.yaml), mapped to a specific published image tag. Declarations
# reference a profile by name; they do not repeat its contents.
#
# STATUS NOTE: the `frontend` profile below references Turborepo and
# Playwright. As of this schema's authoring, NEITHER exists yet in
# baobab-dev's versions.yaml. The profile is defined here so the contract
# shape is ready, but it is not yet satisfiable — that is tracked as
# baobab-dev implementation work (ADR-0001 section 2.8a), not a defect in
# this schema.
# ------------------------------------------------------------------------------

profiles:

  full:
    description: >
      Everything baobab-dev provides. Used by repositories that build and
      run the full BAOBAB application stack (currently: baobab-platform/baobab only).
    image_tag_pattern: "ghcr.io/baobab-platform/baobab-dev:{version}"
    capability_domains:
      - "platform"           # e.g. ubuntu base
      - "languages"          # python, node, flutter
      - "database"           # postgresql client
      - "package_managers"   # uv, poetry, pnpm
      - "utilities"          # task, ripgrep, fd, bat, eza, jq, yq, fzf, tree, unzip, zip, xz
      - "development"        # docker, github_cli
      - "security"           # cosign
    source_domains_confirmed_present: true   # verified against versions.yaml
                                              # at time of authoring

  frontend:
    description: >
      Node/pnpm/Turborepo only — no browser binaries. Used for day-to-day
      interactive development (Codespaces) in customer-facing product
      frontends. Does not need Python, Flutter, or a PostgreSQL client
      locally (currently: baobab-platform/baobab-platform, zuribeans, thamani, equator-estate).
    image_tag_pattern: "ghcr.io/baobab-platform/baobab-dev:{version}-frontend"
    capability_domains:
      - "platform"                # shared base layer
      - "languages.node"          # node only — NOT python, NOT flutter
      - "package_managers.pnpm"   # pnpm only — NOT uv, NOT poetry
      - "utilities"                # generic CLI tools, same subset as `full`
      - "development.github_cli"  # git/gh — NOT necessarily docker
      - "frontend_tooling.turbo"   # Turborepo only in this profile
    source_domains_confirmed_present: true   # frontend_tooling.turbo now
                                              # present in versions.yaml

  frontend-e2e:
    description: >
      Extends `frontend` with browser-dependent tooling for end-to-end
      testing, visual/image processing, and performance auditing. Kept as
      a SEPARATE profile from `frontend` (not merged into it) specifically
      so daily interactive development never carries Playwright's browser
      binaries or their CVE surface — that cost is paid only in CI test
      jobs that actually need it.
    extends: "frontend"
    image_tag_pattern: "ghcr.io/baobab-platform/baobab-dev:{version}-frontend-e2e"
    capability_domains:
      - "frontend_tooling.playwright"
      - "frontend_tooling.sharp"
      - "frontend_tooling.lighthouse"
    source_domains_confirmed_present: true
    notes:
      - >
        `lighthouse` deliberately does not get its own browser install — it
        reuses the Chromium binary Playwright already downloads. Do not add
        a second Chromium install path for Lighthouse; if a future version
        of this profile needs that, treat it as a deliberate decision, not
        an accident of two tools each assuming they own browser provisioning.

  infra:
    description: >
      Terraform + AWS CLI only — no application language runtimes at all
      (no Python, Node, Flutter, or Java). Used for local development and
      testing of Terraform-managed AWS infrastructure (currently:
      baobab-platform/infrastructure only). Does NOT extend `full` or `frontend` —
      it shares no language/package-manager domain with either; it is a
      sibling branch off baobab-dev's shared base layer, not a subset or
      superset of another profile.
    image_tag_pattern: "ghcr.io/baobab-platform/baobab-dev:{version}-infra"
    capability_domains:
      - "platform"                  # shared base layer
      - "utilities"                 # generic CLI tools, same subset as `full`/`frontend`
      - "development.docker"        # Docker CLI + Compose + Buildx — NOT dockerd
      - "development.github_cli"
      - "development.terraform"
      - "development.aws_cli"
    source_domains_confirmed_present: true   # verified against baobab-dev's
                                              # own versions.yaml/
                                              # capabilities.yaml
                                              # (v1.4.0-rc.0), 2026-09-03
    notes:
      - >
        `kubectl`/Helm are deliberately NOT part of this profile —
        baobab-platform/infrastructure's own README defers Kubernetes/Helm/Temporal
        "until operational need justifies their additional machinery." Add
        them here only if that decision changes, not preemptively.

# ------------------------------------------------------------------------------
# Required structure of a per-repository declaration
# (`<repo>/.baobab-platform/environment.yaml`)
#
# This section defines what fields a declaration file MUST contain. It is
# schema, not an example for any specific repository.
# ------------------------------------------------------------------------------

declaration_requirements:

  schema:
    required: true
    fields: ["name", "version"]
    description: "Identifies which version of THIS schema the declaration targets."

  application:
    required: true
    fields:
      name:
        required: true
        description: "Repository identity, e.g. 'baobab', 'zuribeans'."
      entity_id:
        required: false
        description: >
          For the four digital-estate repos, SHOULD reference the matching
          `entity_id` from the legal-entity registry. Not applicable to
          `baobab` itself (a platform, not a tenant) or to
          `infrastructure` (org-wide provisioning, not a tenant either).
      version:
        required: true
        description: "Application/repo release version. NOT the environment version."

  environment:
    required: true
    fields:
      provider:
        required: true
        description: "MUST be 'baobab-dev'."
      profile:
        required: true
        # FIX (2026-09-03): this list was missing "frontend-e2e" — a
        # pre-existing gap unrelated to the "infra" addition below.
        # `frontend-e2e` has had its own `profiles.frontend-e2e` block
        # since the v1.1.0 rollout but was apparently never added here,
        # meaning a declaration setting `profile: "frontend-e2e"` would
        # have been schema-invalid even though the profile itself was
        # real and satisfiable. Caught while adding "infra" for the same
        # field; fixed together rather than filed as a separate issue,
        # since both are one-line additions to the same list.
        allowed_values: ["full", "frontend", "frontend-e2e", "infra"]
      minimum_version:
        required: true
        description: "Minimum baobab-dev release the repo can be developed against."
      contract_minimum_version:
        required: true
        description: "Minimum version of THIS schema the declaration was written against."

  compatibility_policy:
    required: true
    fields:
      strict_runtime_versions:
        required: true
        type: "boolean"
      allow_newer_patch_versions:
        required: true
        type: "boolean"
      allow_newer_minor_versions:
        required: true
        type: "boolean"
      allow_older_versions:
        required: true
        type: "boolean"
    description: >
      Carried forward unchanged from the original environment-contract draft.
      Every declaration MUST state its own policy explicitly — none of these
      default silently.

  validation:
    required: true
    fields:
      required_capabilities:
        required: true
        description: >
          List of capability names (drawn from the declared profile's
          `capability_domains`) that CI MUST verify before considering the
          repository's environment compatible.

# ------------------------------------------------------------------------------
# Validation obligation
# ------------------------------------------------------------------------------

validator_obligations:
  description: >
    A repository's `.baobab-platform/environment.yaml` MUST be validated against
    baobab-dev's `versions.lock`, filtered to the declared profile's
    `capability_domains`, on every CI run that could affect environment
    compatibility (at minimum: any change to the declaration file itself,
    and any baobab-dev release matching the declared profile).
  on_incompatibility: >
    CI MUST fail with an explicit statement of which capability was
    unsatisfied and what versions.lock actually provides — matching the
    existing baobab-verify pattern of structural failure over masked
    warnings (see baobab-dev's established "structural fixes over guards"
    principle).
  implementation_status: "not yet implemented — tracked for rollout step 2/3"

# ------------------------------------------------------------------------------
# Ownership
# ------------------------------------------------------------------------------

ownership:
  contract_schema:
    owner: "baobab-platform/shared"
  toolchain_implementation:
    owner: "baobab-platform/baobab-dev"
  full_profile_declaration:
    owner: "baobab-platform/baobab"
  frontend_profile_declarations:
    owner: "baobab-platform/baobab-platform, baobab-platform/zuribeans, baobab-platform/thamani, baobab-platform/equator-estate"
  infra_profile_declaration:
    owner: "baobab-platform/infrastructure"

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------

notes:
  - >
    This schema does not hardcode Python 3.14, Node 24, or any other actual
    version number. Those belong exclusively in baobab-dev's versions.yaml
    and in each repository's own declaration file.
  - >
    The `frontend` profile is defined but not yet satisfiable — see the
    status note under `profiles.frontend`. Do not mark any digital-estate
    repo's declaration as CI-validated against this schema until Turborepo
    and Playwright exist in baobab-dev's versions.yaml.
  - >
    If a repository's needs diverge from its profile's baseline (for example,
    if one digital-estate repo later needs a capability the others don't),
    that repository's own declaration file is the correct place to add it —
    not a change to the shared profile baseline, which would silently affect
    the other three repos.
  - >
    `frontend-e2e` is a CI-only profile, not a devcontainer profile. A
    digital-estate repo's `.baobab-platform/environment.yaml` declares
    `profile: frontend` for its everyday Codespaces environment; its CI
    workflow separately references the `*-frontend-e2e` image tag for
    end-to-end test jobs specifically. Do not set a repo's primary
    declaration to `frontend-e2e` — that would put browser binaries in
    every developer's daily container for no reason.
  - >
    [2026-09-03] Added the `infra` profile and its `baobab-platform/infrastructure`
    consumer. `infra` was verified satisfiable against baobab-dev's own
    versions.yaml/capabilities.yaml (v1.4.0-rc.0) at the time this note was
    written — confirm that release actually shipped before treating
    `baobab-platform/infrastructure`'s own declaration as CI-validated, same
    caution already applied to `frontend` above while it waited on
    Turborepo/Playwright.
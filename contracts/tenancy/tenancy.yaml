# =============================================================================
# BAOBAB-PLATFORM GROUP AFRICA
# Tenancy Contract
#
# Target path: baobab-platform/shared/contracts/tenancy/tenancy.yaml
#
# Purpose
# -------
# Declares what BAOBAB-PLATFORM considers a "tenant" of the Baobab platform, and the
# obligations that MUST hold for any system that provisions, serves, or
# decommissions one. This is a GOVERNANCE contract (ADR-0001 section 2.5):
# it states obligations, not implementation.
#
# This contract is a three-way relationship (ADR-0001 / prior tenancy
# discussion):
#
#   shared          -> declares the obligation
#                       ("tenant data MUST be isolated")
#   baobab-cp       -> owns tenant lifecycle, entitlement and context
#   product engines -> enforce resolved tenant context in their own boundaries
#   infrastructure  -> enforces the physical controls
#                       (network boundaries, secrets, storage isolation)
#
# It MUST NOT specify:
#   - a database isolation strategy (schema-per-tenant vs. row-level vs.
#     database-per-tenant) — that is a product-engine architecture decision
#   - a cloud resource, namespace, or credential — that is an
#     `infrastructure` decision
#
# Relationship to other contracts
# --------------------------------
#   legal-entity/registry.yaml  -> remains the Nabhold first-party governance
#                                  source for NABHOLD, ZURIBEANS, THAMANI-GLOBAL
#                                  and EQUATOR-ESTATE identities (ADR-BCP-018).
#                                  It is NOT a mandatory registry for external
#                                  customer legal entities.
#   organisation/v1/*           -> generic Organisation, LegalEntityProfile,
#                                  CorporateRelationship, PlatformRelationship,
#                                  TenantOrganisationMapping and
#                                  TenantLegalEntityMapping contracts
#                                  (ADR-BCP-018).
#   security/ (not yet written) -> supplies the detailed encryption/auditing
#                                  standards this contract only references
#
# Versioning
# ----------
# The contract schema is versioned independently of Control Plane and
# product-engine implementations and of any individual tenant's data.
#
# Governing decision records:
#   - ADR-0001 and ADR-0003 (baobab-platform/shared/docs/adr/)
#   - ADR-BCP-018 — Canonical Organisation, Corporate Group, Platform Account
#     and Tenant Relationship Model (baobab-platform/baobab-cp)
#
# Change history relevant to ADR-BCP-018
# --------------------------------------
# v1.1 (this revision):
#   - External customers no longer require an entry in the source-controlled
#     Nabhold legal-entity registry.
#   - Default legal-entity mapping remains required for v1 compatibility, but
#     its authoritative runtime source is Control Plane TenantLegalEntityMapping
#     (with Tenant.LegalEntityID retained as a compatibility projection).
#   - First-party Nabhold identities (NABHOLD, ZURIBEANS, THAMANI-GLOBAL,
#     EQUATOR-ESTATE) continue to be governed by the Shared registry.
# =============================================================================

schema:
  name: "baobab-tenancy-contract"
  version: "1.1"

# ------------------------------------------------------------------------------
# What constitutes a tenant
# ------------------------------------------------------------------------------

tenant_definition:

  description: >
    A tenant is a platform security, data-isolation and product-entitlement
    boundary established for a consuming organisation. A legal entity is the
    default tenant boundary, but legal entity and tenant are not synonyms.
    The canonical tenant record is owned by the Baobab Control Plane and maps
    explicitly to the legal entity or entities whose operations it serves.
    A legal entity's independent digital estate is a separate deployment and
    ownership concern: operating a digital estate neither creates nor forbids
    a tenant, while consuming a Baobab product requires an authorised tenant
    and entitlement.

  legal_entity_is_default_boundary: true
  legal_entity_is_tenant_synonym: false
  digital_estate_confers_tenancy: false
  product_consumption_requires_tenant: true

  # ADR-BCP-018: External customers MUST NOT be required to appear in the
  # source-controlled Nabhold legal-entity registry. The registry remains the
  # governance source for first-party Nabhold Group identities only.
  requires_default_legal_entity_registry_entry: false
  first_party_registry_source: "shared/contracts/legal-entity/registry.yaml"
  first_party_identities:
    - "NABHOLD"
    - "ZURIBEANS"
    - "THAMANI-GLOBAL"
    - "EQUATOR-ESTATE"

  # Runtime authority for legal-entity and organisation mappings is the
  # Control Plane (TenantLegalEntityMapping / TenantOrganisationMapping).
  # Shared retains contract and first-party governance authority only.
  runtime_mapping_authority: "baobab-platform/baobab-cp"

  cardinality:
    tenant_to_legal_entity: "one_or_more_by_explicit_mapping"
    legal_entity_to_tenant: "one_or_more_when_approved_isolation_requires_it"
    tenant_to_organisation: "one_or_more_by_explicit_mapping"
    description: >
      Version 1 still requires one default legal-entity reference for
      compatibility (exposed as Tenant.LegalEntityID). Consumers must not
      encode a permanent one-to-one identity. Additional mappings
      (TenantLegalEntityMapping, TenantOrganisationMapping) and stronger
      isolation topologies may be introduced without changing either
      canonical identifier. The singular Tenant.LegalEntityID field is a
      compatibility projection of the default TenantLegalEntityMapping
      until all consumers migrate (ADR-BCP-018).

# ------------------------------------------------------------------------------
# Required identifiers
# ------------------------------------------------------------------------------

identifiers:

  # Default legal-entity identifier (compatibility projection).
  # For first-party Nabhold tenants this continues to reference the Shared
  # registry. For external tenants it is a Control-Plane-minted or
  # Control-Plane-registered legal_entity_id that need not appear in the
  # source-controlled registry.
  entity_id:
    required: true
    source: "control-plane runtime TenantLegalEntityMapping (default); first-party identities also governed by shared legal-entity registry"
    description: >
      The identifier of the tenant's default legal entity (e.g. "THAMANI-GLOBAL"
      for first-party, or a Control-Plane-issued identifier for external
      customers). Every version-1 tenant record MUST carry this mapping. It
      does not define the tenant and must not be reused as tenant_id. No
      system may invent a local alias for a first-party registry id.
    format: "^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)*$"
    notes: >
      ADR-BCP-018 treats the singular entity_id / Tenant.LegalEntityID as a
      compatibility projection of the default TenantLegalEntityMapping.
      New consumers SHOULD prefer the explicit mapping APIs.

  tenant_id:
    required: true
    description: >
      An opaque platform-internal technical identifier, distinct from
      `entity_id`. New identifiers use the `tn_` prefix followed by an opaque
      lowercase token that satisfies the Control Plane resource-ID grammar.
      Human-readable company names, country codes and market codes must not be
      embedded in a newly minted tenant_id.
    mapping_obligation: >
      The mapping tenant_id -> default legal_entity_id (and any additional
      TenantLegalEntityMapping / TenantOrganisationMapping rows) MUST be
      resolvable at all times, in every environment, without exception. Loss
      of this mapping is treated as a data-integrity incident.
    exact_format: "^tn_[a-z0-9]+$"
    schema_reference: "shared/contracts/control-plane/v1/domain.schema.json#/$defs/tenantId"

# ------------------------------------------------------------------------------
# Isolation obligations
#
# States the BAR that must be cleared. Does not mandate the mechanism.
# ------------------------------------------------------------------------------

isolation:

  data_isolation:
    obligation: >
      No tenant may read, write, or infer the existence of another tenant's
      data under any normal operating condition. This MUST hold regardless
      of the underlying storage isolation strategy chosen by `baobab`.
      Corporate group membership, shared PlatformAccount, or common parent
      organisation MUST NOT create an implicit cross-tenant access path
      (ADR-BCP-018 security invariants).
    mechanism: null   # NOT specified here — baobab's own architecture
                       # documentation records the chosen strategy
                       # (e.g. row-level security, schema-per-tenant,
                       # database-per-tenant) and justifies it there,
                       # not in this contract

  tenant_context_propagation:
    obligation: >
      Tenant context MUST be established at the point of authentication and
      MUST propagate through every authorised engine call and event without
      relying on an untrusted caller to supply it voluntarily.
      A request that cannot resolve a tenant context MUST be rejected, not
      defaulted to a "no tenant" state.

  cross_tenant_access_attempts:
    obligation: >
      Any attempt (successful or not) to access data outside the resolved
      tenant context MUST be logged and MUST be treated as a security event,
      not a silent application-level 403.
    detailed_standard: "shared/contracts/security/ (not yet written)"

# ------------------------------------------------------------------------------
# Mandatory tenant metadata
# ------------------------------------------------------------------------------

required_metadata:

  - field: "entity_id"
    description: >
      Default legal-entity identifier (compatibility projection of the
      default TenantLegalEntityMapping). Not the tenant identifier.

  - field: "tenant_id"
    description: "Platform-internal technical identifier"

  - field: "status"
    allowed_values: ["provisioning", "active", "suspended", "decommissioning", "decommissioned"]
    description: "Current lifecycle state — see lifecycle section below"

  - field: "provisioned_at"
    description: "Timestamp of initial tenant provisioning"

  - field: "products_enabled"
    description: >
      The set of Baobab products this tenant is entitled to consume.
      For first-party Nabhold tenants this SHOULD reconcile with
      `baobab_products` in the legal-entity registry. For external tenants
      the Control Plane ProductSubscription and CapabilityGrant records are
      authoritative.

# ------------------------------------------------------------------------------
# Lifecycle events
# ------------------------------------------------------------------------------

lifecycle:

  events:
    - name: "provisioning"
      description: >
        Tenant record created, `tenant_id` assigned, and at least one
        TenantLegalEntityMapping (default) established. For first-party
        Nabhold identities the mapped legal_entity_id MUST exist in the
        Shared registry. For external customers the legal_entity_id is
        registered/issued by the Control Plane and need not appear in the
        Shared registry (ADR-BCP-018).

    - name: "activation"
      description: "Tenant transitions to `active`; product access becomes live."

    - name: "suspension"
      description: >
        Tenant access is withdrawn without data deletion. MUST be reversible.
        Reason for suspension MUST be recorded.

    - name: "decommissioning"
      description: >
        Tenant is being wound down. Data retention/export obligations
        (see below) MUST be satisfied before the `decommissioned` state
        is reached.

    - name: "decommissioned"
      description: "Terminal state. Data handling per retention policy below."

  data_retention_on_decommission:
    obligation: >
      Tenant data MUST NOT be deleted immediately on decommissioning. A
      retention window MUST be observed before permanent deletion, and the
      tenant (or its legal successor) MUST be able to request export of its
      data within that window.
    retention_period: null   # TBD — depends on applicable data-protection
                              # regime, see note below; not fabricated here
    applicable_regime: null  # TBD — likely POPIA (South Africa) and/or GDPR
                              # for any tenant operating markets inside the
                              # EU/UK (e.g. a Zuribeans UK storefront), but
                              # this has not been confirmed by Legal and
                              # MUST NOT be treated as settled until it is

# ------------------------------------------------------------------------------
# Security guarantees (references, not full specification)
#
# Full detail belongs in shared/contracts/security/, not yet written. This
# section states the guarantees that MUST exist; the "how" is deferred.
# ------------------------------------------------------------------------------

security:

  encryption_at_rest:
    obligation: "Tenant data MUST be encrypted at rest."
    standard: "shared/contracts/security/ (not yet written)"

  encryption_in_transit:
    obligation: "All tenant-context-bearing traffic MUST be encrypted in transit."
    standard: "shared/contracts/security/ (not yet written)"

  audit_logging:
    obligation: >
      Every tenant-provisioning, suspension, and decommissioning event MUST
      be recorded in an immutable audit log, attributable to an authenticated
      actor.

  # ADR-BCP-018 security invariants (fail-closed)
  relationship_isolation:
    obligation: >
      Same corporate group, same parent organisation, same PlatformAccount,
      or PLATFORM_GROUP_AFFILIATE status MUST NOT confer cross-tenant data
      access or administrative rights. All consequential relationship
      resolution MUST fail closed when authoritative evidence is missing
      or conflicted.

# ------------------------------------------------------------------------------
# Ownership
# ------------------------------------------------------------------------------

ownership:

  contract_schema:
    owner: "baobab-platform/shared"

  tenancy_model_implementation:
    owner: "baobab-platform/baobab-cp"

  tenant_boundary_enforcement:
    owner: "each Baobab product engine"

  physical_isolation_enforcement:
    owner: "baobab-platform/infrastructure"

  organisation_and_relationship_runtime:
    owner: "baobab-platform/baobab-cp"   # ADR-BCP-018

# ------------------------------------------------------------------------------
# Notes
# ------------------------------------------------------------------------------

notes:
  - >
    This contract intentionally does not choose a database isolation
    strategy. Each product engine records its chosen mechanism in its own
    architecture documentation and justifies it against these obligations.
  - >
    `applicable_regime` and `retention_period` are left null deliberately.
    Populating them with an assumed jurisdiction or a plausible-sounding
    number would be a fabrication this project's standards explicitly
    forbid. They must come from Legal.
  - >
    A tenant's `status` in this contract is independent of its digital
    estate repository's deployment status. A subsidiary can have a live
    website while its Baobab tenant record is still `provisioning`, and
    vice versa.
  - >
    ADR-BCP-018 (2026-09-22): External customers are admitted and provisioned
    without requiring an entry in the source-controlled Nabhold legal-entity
    registry. The registry remains the first-party governance source for
    NABHOLD, ZURIBEANS, THAMANI-GLOBAL and EQUATOR-ESTATE. Runtime authority
    for Organisation, LegalEntityProfile, CorporateRelationship,
    PlatformRelationship, PlatformAccount and the explicit tenant mappings
    resides in the Control Plane.

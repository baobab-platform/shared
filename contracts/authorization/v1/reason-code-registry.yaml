# reason-code-registry.yaml
# Canonical registry of machine-readable reason codes used across Baobab
# services. A code here is opaque-safe by construction: none of these
# descriptions reveal implementation detail, and adding a new code SHOULD
# preserve that property (ADR-0008 §45 "Denial Model" -- "reason codes
# SHALL not expose sensitive information indiscriminately to external
# clients").
#
# Nine categories exist for nine different moments, not six different
# vocabularies for the same thing:
#
#   authorization_denial          -- decision.schema.json's `reason_code`,
#                                     returned synchronously on a DENY
#                                     authorization decision (ADR-0008 §45's
#                                     own example list).
#   lifecycle_revocation           -- the `reason` field on identity-lifecycle
#                                     event payloads (contracts/identity-events/v1/
#                                     *.schema.json), published asynchronously
#                                     when a principal/membership is revoked
#                                     or disabled (ADR-0016 §141 "Reason Codes").
#   capability_resolution_denial   -- contracts/capability/v1/resolution.schema.json's
#                                     `reason_code`, returned synchronously on a
#                                     non-RESOLVED CapabilityResolution decision
#                                     (ADR-BCP-003 §21, ADR-BCP-007 §21, ADR-SHARED-007
#                                     §40). This is a richer, capability-resolution-
#                                     specific vocabulary than authorization_denial's
#                                     coarser decision.schema.json codes.
#   provisioning_blocker           -- why a TenantProvisioning, its plan or its
#                                     readiness is blocked (ADR-SHARED-015):
#                                     the codes of ProvisioningPlan blockers,
#                                     TenantProvisioning.blocking_reasons and
#                                     ReadinessSnapshot.blocking_reasons that no
#                                     capability_resolution_denial code names.
#   health_observation             -- contracts/capability/v1/health.schema.json's
#                                     `reasons`: why a HealthObservation reports
#                                     the status it does (ADR-SHARED-007 §37,
#                                     ADR-BCP-006). These explain an observation;
#                                     they are never returned as a denial.
#   administrative_denial          -- contracts/administration/v1/grant.schema.json's
#                                     AdministrativeDecision `reason_codes`: why a
#                                     Control Plane administrative action was not
#                                     allowed (ADR-BCP-020 sections 97-98). Safe to
#                                     show the administrator; never internal policy.
#   provider_migration_blocker     -- contracts/control-plane/v1/provider-migration.schema.json's
#                                     ProviderMigrationPlan `blockers`: an unmet
#                                     precondition that stops a provider migration
#                                     advancing (ADR-BCP-006 sections 46-48, 55).
#   provider_migration_task_failure -- contracts/control-plane/v1/engine-migration-task.schema.json's
#                                     `result.reason_code`: why an engine migration
#                                     task or its step failed (ADR-SHARED-016
#                                     sections 3-4). Safe to show the operator;
#                                     never business data.
#   changeset_blocker              -- contracts/control-plane/v1/changeset.schema.json's
#                                     Changeset `blocking_reasons` and ChangesetPlan
#                                     `blockers`: why a changeset is INVALID or
#                                     BLOCKED (ADR-BCP-021 sections 17-19, 66).
#   market_validation              -- contracts/control-plane/v1/market.schema.json's
#                                     Market `validation_findings`: why a DRAFT
#                                     market is not yet VALIDATED
#                                     (market-lifecycle.yaml validation_rules).
#
# TENANT_SUSPENDED (authorization_denial) and TENANT_SUSPENSION
# (lifecycle_revocation) are deliberately two distinct, near-identical-
# looking codes, not a typo: each is the literal wording its own governing
# ADR uses, for its own category. Do not merge them. The same pattern
# applies to CAPABILITY_NOT_BOUND (authorization_denial, the coarse
# decision.schema.json code) and BINDING_NOT_FOUND (capability_resolution_denial,
# the same real-world condition surfaced with more specific sibling codes
# through the richer CapabilityResolution decision object) -- do not merge
# those either.

reason_codes:
  # -- authorization_denial (ADR-0008 §45) ------------------------------
  - code: IDENTITY_DISABLED
    category: authorization_denial
    description: "The principal's canonical identity is disabled."
  - code: TENANT_SUSPENDED
    category: authorization_denial
    description: "The resolved tenant is suspended."
  - code: MEMBERSHIP_MISSING
    category: authorization_denial
    description: "The principal has no active membership granting this access."
  - code: MARKET_DISABLED
    category: authorization_denial
    description: "The resolved market is disabled for this tenant or product."
  - code: CAPABILITY_NOT_BOUND
    category: authorization_denial
    description: "No active CapabilityBinding routes this request to an engine instance."
  - code: ESTATE_DISABLED
    category: authorization_denial
    description: "The resolved Digital Estate is disabled."
  - code: ENGINE_INSTANCE_UNAVAILABLE
    category: authorization_denial
    description: "No eligible engine instance is currently available to serve this request."
  - code: POLICY_DENIED
    category: authorization_denial
    description: "A policy check denied the request for a reason not covered by a more specific code in this category."

  # -- lifecycle_revocation (ADR-0016 §141) -----------------------------
  - code: WORKFORCE_TERMINATION
    category: lifecycle_revocation
    description: "Revoked because the workforce member's employment or engagement ended."
  - code: MEMBERSHIP_EXPIRED
    category: lifecycle_revocation
    description: "Revoked because the membership's effective period ended."
  - code: SECURITY_COMPROMISE
    category: lifecycle_revocation
    description: "Revoked in response to a suspected or confirmed credential or identity compromise."
  - code: ROLE_CHANGE
    category: lifecycle_revocation
    description: "Revoked because the principal's role or entitlement changed."
  - code: TENANT_SUSPENSION
    category: lifecycle_revocation
    description: "Revoked because the owning tenant was suspended."
  - code: CONTRACT_END
    category: lifecycle_revocation
    description: "Revoked because a commercial contract or engagement ended."
  - code: USER_REQUEST
    category: lifecycle_revocation
    description: "Revoked at the subject's own request."
  - code: ADMINISTRATIVE_ACTION
    category: lifecycle_revocation
    description: "Revoked by an administrator for a reason not covered by a more specific code in this category."

  # -- capability_resolution_denial (ADR-BCP-003 §21, ADR-BCP-007 §21, ADR-SHARED-007 §40) --
  - code: CAPABILITY_UNKNOWN
    category: capability_resolution_denial
    description: "The requested capability_key is not registered."
  - code: CAPABILITY_INACTIVE
    category: capability_resolution_denial
    description: "The requested capability is registered but not in an ACTIVE lifecycle state."
  - code: GRANT_NOT_FOUND
    category: capability_resolution_denial
    description: "No effective CapabilityGrant authorises this tenant, scope and capability."
  - code: GRANT_SUSPENDED
    category: capability_resolution_denial
    description: "The applicable CapabilityGrant exists but is suspended."
  - code: GRANT_REVOKED
    category: capability_resolution_denial
    description: "The applicable CapabilityGrant exists but has been revoked."
  - code: GRANT_EXPIRED
    category: capability_resolution_denial
    description: "The applicable CapabilityGrant's effective period has ended."
  - code: DEPENDENCY_UNSATISFIED
    category: capability_resolution_denial
    description: "A REQUIRED capability dependency is not itself resolvable."
  - code: BINDING_NOT_FOUND
    category: capability_resolution_denial
    description: "No eligible CapabilityBinding matches the requested capability and scope."
  - code: BINDING_AMBIGUOUS
    category: capability_resolution_denial
    description: "More than one eligible CapabilityBinding remains after applying scope-specificity.yaml's full ordering; resolution fails closed rather than guessing."
  - code: PROVIDER_UNAVAILABLE
    category: capability_resolution_denial
    description: "The bound CapabilityProvider or engine instance is not currently healthy enough to serve the request."
  - code: PROVIDER_HEALTH_UNKNOWN
    category: capability_resolution_denial
    description: "The requested capability's health_criticality is CRITICAL, and the bound provider or engine instance has no current health observation (none, or only an expired one)."
  - code: PROVIDER_INCOMPATIBLE
    category: capability_resolution_denial
    description: "The bound provider does not declare support for the requested capability's contract version."
  - code: CONTRACT_VERSION_UNSUPPORTED
    category: capability_resolution_denial
    description: "No eligible binding supports the caller's required_contract_version."
  - code: ISOLATION_POLICY_MISMATCH
    category: capability_resolution_denial
    description: "No eligible binding's provider satisfies the scope's required isolation profile."
  - code: RESIDENCY_POLICY_MISMATCH
    category: capability_resolution_denial
    description: "No eligible binding's provider satisfies the scope's data-residency requirements."
  - code: CONTEXT_INVALID
    category: capability_resolution_denial
    description: "The referenced context_id is missing, expired, or was resolved for a different capability's operation scope requirements."
  # -- provisioning_blocker (ADR-SHARED-015) ----------------------------
  # Why a TenantProvisioning, its plan or its readiness is blocked: known,
  # remediable conditions carried by ProvisioningPlan blockers,
  # TenantProvisioning.blocking_reasons and ReadinessSnapshot.blocking_reasons.
  # Conditions a capability resolution already names use its
  # capability_resolution_denial code instead (for example GRANT_NOT_FOUND,
  # BINDING_NOT_FOUND, PROVIDER_UNAVAILABLE, ISOLATION_POLICY_MISMATCH).
  - code: MARKET_ACTIVITIES_UNDECLARED
    category: provisioning_blocker
    description: "The desired state declares no participation activities for a market it requires, so market participation cannot be planned."
  - code: MARKET_NOT_AVAILABLE
    category: provisioning_blocker
    description: "A market the desired state requires is not registered or not active."
  - code: PRODUCT_NOT_AVAILABLE
    category: provisioning_blocker
    description: "A product the desired state requires is not registered or not available."
  - code: COMPOSITION_NOT_AVAILABLE
    category: provisioning_blocker
    description: "A required product's capability composition is not registered."
  - code: CAPABILITY_NOT_AVAILABLE
    category: provisioning_blocker
    description: "A capability a required product composes is not registered or not active."
  - code: NO_PROVIDER
    category: provisioning_blocker
    description: "No registered provider supports a capability the desired state requires."
  - code: NO_RESIDENCY_COMPLIANT_PROVIDER
    category: provisioning_blocker
    description: "No provider of a required capability runs where the tenant's data must reside."
  - code: NO_PRODUCTION_PERMITTED_PROVIDER
    category: provisioning_blocker
    description: "No provider of a required capability is permitted to serve production."
  - code: NO_HEALTHY_PROVIDER
    category: provisioning_blocker
    description: "Every otherwise eligible provider of a required capability fails the health policy for that capability's health_criticality."
  - code: PLAN_STALE
    category: provisioning_blocker
    description: "Authoritative state changed since the plan was approved, or its validity window closed before execution; a new plan is required."
  - code: PLAN_DIGEST_MISMATCH
    category: provisioning_blocker
    description: "The plan being executed is no longer the plan the approval authorised."
  - code: PLAN_NOT_EXECUTABLE
    category: provisioning_blocker
    description: "The approved plan could not be resolved to executable steps; a new plan is required."
  - code: EXECUTION_CANCELLED
    category: provisioning_blocker
    description: "An apply or remediation was cancelled before it completed."
  - code: MARKET_PARTICIPATION_NOT_READY
    category: provisioning_blocker
    description: "A market participation the desired state requires is not active with its declared activities."
  - code: TRADE_LANE_NOT_READY
    category: provisioning_blocker
    description: "A trade lane the provisioning requires is not active."
  # -- health_observation (ADR-SHARED-007 §37, ADR-BCP-006) -------------
  # Why a HealthObservation reports its status. Never a denial: resolution
  # and provisioning deny with PROVIDER_UNAVAILABLE, PROVIDER_HEALTH_UNKNOWN
  # or NO_HEALTHY_PROVIDER, whatever the observation's reasons were.
  - code: HEALTH_PROBE_FAILED
    category: health_observation
    description: "The health probe reached the subject and got a failing answer."
  - code: HEALTH_PROBE_TIMEOUT
    category: health_observation
    description: "The health probe did not get an answer in time."
  - code: HEALTH_LATENCY_ELEVATED
    category: health_observation
    description: "The subject answers, but slower than its service objective allows."
  - code: HEALTH_ERROR_RATE_ELEVATED
    category: health_observation
    description: "The subject's observed error rate is above its service objective."
  - code: HEALTH_DEPENDENCY_DEGRADED
    category: health_observation
    description: "A dependency the subject needs is degraded."
  - code: HEALTH_DEPENDENCY_UNAVAILABLE
    category: health_observation
    description: "A dependency the subject needs is unavailable."
  - code: HEALTH_CAPACITY_EXHAUSTED
    category: health_observation
    description: "The subject is refusing work because it has no capacity left."
  - code: HEALTH_MAINTENANCE
    category: health_observation
    description: "The subject is in a declared maintenance window."
  - code: HEALTH_NOT_YET_OBSERVED
    category: health_observation
    description: "The subject has been registered but has not yet been observed."
  # -- administrative_denial (ADR-BCP-020 sections 97-98) ---------------
  # Why a Control Plane administrative action was not allowed. The grant
  # lifecycle codes carry an ADMINISTRATIVE_ prefix: GRANT_EXPIRED,
  # GRANT_SUSPENDED and GRANT_REVOKED already name capability grants.
  - code: NO_ADMINISTRATIVE_GRANT
    category: administrative_denial
    description: "The principal holds no administrative grant for the requested action."
  - code: SCOPE_MISMATCH
    category: administrative_denial
    description: "The principal's grants for the action do not cover the requested scope."
  - code: SCOPE_AMBIGUOUS
    category: administrative_denial
    description: "The requested scope could not be resolved to exactly one anchor, so it is not guessed."
  - code: ADMINISTRATIVE_GRANT_PENDING
    category: administrative_denial
    description: "The matching administrative grant is not yet active."
  - code: ADMINISTRATIVE_GRANT_SUSPENDED
    category: administrative_denial
    description: "The matching administrative grant is suspended."
  - code: ADMINISTRATIVE_GRANT_EXPIRED
    category: administrative_denial
    description: "The matching administrative grant's validity window has ended."
  - code: ADMINISTRATIVE_GRANT_REVOKED
    category: administrative_denial
    description: "The matching administrative grant has been revoked."
  - code: DELEGATION_INVALID
    category: administrative_denial
    description: "The matching grant was delegated from authority that is no longer valid, or exceeds it."
  - code: SEPARATION_OF_DUTIES_VIOLATION
    category: administrative_denial
    description: "The action would breach a separation-of-duties policy."
  - code: SELF_APPROVAL_PROHIBITED
    category: administrative_denial
    description: "The principal may not approve or grant something they requested or will receive."
  - code: AUTHENTICATION_ASSURANCE_INSUFFICIENT
    category: administrative_denial
    description: "The session's authentication assurance is below what the grant requires."
  - code: APPROVAL_REQUIRED
    category: administrative_denial
    description: "The action needs an approval that has not been recorded."
  - code: PRINCIPAL_INACTIVE
    category: administrative_denial
    description: "The principal is not active."
  - code: ORGANISATION_INACTIVE
    category: administrative_denial
    description: "The organisation the action concerns is not active."
  - code: TENANT_STATE_PROHIBITS_ACTION
    category: administrative_denial
    description: "The tenant's lifecycle state does not permit the action."

  # -- provider_migration_blocker (ADR-BCP-006 sections 46-48, 55) ------
  # Why a ProviderMigrationPlan cannot be approved or advanced. Each is a
  # known, remediable condition found by discovery or validation.
  - code: MIGRATION_SOURCE_NOT_BOUND
    category: provider_migration_blocker
    description: "The source provider serves none of the named capabilities through an active binding, so there is nothing to migrate."
  - code: MIGRATION_TARGET_NOT_REGISTERED
    category: provider_migration_blocker
    description: "The target provider is not a registered, active provider."
  - code: MIGRATION_TARGET_NOT_SUPPORTED
    category: provider_migration_blocker
    description: "The target provider does not declare support for a capability being migrated."
  - code: MIGRATION_TARGET_CONTRACT_INCOMPATIBLE
    category: provider_migration_blocker
    description: "The target provider does not support the capability contract version the migrated bindings require."
  - code: MIGRATION_TARGET_UNHEALTHY
    category: provider_migration_blocker
    description: "The target provider or an instance it would serve from has no current HEALTHY observation."
  - code: MIGRATION_TARGET_NOT_ELIGIBLE
    category: provider_migration_blocker
    description: "The target cannot serve an affected context: its instances fail that context's region, isolation or residency requirements."
  - code: MIGRATION_CONTEXT_UNASSIGNED
    category: provider_migration_blocker
    description: "An affected context belongs to no cohort, so it would never migrate."
  - code: MIGRATION_COHORT_OVERLAP
    category: provider_migration_blocker
    description: "An affected context matches more than one cohort; each context migrates in exactly one."
  - code: MIGRATION_SHADOW_UNSAFE
    category: provider_migration_blocker
    description: "A shadow stage was requested for a capability whose operations mutate state and are not declared shadow-safe."
  - code: MIGRATION_ALREADY_IN_PROGRESS
    category: provider_migration_blocker
    description: "Another migration that has not ended already covers a named capability for the source provider."

  # -- provider_migration_task_failure (ADR-SHARED-016 sections 3-4) -----
  # Why an engine migration task, or the step it belongs to, failed. The
  # cohort is left in its safe state (frozen or on the source); the
  # operator retries or rolls back.
  - code: MIGRATION_RECONCILIATION_MISMATCH
    category: provider_migration_task_failure
    description: "The source and target reported a different record count or content digest for the cohort's canonical projection."
  - code: MIGRATION_TASK_TIMEOUT
    category: provider_migration_task_failure
    description: "The assigned engine instance did not report the task before its deadline."
  - code: MIGRATION_TASK_REJECTED
    category: provider_migration_task_failure
    description: "The assigned engine instance refused the task: it cannot perform the operation for this cohort."
  - code: MIGRATION_ADAPTER_UNAVAILABLE
    category: provider_migration_task_failure
    description: "The engine's migration adapter could not reach the counterpart or its own provider to complete the task."

  # -- changeset_blocker (ADR-BCP-021 sections 17-19, 66) ---------------
  # Why a changeset cannot be planned or approved as it stands.
  - code: CHANGESET_TARGET_NOT_FOUND
    category: changeset_blocker
    description: "The resource the desired change names does not exist."
  - code: CHANGESET_TARGET_STATE_CONFLICT
    category: changeset_blocker
    description: "The target is not in a state the desired change can start from, for example suspending a tenant that is not active."
  - code: CHANGESET_TARGET_LOCKED
    category: changeset_blocker
    description: "Another changeset that has not ended already changes the same target; overlapping changes are serialised (section 66)."

  # -- market_validation (market-lifecycle.yaml validation_rules) -------
  # Why a DRAFT market is not yet VALIDATED.
  - code: MARKET_COUNTRY_REQUIRED
    category: market_validation
    description: "The market names no country: neither default_country nor countries is set."
  - code: MARKET_COUNTRY_NOT_LISTED
    category: market_validation
    description: "default_country is not one of the market's countries."
  - code: MARKET_CURRENCY_REQUIRED
    category: market_validation
    description: "The market has no default currency."
  - code: MARKET_CURRENCY_NOT_ALLOWED
    category: market_validation
    description: "default_currency is not one of the market's allowed currencies."
  - code: MARKET_LOCALE_REQUIRED
    category: market_validation
    description: "The market has no default locale."
  - code: MARKET_LOCALE_NOT_SUPPORTED
    category: market_validation
    description: "default_locale is not one of the market's supported locales."
  - code: MARKET_TIMEZONE_REQUIRED
    category: market_validation
    description: "The market has no timezone."
  - code: MARKET_EFFECTIVE_FROM_REQUIRED
    category: market_validation
    description: "The market has no effective_from."
  - code: MARKET_EFFECTIVE_WINDOW_INVALID
    category: market_validation
    description: "effective_to is not after effective_from."
  - code: MARKET_PARENT_UNKNOWN
    category: market_validation
    description: "parent_market_id does not name another existing market."

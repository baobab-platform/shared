asyncapi: 3.1.0
info:
  title: Baobab-Platform organisation lifecycle events
  version: 1.0.0
  description: >
    ADR-BCP-018 section 124 lifecycle events for Organisation, LegalEntityProfile,
    CorporateRelationship, PlatformRelationship, PlatformAccount, the explicit
    tenant mappings and tenant PlatformAccount bindings. Produced by baobab-platform/baobab-cp from its transactional
    outbox in the same transaction as the state change; a replayed command that
    changes nothing publishes nothing. Payloads carry identifiers and state only
    (section 125). Event types follow ADR-SHARED-008.
defaultContentType: application/json
channels:
  organisationLifecycle:
    address: baobab-platform.control-plane.organisation.v1
    messages:
      organisationCreated: { $ref: "#/components/messages/OrganisationCreated" }
      organisationVerified: { $ref: "#/components/messages/OrganisationVerified" }
      organisationSuspended: { $ref: "#/components/messages/OrganisationSuspended" }
      legalEntityVerified: { $ref: "#/components/messages/LegalEntityVerified" }
      corporateRelationshipActivated: { $ref: "#/components/messages/CorporateRelationshipActivated" }
      corporateRelationshipEnded: { $ref: "#/components/messages/CorporateRelationshipEnded" }
      corporateRelationshipConflicted: { $ref: "#/components/messages/CorporateRelationshipConflicted" }
      platformRelationshipActivated: { $ref: "#/components/messages/PlatformRelationshipActivated" }
      platformRelationshipEnded: { $ref: "#/components/messages/PlatformRelationshipEnded" }
      platformAccountCreated: { $ref: "#/components/messages/PlatformAccountCreated" }
      platformAccountMembershipChanged: { $ref: "#/components/messages/PlatformAccountMembershipChanged" }
      platformAccountStatusChanged: { $ref: "#/components/messages/PlatformAccountStatusChanged" }
      tenantPlatformAccountBound: { $ref: "#/components/messages/TenantPlatformAccountBound" }
      tenantPlatformAccountBindingEnded: { $ref: "#/components/messages/TenantPlatformAccountBindingEnded" }
      tenantOrganisationMappingActivated: { $ref: "#/components/messages/TenantOrganisationMappingActivated" }
      tenantLegalEntityMappingActivated: { $ref: "#/components/messages/TenantLegalEntityMappingActivated" }
operations:
  publishOrganisationLifecycle:
    action: send
    channel: { $ref: "#/channels/organisationLifecycle" }
components:
  messages:
    OrganisationCreated:
      name: com.baobab-platform.control-plane.organisation.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/OrganisationCreated" }
    OrganisationVerified:
      name: com.baobab-platform.control-plane.organisation.verified.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/OrganisationVerified" }
    OrganisationSuspended:

# workload-registry.yaml
# Canonical registry of workload (service-to-service) identities across the
# Baobab platform (ADR-0007 §§42-43 "Workload Registration"/"Workload
# Inventory", §101's illustrative shape). nabhold/baobab-iam owns
# provisioning the Keycloak clients this registry describes (config/clients/
# *-workload.json); nabhold/baobab-cp enforces against it at request time
# (rejecting any workload token whose client_id isn't listed here, or whose
# audience/scope falls outside what its entry allows) -- per ADR-0007 §99's
# ownership table, this file is the single source of truth both repos build
# from, rather than either repo inventing its own copy (§100: "Existing
# Shared identity contracts SHALL be extended rather than duplicated").
#
# Fields per entry (ADR-0007 §42's registration field list):
#   client_id           -- the OAuth client_id issued by baobab-iam. SHALL
#                           be globally unique (§44: two clients answering
#                           to one clientId is a security defect, not a
#                           convenience -- baobab-iam#5 fixed exactly this).
#   repository           -- the workload's owning source repository.
#   owner                -- team/repository accountable for this workload
#                           (§44: "Every workload client SHALL have a
#                           defined owning repository/team. Orphaned IAM
#                           clients SHALL be considered a security defect.").
#   runtime               -- what actually runs as this workload (a
#                            deployed service, a batch job, a CI job, etc).
#   environment            -- development | staging | production. A
#                             credential issued for one environment SHALL
#                             NOT authenticate as this workload in another
#                             (ADR-0007 §102's "development credential
#                             rejected in production" isolation test).
#   allowed_audiences      -- the aud values baobab-cp's verifier accepts
#                             for this workload's tokens (§§24-25: "A token
#                             intended for Control Plane SHALL not
#                             automatically work against ERP").
#   allowed_scopes         -- the OAuth scopes this workload may be granted,
#                             drawn from scope-registry.yaml (§§22-23: scope
#                             SHALL follow least privilege; scope=* or
#                             scope=admin for an internal workload is
#                             prohibited).
#   credential_type        -- how this workload authenticates today.
#                             client_credentials is the only type baobab-iam
#                             issues as of this registry's creation; mTLS
#                             client-certificate auth is owned by
#                             nabhold/infrastructure (ADR-0007 §§34-41,
#                             §94, §99) and is not modelled here until
#                             that repository defines how it registers.
#   rotation_owner          -- team/repository responsible for rotating
#                              this workload's credential.
#   status                  -- PROVISIONED | ACTIVE | SUSPENDED | REVOKED |
#                              RETIRED (ADR-0007 §45's workload lifecycle
#                              states). All entries below start ACTIVE,
#                              reflecting the already-provisioned Keycloak
#                              clients in nabhold/baobab-iam's config/
#                              clients/*-workload.json.
#
# Adding a workload: add an entry here first (this is the registration
# ADR-0007 §42 requires), then provision the matching Keycloak client in
# nabhold/baobab-iam. Removing one: set status to RETIRED here before
# disabling/deleting the Keycloak client, never the other order, so
# baobab-cp's enforcement (once it reads this registry -- Gate IAM-4 phase
# 4) never has a live credential for a client this registry doesn't know
# about.

schema:
  name: nabhold-workload-registry
  version: "1.0"

workloads:
  baobab-cms-workload:
    repository: nabhold/baobab-cms
    owner: nabhold/baobab-cms
    runtime: "baobab-cms service"
    environment: production
    allowed_audiences: ["baobab-control-plane"]
    allowed_scopes: ["context:resolve"]
    credential_type: client_credentials
    rotation_owner: nabhold/baobab-cms
    status: ACTIVE

  baobab-erp-workload:
    repository: nabhold/baobab-erp
    owner: nabhold/baobab-erp
    runtime: "baobab-erp service"
    environment: production
    # Gate IAM-10 (ADR-0014 §111): added baobab-erp/erp:integrate so this
    # workload's own iDempiere OSGi bundles (org.nabhold.baobab.erp.context/
    # mapping) can authenticate to baobab-app's HTTP boundary, which
    # previously trusted network location alone.
    allowed_audiences: ["baobab-control-plane", "baobab-erp"]
    allowed_scopes: ["context:resolve", "erp:integrate"]
    credential_type: client_credentials
    rotation_owner: nabhold/baobab-erp
    status: ACTIVE

  baobab-pulse-workload:
    repository: nabhold/baobab-pulse
    owner: nabhold/baobab-pulse
    runtime: "baobab-pulse service"
    environment: production
    allowed_audiences: ["baobab-control-plane"]
    allowed_scopes: ["context:resolve"]
    credential_type: client_credentials
    rotation_owner: nabhold/baobab-pulse
    status: ACTIVE

  baobab-trade-workload:
    repository: nabhold/baobab-trade
    owner: nabhold/baobab-trade
    runtime: "baobab-trade service"
    environment: production
    allowed_audiences: ["baobab-control-plane"]
    allowed_scopes: ["context:resolve"]
    credential_type: client_credentials
    rotation_owner: nabhold/baobab-trade
    status: ACTIVE

  thamani-backend:
    repository: nabhold/thamani
    owner: nabhold/thamani
    runtime: "thamani backend service"
    environment: production
    allowed_audiences: ["baobab-control-plane"]
    allowed_scopes: ["context:resolve"]
    credential_type: client_credentials
    rotation_owner: nabhold/thamani
    status: ACTIVE

  zuribeans-backend:
    repository: nabhold/zuribeans
    owner: nabhold/zuribeans
    runtime: "zuribeans backend service"
    environment: production
    allowed_audiences: ["baobab-control-plane"]
    allowed_scopes: ["context:resolve"]
    credential_type: client_credentials
    rotation_owner: nabhold/zuribeans
    status: ACTIVE

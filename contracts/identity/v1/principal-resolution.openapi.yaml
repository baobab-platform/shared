openapi: 3.1.0
info:
  title: Private delegated human Principal resolution
  version: 1.0.0
  description: >-
    Control Plane private, workload-only operations through which a
    registered workload acting for an authenticated human obtains that
    human's canonical Principal (ZB-G03 step 3; platform owner decision of
    2026-10-21). The caller authenticates with its own Control
    Plane-audience workload token. The human's IAM access token travels in
    the body as subject evidence, never as the caller credential.


    For every request the Control Plane MUST, before reading any identity:
    (1) verify the caller's workload token, its registered ACTIVE workload
    and the operation scope; (2) verify the subject token's signature and
    issuer against its own registered issuer trust, never a caller-supplied
    key or URL; (3) require actor_type human, an audience equal to the
    resource audience registered for the calling workload (a Trade token
    for the Trade workload, and so on), the scope that audience requires
    (trade:buy for baobab-trade), an authorised-party client allowlisted for
    that audience, and an unexpired token; and (4) confirm the token is
    currently active by the issuer's introspection. Any failure denies.
    Successful resolution grants no tenant, Organisation membership, role,
    market or purchasing authority.
paths:
  /internal/identity/v1/principals/resolve:
    post:
      operationId: resolveDelegatedHumanPrincipal
      summary: Resolve an authenticated human's canonical Principal (identity.principal.resolve@1)
      description: >-
        Read-only. Resolves the verified exact (issuer, subject) to an ACTIVE
        human Principal with an ACTIVE ExternalIdentity. An unknown pair is
        IDENTITY_NOT_RESOLVED (404) and creates nothing.
      security:
        - PrincipalResolutionWorkload: ["identity:principal:resolve"]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: principal-resolution.schema.json#/$defs/PrincipalResolveRequest
      responses:
        "200":
          description: Resolved. outcome is always RESOLVED.
          headers:
            Cache-Control:
              description: private, no-store
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: principal-resolution.schema.json#/$defs/PrincipalResolution
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: The caller's own workload token is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
        "403":
          description: >-
            CALLER_NOT_PERMITTED, SUBJECT_TOKEN_INVALID,
            SUBJECT_TOKEN_NOT_CURRENT, SUBJECT_TOKEN_NOT_FOR_CALLER or
            PRINCIPAL_NOT_ACTIVE.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
        "404":
          description: IDENTITY_NOT_RESOLVED.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
        "503":
          description: RESOLUTION_UNAVAILABLE (issuer trust, introspection or identity store unavailable). Never a fallback identity.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
  /internal/identity/v1/principals/register-buyer:
    post:
      operationId: registerBuyerPrincipal
      summary: Governed just-in-time buyer Principal registration (identity.principal.register.buyer@1)
      description: >-
        For an eligible first-time buyer, atomically creates an ACTIVE human
        Principal and its ACTIVE ExternalIdentity for the verified exact
        (issuer, subject), and returns it with outcome REGISTERED. An
        already-registered ACTIVE pair returns RESOLVED; concurrent first
        requests return the same Principal and leave no orphan record. A
        SUSPENDED, DISABLED or ARCHIVED Principal or ExternalIdentity is
        PRINCIPAL_NOT_ACTIVE and is never re-created. Eligibility is the
        Control Plane's buyer provisioning policy, which additionally
        requires the issuer and authorised-party client to be registered for
        buyer registration (REGISTRATION_NOT_ELIGIBLE otherwise).
        Registration creates no Organisation, membership, tenant, market,
        role, purchasing authority or commerce-customer mapping.
      security:
        - PrincipalResolutionWorkload: ["identity:principal:register-buyer"]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: principal-resolution.schema.json#/$defs/BuyerPrincipalRegistrationRequest
      responses:
        "200":
          description: Already registered; outcome RESOLVED.
          content:
            application/json:
              schema:
                $ref: principal-resolution.schema.json#/$defs/PrincipalResolution
        "201":
          description: Registered by this request; outcome REGISTERED.
          content:
            application/json:
              schema:
                $ref: principal-resolution.schema.json#/$defs/PrincipalResolution
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: The caller's own workload token is missing or invalid.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
        "403":
          description: >-
            CALLER_NOT_PERMITTED, SUBJECT_TOKEN_INVALID,
            SUBJECT_TOKEN_NOT_CURRENT, SUBJECT_TOKEN_NOT_FOR_CALLER,
            PRINCIPAL_NOT_ACTIVE or REGISTRATION_NOT_ELIGIBLE.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
        "503":
          description: RESOLUTION_UNAVAILABLE. Nothing is created.
          content:
            application/problem+json:
              schema:
                $ref: ../../errors/v1/problem-details.schema.json
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Must equal the body correlation_id.
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Malformed request (unknown field, malformed token or correlation mismatch).
      content:
        application/problem+json:
          schema:
            $ref: ../../errors/v1/problem-details.schema.json
  securitySchemes:
    PrincipalResolutionWorkload:
      type: oauth2
      description: A Baobab workload token issued for audience baobab-control-plane.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            "identity:principal:resolve": Read-only delegated human Principal resolution.
            "identity:principal:register-buyer": Governed just-in-time buyer Principal registration.

asyncapi: 3.1.0
info:
  title: Baobab-Platform subscription billing events
  version: 1.0.0
  description: >
    Billing events published by baobab-platform/baobab-subscriptions
    (ADR-SUB-0001, ADR-SHARED-011) from its own outbox, in the same
    transaction as the change; a replay that changes nothing publishes
    nothing. Tenant-scoped. Distinct from the Control Plane's
    com.baobab-platform.product.subscription.* events.
defaultContentType: application/json
channels:
  billingEvents:
    address: baobab-platform.subscriptions.billing.v1
    messages:
      billingSubscriptionCreated: { $ref: "#/components/messages/BillingSubscriptionCreated" }
      billingSubscriptionSuspended: { $ref: "#/components/messages/BillingSubscriptionSuspended" }
      billingSubscriptionCancelled: { $ref: "#/components/messages/BillingSubscriptionCancelled" }
      usageRecorded: { $ref: "#/components/messages/UsageRecorded" }
operations:
  publishBillingEvents:
    action: send
    channel: { $ref: "#/channels/billingEvents" }
components:
  messages:
    BillingSubscriptionCreated:
      name: com.baobab-platform.subscriptions.billing-subscription.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/BillingSubscriptionCreated" }
    BillingSubscriptionSuspended:
      name: com.baobab-platform.subscriptions.billing-subscription.suspended.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/BillingSubscriptionSuspended" }
    BillingSubscriptionCancelled:
      name: com.baobab-platform.subscriptions.billing-subscription.cancelled.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/BillingSubscriptionCancelled" }
    UsageRecorded:
      name: com.baobab-platform.subscriptions.usage.recorded.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: "./events.schema.json#/$defs/UsageRecorded" }

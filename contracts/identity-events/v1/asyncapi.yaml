asyncapi: 3.1.0
info:
  title: Baobab-Platform Baobab identity-events
  version: 1.0.0
  description: >
    Canonical identity lifecycle events using the shared Baobab event
    envelope, produced by baobab-iam's Keycloak realm and consumed by
    downstream engines that need to react to identity/membership state
    changes. No message broker exists yet anywhere in this ecosystem to
    carry these (same position as contracts/erp/v1 and
    contracts/supplier-onboarding/v1 today) — this contract exists so
    producers and future consumers have a stable shape to build against
    once one does.

    This package now covers all 9 events ADR-0016 ("Identity Lifecycle,
    Revocation and Deprovisioning") anticipates — identity.created,
    identity.disabled, identity.suspended, identity.reactivated,
    membership.revoked, entitlement.revoked, credential.compromised,
    session.revoked, workload.revoked. See README.md for each event's
    design rationale.
defaultContentType: application/json
channels:
  identityEvents:
    address: baobab-platform.identity.events.v1
    messages:
      identityCreated: { $ref: "#/components/messages/IdentityCreated" }
      identityDisabled: { $ref: "#/components/messages/IdentityDisabled" }
      identitySuspended: { $ref: "#/components/messages/IdentitySuspended" }
      identityReactivated: { $ref: "#/components/messages/IdentityReactivated" }
      membershipRevoked: { $ref: "#/components/messages/MembershipRevoked" }
      entitlementRevoked: { $ref: "#/components/messages/EntitlementRevoked" }
      credentialCompromised: { $ref: "#/components/messages/CredentialCompromised" }
      sessionRevoked: { $ref: "#/components/messages/SessionRevoked" }
      workloadRevoked: { $ref: "#/components/messages/WorkloadRevoked" }
operations:
  publishIdentityEvents:
    action: send
    channel: { $ref: "#/channels/identityEvents" }
components:
  messages:
    IdentityCreated:
      name: com.baobab-platform.identity.created.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./identity-created.schema.json }
    IdentityDisabled:
      name: com.baobab-platform.identity.disabled.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./identity-disabled.schema.json }
    IdentitySuspended:
      name: com.baobab-platform.identity.suspended.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./identity-suspended.schema.json }
    IdentityReactivated:
      name: com.baobab-platform.identity.reactivated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./identity-reactivated.schema.json }
    MembershipRevoked:
      name: com.baobab-platform.membership.revoked.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./membership-revoked.schema.json }
    EntitlementRevoked:
      name: com.baobab-platform.entitlement.revoked.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./entitlement-revoked.schema.json }
    CredentialCompromised:
      name: com.baobab-platform.credential.compromised.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./credential-compromised.schema.json }
    SessionRevoked:
      name: com.baobab-platform.session.revoked.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./session-revoked.schema.json }
    WorkloadRevoked:
      name: com.baobab-platform.workload.revoked.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./workload-revoked.schema.json }

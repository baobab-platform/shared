packages:
  - "packages/*"

overrides:
  # GHSA-68fv-2mgg-jv7q; fixed in source-map-js 1.2.2.
  source-map-js: 1.2.2
  # GHSA-7mx3-vvmw-hjmv; GraphQL Codegen still requests utils 11.x but the
  # upstream fix begins at 12.0.1. CI build/generation is the compatibility
  # proof for this build-time override.
  '@graphql-tools/utils': 12.0.1
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  protobufjs: true

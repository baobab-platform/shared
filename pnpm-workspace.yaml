packages:
  - "packages/*"

overrides:
  # GHSA-68fv-2mgg-jv7q; fixed in source-map-js 1.2.2.
  source-map-js: 1.2.2
  # GHSA-7mx3-vvmw-hjmv; GraphQL Codegen still requests utils 11.x but the
  # upstream fixes require 12.0.2 (GHSA-c4qx-w738-7hr3). CI build/generation is the compatibility
  # proof for this build-time override.
  '@graphql-tools/utils': 12.0.2
  # GHSA-pqg4-j6r4-53mv (critical); reached only through the build-time
  # @changesets/cli > launch-editor chain. Fixed in shell-quote 1.11.0.
  shell-quote: 1.11.0
  # GHSA-587h-7wmj-h5pm: retain supplier Vitest's supported Vite major;
  # patch the Windows editor-launch bypass in each dependency line.
  'vite@>=7.0.0 <8': 7.3.7
  launch-editor: 2.14.2
allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  protobufjs: true

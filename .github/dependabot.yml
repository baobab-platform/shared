# BA-SEC-DEP-001 — Baobab Dependency & Security Maintenance Policy v1.0
# Policy: docs/governance/baobab-dependency-security-maintenance-policy-v1.0.md
#
# Version updates run weekly; security updates are advisory-driven and do
# not wait for the schedule. Only routine version updates are grouped.
# Security updates target the repository default branch: omit target-branch.
# Review action SHA/release provenance and downstream consumers before merge.
# In the existing Shared CI, the action-pinning and dependency-audit gates
# independently verify more than Dependabot itself can establish.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    groups:
      actions-routine-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The root package.json and pnpm-lock.yaml govern packages/*.
  # GitHub added Dependabot support for pnpm 11 on 20 October 2026.
  # A single npm ecosystem entry at / covers the pnpm workspace root.
  # Private registry access, if needed, must use GitHub Dependabot secrets
  # rather than source-controlled npm authentication tokens.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    groups:
      npm-routine-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

# No Docker bump entry: the Shared contracts distribution image is FROM scratch
# and has no upstream base dependency to track. The digest-pinned devcontainer
# image is governed by its own central toolchain/consumer upgrade process.

name: Reusable — Foundation Security

on:
  workflow_call:
    inputs:
      scope:
        description: >
          pr — a pull request: secrets scanned over the PR's own commits and
          dependency review applicable. branch — push, dispatch or schedule under
          the full profile: secrets scanned over the checked-out ref's full
          history. deep — scheduled deep security: secrets scanned over every
          fetched ref; dependency review off.
        type: string
        default: branch
      dependency_review_enabled: { type: boolean, default: false }
      sast_provider:
        description: Classifier-resolved SAST provider (codeql | fallback | disabled).
        type: string
        default: fallback
      ghas_approved:
        description: The repository contract carries an approved, unexpired security.ghas record.
        type: boolean
        default: false
      python: { type: boolean, default: false }
      node: { type: boolean, default: false }
      go: { type: boolean, default: false }
      java: { type: boolean, default: false }
      rust: { type: boolean, default: false }
      infrastructure: { type: boolean, default: false }
      package_managers: { type: string, default: "{}" }
      exceptions: { type: string, default: "{}" }

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-26.04
    steps:
      - name: Validate security scope
        env:
          SCOPE: "${{ inputs.scope }}"
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: |
          set -euo pipefail
          case "$SCOPE" in
            pr) [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::scope pr needs a pull_request event with a base sha"; exit 1; } ;;
            branch|deep) ;;
            *) echo "::error::unsupported security scope '$SCOPE' (expected pr, branch or deep)"; exit 1 ;;
          esac
          echo "::notice::Security scope: $SCOPE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      # Trivy resolves Maven POMs (parents, BOMs) from the local repository
      # before Maven Central, and Central rate-limits shared runner IPs (429 with
      # a 30-minute block). Resolving through the project's committed wrapper
      # first means the audit reads a warm ~/.m2 instead of Central.
      - uses: actions/setup-java@1aa87b638dacaa70f1c903fa9ec9cbd91058e2ff # v6.0.1+1 (main, 2026-09-10)
        if: ${{ inputs.java && fromJSON(inputs.exceptions)['dependency-audit'] == null }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Resolve Maven dependencies for the audit
        if: ${{ inputs.java && fromJSON(inputs.exceptions)['dependency-audit'] == null }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r wrapper; do
            (cd "$(dirname "$wrapper")" && ./mvnw --batch-mode --no-transfer-progress dependency:go-offline)
          done < <(find . -type f -name mvnw -perm -u+x -not -path '*/.git/*' | sort)
      - name: Audit dependencies
        if: ${{ fromJSON(inputs.exceptions)['dependency-audit'] == null }}
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-version-check .
      - name: Record dependency-audit exception
        if: fromJSON(inputs.exceptions)['dependency-audit'] != null
        run: echo "::warning::Dependency audit waived by an approved repository exception"
      # Misconfiguration scanning needs no dependency resolution, so it never
      # contacts package registries.
      - name: Scan infrastructure and configuration
        run: trivy fs --scanners misconfig --offline-scan --severity HIGH,CRITICAL --exit-code 1 --skip-version-check .

  native-deps:
    uses: ./.github/workflows/reusable-foundation-dependency-adapters.yml
    with:
      python: "${{ inputs.python }}"
      node: "${{ inputs.node }}"
      go: "${{ inputs.go }}"
      java: "${{ inputs.java }}"
      rust: "${{ inputs.rust }}"
      infrastructure: "${{ inputs.infrastructure }}"
      package_managers: "${{ inputs.package_managers }}"
      exceptions: "${{ inputs.exceptions }}"

  secrets:
    if: ${{ fromJSON(inputs.exceptions)['secret-scan'] == null }}
    uses: ./.github/workflows/security-secrets-scan.yml
    with:
      log-opts: "${{ inputs.scope == 'pr' && format('{0}..HEAD', github.event.pull_request.base.sha) || (inputs.scope == 'deep' && '--all' || 'HEAD') }}"

  dependency-review:
    uses: ./.github/workflows/reusable-foundation-dependency-review.yml
    with:
      enabled: "${{ inputs.dependency_review_enabled && inputs.scope == 'pr' }}"
      ghas_approved: "${{ inputs.ghas_approved }}"
      exceptions: "${{ inputs.exceptions }}"

  sast:
    uses: ./.github/workflows/reusable-foundation-sast.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      provider: "${{ inputs.sast_provider }}"
      python: "${{ inputs.python }}"
      node: "${{ inputs.node }}"
      go: "${{ inputs.go }}"
      java: "${{ inputs.java }}"
      rust: "${{ inputs.rust }}"
      exceptions: "${{ inputs.exceptions }}"

  result:
    name: "Security / ${{ inputs.scope == 'pr' && 'PR' || (inputs.scope == 'deep' && 'Deep' || 'Branch') }}"
    if: always()
    needs: [portable, native-deps, secrets, dependency-review, sast]
    runs-on: ubuntu-26.04
    steps:
      - env:
          RESULTS: "${{ toJSON(needs) }}"
        shell: ruby {0}
        run: |
          require "json"
          results = JSON.parse(ENV.fetch("RESULTS"))
          failed = results.select { |_, value| !%w[success skipped].include?(value.fetch("result")) }
          abort "security controls failed: #{failed.keys.join(', ')}" unless failed.empty?

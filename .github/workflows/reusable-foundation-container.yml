name: Reusable — Foundation Container

on:
  workflow_call:
    inputs:
      enabled: { type: boolean, default: false }
      dockerfile: { type: string, default: "Dockerfile" }
      build_context: { type: string, default: "." }
      runtime: { type: boolean, default: true }
      # Opt-in: skip vulnerabilities that have no fixed version upstream
      # (trivy --ignore-unfixed). Anything with an available fix still fails.
      ignore_unfixed: { type: boolean, default: false }
      # report records vulnerability/secret findings without blocking development builds.
      # block remains the default for every existing consumer.
      findings_policy: { type: string, default: "block" }
      exceptions: { type: string, default: "{}" }

permissions:
  contents: read
  packages: read

jobs:
  container:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate artifact coordinates and Dockerfile policy
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-policy'] == null
        env:
          DOCKERFILE: "${{ inputs.dockerfile }}"
          BUILD_CONTEXT: "${{ inputs.build_context }}"
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DOCKERFILE" != /* && "$BUILD_CONTEXT" != /* ]] || { echo "::error::Container paths must be repository-relative"; exit 1; }
          [[ "$DOCKERFILE" != *".."* && "$BUILD_CONTEXT" != *".."* ]] || { echo "::error::Container paths must not escape the repository"; exit 1; }
          [[ -f "$DOCKERFILE" ]] || { echo "::error::$DOCKERFILE does not exist"; exit 1; }
          [[ -d "$BUILD_CONTEXT" ]] || { echo "::error::$BUILD_CONTEXT is not a directory"; exit 1; }
          # Classify each FROM image, skipping flags such as --platform and
          # references to earlier build stages ("FROM build AS test"). Global
          # ARG defaults (declared before the first FROM) are substituted, as
          # Docker does; an image taken from an ARG without a default stays
          # unverifiable and fails.
          violations="$(awk '
            BEGIN { quote = sprintf("%c", 39) }
            toupper($1) == "ARG" && !seen_from && index($2, "=") > 1 {
              name = substr($2, 1, index($2, "=") - 1)
              value = substr($2, index($2, "=") + 1)
              gsub(/^"|"$/, "", value)
              if (substr(value, 1, 1) == quote) value = substr(value, 2)
              if (substr(value, length(value), 1) == quote) value = substr(value, 1, length(value) - 1)
              if (value != "") args[name] = value
            }
            toupper($1) == "FROM" {
              seen_from = 1
              i = 2
              while (i <= NF && $i ~ /^--/) i++
              image = $i
              for (name in args) {
                while ((at = index(image, "${" name "}")) > 0)
                  image = substr(image, 1, at - 1) args[name] substr(image, at + length(name) + 3)
                while (match(image, "[$]" name "([^A-Za-z0-9_]|$)"))
                  image = substr(image, 1, RSTART - 1) args[name] substr(image, RSTART + length(name) + 1)
              }
              image = tolower(image)
              if (image in stages || image == "scratch") {
                # earlier stage or empty base
              } else if (image ~ /:(latest|edge)(@|$)/) {
                print "floating:" image
              } else if (image !~ /[:@]/) {
                print "untagged:" image
              }
              if (toupper($(i + 1)) == "AS") stages[tolower($(i + 2))] = 1
            }' "$DOCKERFILE")"
          if grep -q '^floating:' <<<"$violations"; then
            echo "::error::Container base images must not use latest or edge: $(grep '^floating:' <<<"$violations" | cut -d: -f2- | paste -sd, -)"
            exit 1
          fi
          if grep -q '^untagged:' <<<"$violations"; then
            echo "::error::Container base images require an explicit tag or digest: $(grep '^untagged:' <<<"$violations" | cut -d: -f2- | paste -sd, -)"
            exit 1
          fi

      - name: Record container-policy exception
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-policy'] != null
        run: echo "::warning::Container policy waived by an approved repository exception"

      - name: Build container
        if: inputs.enabled
        env:
          DOCKERFILE: "${{ inputs.dockerfile }}"
          BUILD_CONTEXT: "${{ inputs.build_context }}"
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only same-repository PRs can build consumers needing private
          # package access. The token is a BuildKit secret, NEVER an ARG.
          extra_build_args=()
          if [[ -f "$BUILD_CONTEXT/.npmrc" ]] && grep -Fqx '@baobab-platform:registry=https://npm.pkg.github.com' "$BUILD_CONTEXT/.npmrc"; then
            if [[ '${{ github.event_name }}' == 'pull_request' && '${{ github.event.pull_request.head.repo.full_name }}' != '${{ github.repository }}' ]]; then
              echo '::error::Refusing private npm token exposure to forked PR'
              exit 1
            fi
            extra_build_args=(--secret id=npm_token,env=NODE_AUTH_TOKEN)
          fi
          docker build "${extra_build_args[@]}" \
            --file "$DOCKERFILE" \
            --build-arg VERSION="0.0.0-ci" \
            --build-arg REVISION="${{ github.sha }}" \
            --tag "foundation-scan:${{ github.sha }}" \
            "$BUILD_CONTEXT"

      - name: Validate OCI metadata and runtime safety
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-policy'] == null
        env:
          IMAGE: "foundation-scan:${{ github.sha }}"
          RUNTIME: "${{ inputs.runtime }}"
        shell: ruby {0}
        run: |
          require "json"
          image = ENV.fetch("IMAGE")
          config = JSON.parse(%x[docker image inspect #{image} --format '{{json .Config}}'])
          abort "unable to inspect built image" unless $?.success?
          labels = config["Labels"] || {}
          %w[org.opencontainers.image.source org.opencontainers.image.version org.opencontainers.image.revision].each do |label|
            abort "required OCI label #{label} is missing" if labels[label].to_s.empty?
          end
          if ENV["RUNTIME"] == "true"
            user = config["User"].to_s
            abort "runtime image must declare a non-root USER" if user.empty? || %w[root 0 0:0].include?(user)
            abort "runtime image must declare HEALTHCHECK" unless config["Healthcheck"].is_a?(Hash)
          end

      - name: Install checksum-verified Trivy
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-scan'] == null
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # GitHub Releases intermittently returns 5xx/504 on asset downloads.
          # Retry transport failures only; never fall back to another binary,
          # release, digest, cached scanner, or a waived security result.
          # Both checksum verification and the subsequent Trivy HIGH/CRITICAL
          # exit-code gate remain unconditional and fail closed.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
            --connect-timeout 15 --max-time 65 \
            -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      - name: Scan built image and retain sanitized findings
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-scan'] == null
        env:
          FINDINGS_POLICY: "${{ inputs.findings_policy }}"
          IGNORE_UNFIXED: "${{ inputs.ignore_unfixed }}"
          IMAGE: "foundation-scan:${{ github.sha }}"
          EVIDENCE_DIR: "${{ runner.temp }}/foundation-container-evidence"
        run: |
          set -euo pipefail
          [[ "$FINDINGS_POLICY" == "block" || "$FINDINGS_POLICY" == "report" ]] || {
            echo "::error::findings_policy must be block or report"
            exit 2
          }
          mkdir -p "$EVIDENCE_DIR"
          vuln_raw="$RUNNER_TEMP/trivy-vulnerabilities-private.json"
          secret_raw="$RUNNER_TEMP/trivy-secrets-private.json"

          # Exit code 0 means findings are reported, not suppressed. Trivy
          # transport/database/parser/runtime errors still return non-zero.
          vuln_args=(--scanners vuln --severity HIGH,CRITICAL --ignorefile /dev/null --pkg-types os,library --exit-code 1 --skip-version-check)
          if [[ "$IGNORE_UNFIXED" == "true" ]]; then
            vuln_args+=(--ignore-unfixed)
          fi
          set +e
          trivy image "${vuln_args[@]}" --format json --output "$vuln_raw" "$IMAGE" 2>"$RUNNER_TEMP/trivy-vulnerability-stderr.txt"
          vuln_rc=$?
          set -e
          jq -e '.Results | type == "array" and length > 0' "$vuln_raw" >/dev/null
          jq -e 'all(.Results[]; (.Target|type) == "string" and (.Target|length) > 0 and (.Type|type) == "string" and (.Type|length) > 0 and ((.Vulnerabilities // [])|type) == "array")' "$vuln_raw" >/dev/null
          jq '{
            schema_version: 1,
            findings: [
              .Results[]? as $r |
              $r.Vulnerabilities[]? |
              {
                target: $r.Target,
                type: $r.Type,
                vulnerability_id: .VulnerabilityID,
                package: .PkgName,
                installed_version: .InstalledVersion,
                fixed_version: (.FixedVersion // ""),
                severity: .Severity,
                title: (.Title // ""),
                primary_url: (.PrimaryURL // "")
              }
            ]
          }' "$vuln_raw" > "$EVIDENCE_DIR/vulnerabilities.json"
          vuln_count="$(jq '.findings | length' "$EVIDENCE_DIR/vulnerabilities.json")"
          if grep -Eq '(^|[[:space:]])(ERROR|FATAL)([[:space:]]|:)' "$RUNNER_TEMP/trivy-vulnerability-stderr.txt" ||
             { (( vuln_rc != 0 )) && { (( vuln_rc != 1 )) || (( vuln_count == 0 )); }; }; then
            cat "$RUNNER_TEMP/trivy-vulnerability-stderr.txt" >&2
            echo "::error::Trivy vulnerability scan failed or returned no findings report"
            exit "${vuln_rc:-1}"
          fi

          set +e
          trivy image --scanners secret --ignorefile /dev/null --exit-code 1 \
            --skip-version-check --format json --output "$secret_raw" "$IMAGE" \
            2>"$RUNNER_TEMP/trivy-secret-stderr.txt"
          secret_rc=$?
          set -e
          jq -e '.Results | type == "array" and length > 0' "$secret_raw" >/dev/null
          jq -e 'all(.Results[]; (.Target|type) == "string" and (.Target|length) > 0 and (.Type|type) == "string" and (.Type|length) > 0 and ((.Secrets // [])|type) == "array")' "$secret_raw" >/dev/null
          jq '{
            schema_version: 1,
            findings: [
              .Results[]? as $r |
              $r.Secrets[]? |
              {
                target: $r.Target,
                category: (.Category // ""),
                rule_id: (.RuleID // ""),
                severity: (.Severity // ""),
                title: (.Title // ""),
                start_line: (.StartLine // 0),
                end_line: (.EndLine // 0)
              }
            ]
          }' "$secret_raw" > "$EVIDENCE_DIR/secrets-sanitized.json"
          secret_count="$(jq '.findings | length' "$EVIDENCE_DIR/secrets-sanitized.json")"
          if grep -Eq '(^|[[:space:]])(ERROR|FATAL)([[:space:]]|:)' "$RUNNER_TEMP/trivy-secret-stderr.txt" ||
             { (( secret_rc != 0 )) && { (( secret_rc != 1 )) || (( secret_count == 0 )); }; }; then
            cat "$RUNNER_TEMP/trivy-secret-stderr.txt" >&2
            echo "::error::Trivy secret scan failed or returned no findings report"
            exit "${secret_rc:-1}"
          fi
          rm -f "$vuln_raw" "$secret_raw" \
            "$RUNNER_TEMP/trivy-vulnerability-stderr.txt" "$RUNNER_TEMP/trivy-secret-stderr.txt"

          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg commit "$GITHUB_SHA" --arg image "$image_id" \
            --arg scanner "$(trivy --version | head -n 1)" \
            --arg policy "$FINDINGS_POLICY" --argjson vulnerabilities "$vuln_count" \
            --argjson secrets "$secret_count" \
            '{schema_version:1,source_commit:$commit,image_id:$image,scanner:$scanner,findings_policy:$policy,vulnerability_findings:$vulnerabilities,secret_findings:$secrets}' \
            > "$EVIDENCE_DIR/scan-receipt.json"

          echo "Vulnerability findings: $vuln_count; secret findings: $secret_count"
          if (( vuln_count + secret_count > 0 )); then
            if [[ "$FINDINGS_POLICY" == "block" ]]; then
              echo "::error::Container scan found HIGH/CRITICAL vulnerabilities or secrets"
              exit 1
            fi
            echo "::warning::Development image has scan findings; sanitized evidence is retained and the build continues"
          fi

      - name: Retain sanitized container scan evidence
        if: always() && inputs.enabled && fromJSON(inputs.exceptions)['container-scan'] == null
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-container-scan-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-container-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Record container-scan exception
        if: inputs.enabled && fromJSON(inputs.exceptions)['container-scan'] != null
        run: echo "::warning::Container vulnerability scan waived by an approved repository exception"

      - name: Generate SPDX SBOM
        if: inputs.enabled && fromJSON(inputs.exceptions).sbom == null
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "foundation-scan:${{ github.sha }}"
          artifact-name: foundation-sbom.spdx.json

      - name: Record SBOM exception
        if: inputs.enabled && fromJSON(inputs.exceptions).sbom != null
        run: echo "::warning::SBOM generation waived by an approved repository exception"

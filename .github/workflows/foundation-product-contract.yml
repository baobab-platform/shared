name: "Reusable — Foundation Product: Contract"
# Repository contract family: classification, baseline, reproducibility,
# runtime quality, and development-environment validation.
# Use for PR feedback when security/container are owned by other workflows.
on:
  workflow_call:
    inputs:
      foundation_ref:
        description: Exact shared commit used by the caller; policy files are loaded from this ref.
        type: string
        required: true
      legacy_metadata_enabled:
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  foundation:
    uses: ./.github/workflows/foundation-repository-gates.yml
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      profile: contract
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"

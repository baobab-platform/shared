name: "Reusable — RTD-10 Cross-Repository Conformance"

on:
  workflow_call:
    secrets:
      SHARED_READ_TOKEN:
        description: Read-only credential for baobab-platform/shared when github.token cannot read the sibling repository.
        required: false

permissions:
  contents: read

jobs:
  conformance:
    name: RTD-10 / ${{ github.event.repository.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read immutable Shared pin
        id: pin
        shell: bash
        run: |
          test -f .baobab/rtd-conformance.yaml
          commit="$(awk '/^  commit: / {print $2; exit}' .baobab/rtd-conformance.yaml | tr -d '"')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Shared conformance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.commit }}
          path: .rtd-shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: "3.13"

      - name: Install conformance runtime
        run: python -m pip install --disable-pip-version-check -r .rtd-shared/.github/foundation-tests/requirements.txt

      - name: Validate RTD-10 repository boundary
        run: >-
          python .rtd-shared/scripts/rtd_conformance.py check
          --repository-root .
          --shared-repo .rtd-shared
          --repository-id "${GITHUB_REPOSITORY#*/}"

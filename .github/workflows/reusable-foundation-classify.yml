name: Reusable — Foundation Classification

on:
  workflow_call:
    inputs:
      legacy_metadata_enabled:
        type: boolean
        default: true
    outputs:
      python: { value: "${{ jobs.classify.outputs.python }}" }
      node: { value: "${{ jobs.classify.outputs.node }}" }
      go: { value: "${{ jobs.classify.outputs.go }}" }
      java: { value: "${{ jobs.classify.outputs.java }}" }
      container: { value: "${{ jobs.classify.outputs.container }}" }
      container_artifact: { value: "${{ jobs.classify.outputs.container_artifact }}" }
      environment_required: { value: "${{ jobs.classify.outputs.environment_required }}" }
      metadata_mode: { value: "${{ jobs.classify.outputs.metadata_mode }}" }

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-26.04
    outputs:
      python: "${{ steps.resolve.outputs.python }}"
      node: "${{ steps.resolve.outputs.node }}"
      go: "${{ steps.resolve.outputs.go }}"
      java: "${{ steps.resolve.outputs.java }}"
      container: "${{ steps.resolve.outputs.container }}"
      container_artifact: "${{ steps.resolve.outputs.container_artifact }}"
      environment_required: "${{ steps.resolve.outputs.environment_required }}"
      metadata_mode: "${{ steps.resolve.outputs.metadata_mode }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        name: Resolve repository capabilities
        env:
          LEGACY_METADATA_ENABLED: "${{ inputs.legacy_metadata_enabled }}"
        shell: ruby {0}
        run: |
          require "date"
          require "yaml"

          contract_path = ".baobab/repository.yaml"
          declared = []
          environment_required = false
          container_artifact = false
          metadata_mode = "contract"

          if File.file?(contract_path)
            contract = YAML.safe_load_file(contract_path, permitted_classes: [Date], aliases: false)
            abort "schema_version must be 1" unless contract["schema_version"] == 1
            lifecycle = contract.dig("repository", "lifecycle")
            abort "unsupported repository lifecycle" unless %w[experimental active maintenance deprecated].include?(lifecycle)
            declared = contract["capabilities"]
            abort "capabilities must be a unique array" unless declared.is_a?(Array) && declared == declared.uniq
            known = %w[python node go java container infrastructure documentation contracts github-actions digital-estate engine library development-environment]
            unknown = declared - known
            abort "unknown capabilities: #{unknown.join(', ')}" unless unknown.empty?
            environment_required = contract.dig("environment", "baobab_dev", "required")
            abort "environment.baobab_dev.required must be boolean" unless [true, false].include?(environment_required)
            container_artifact = contract.dig("artifacts", "container")
            abort "artifacts.container must be boolean" unless [true, false].include?(container_artifact)
            (contract["exceptions"] || {}).each do |control, exception|
              expiry = Date.iso8601(exception.fetch("expires")) rescue abort("exception #{control} has invalid expiry")
              abort "exception #{control} expired on #{expiry}" if expiry < Date.today
            end
          elsif ENV.fetch("LEGACY_METADATA_ENABLED") == "true" && (File.file?(".baobab/environment.yaml") || File.file?(".nabhold/environment.yaml"))
            metadata_mode = "legacy"
            environment_required = true
            warn "::warning::.baobab/repository.yaml is required after migration; using temporary legacy environment metadata"
          else
            abort ".baobab/repository.yaml is required"
          end

          evidence = {
            "python" => File.file?("pyproject.toml") || !Dir.glob("**/pyproject.toml").empty?,
            "node" => File.file?("package.json"),
            "go" => File.file?("go.mod"),
            "java" => File.file?("pom.xml") || !Dir.glob("**/pom.xml").empty? || File.file?("build.gradle") || File.file?("build.gradle.kts"),
            "container" => File.file?("Dockerfile") || !Dir.glob("**/Dockerfile").empty?
          }
          effective = evidence.dup
          declared.each { |capability| effective[capability] = true if effective.key?(capability) }

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            %w[python node go java container].each { |capability| output.puts "#{capability}=#{effective.fetch(capability, false)}" }
            output.puts "environment_required=#{environment_required}"
            output.puts "container_artifact=#{container_artifact}"
            output.puts "metadata_mode=#{metadata_mode}"
          end

          summary = %w[python node go java container].map { |c| "| #{c} | #{effective.fetch(c, false)} |" }
          File.write(ENV.fetch("GITHUB_STEP_SUMMARY"), "## Foundation classification\n\nMetadata: **#{metadata_mode}**\n\n| Capability | Active |\n|---|---|\n#{summary.join("\n")}\n")

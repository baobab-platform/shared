name: Reusable — Foundation Development Environment
on:
  workflow_call:
    secrets:
      SHARED_READ_TOKEN:
        description: Read-only credential for the private baobab-platform/shared repository; defaults to github.token for Shared itself.
        required: false
    inputs:
      foundation_ref:
        description: Immutable shared commit containing the environment catalogue.
        type: string
        required: true
      required: { type: boolean, default: false }
permissions:
  contents: read
  packages: read
jobs:
  environment:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout canonical Foundation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          ref: "${{ inputs.foundation_ref }}"
          path: .foundation
          persist-credentials: false
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: "3.13"
      - name: Install environment preflight runtime
        run: python -m pip install --disable-pip-version-check -r .foundation/.github/foundation-tests/requirements.txt
      - name: Validate Baobab development environment declaration
        if: inputs.required
        id: contract
        shell: bash
        run: >-
          python .foundation/scripts/development_environment.py --repository-root .
          --catalogue .foundation/.baobab/environment-profiles.json
          --github-output "$GITHUB_OUTPUT"
      - name: Authenticate to GHCR
        if: inputs.required
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ github.token }}"
      - name: Verify declared baobab-dev image
        if: inputs.required
        env:
          IMAGE: "${{ steps.contract.outputs.image }}"
        shell: bash
        run: docker manifest inspect "$IMAGE" >/dev/null
      # G-FCI-1 (ADR-SHARED-017, EA-02; G-FCI-1 decision 2026-09-30).
      # Policy, enforced: an active repository with the engine trait must
      # ship .baobab/capability-provider.yaml; an experimental engine may
      # omit it or declare planned capabilities only. A declaration that
      # exists is always validated against the pinned Shared commit.
      # Passing proves structure, catalogue references and evidence paths;
      # it never certifies (EA-09) or activates (Control Plane) anything,
      # and repository lifecycle never implies provider activation.
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6 (main, 2026-09-09)
        with:
          python-version: "3.13"
      - name: Install capability declaration validator runtime
        shell: bash
        run: python -m pip install --disable-pip-version-check -r .foundation/.github/foundation-tests/requirements.txt
      - name: Check capability declaration lifecycle policy
        if: hashFiles('.baobab/repository.yaml') != ''
        shell: bash
        run: python .foundation/scripts/capability_catalogue.py check-declaration-policy --repository-root . --mode enforce
      - name: Validate capability provider declaration
        if: hashFiles('.baobab/capability-provider.yaml') != ''
        env:
          ENGINE_ID: "${{ github.event.repository.name }}"
        shell: bash
        run: |
          python .foundation/scripts/capability_catalogue.py validate-declaration \
            .baobab/capability-provider.yaml --engine-id "$ENGINE_ID" --repository-root .
      # EA-01C/D (EA Plan v2.0). contracts.lock.yaml must match
      # .baobab/contract-consumer-lock.schema.json, pin a commit on Shared
      # main, and list contracts that exist and parse at that commit; an
      # active engine must carry one. Gate 3 (enforced): --mode auto fails
      # an engine repository on any finding and reports findings for other
      # repositories as warnings, so frozen Digital Estates are not failed
      # before the EA Unfreeze Gate. The drift report never fails: being
      # behind is not a release failure; a removed consumed contract is
      # incompatible and is a check finding.
      - name: Checkout Shared main history for contract lock checks
        if: hashFiles('.baobab/repository.yaml', 'contracts.lock.yaml') != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          token: ${{ secrets.SHARED_READ_TOKEN || github.token }}
          ref: main
          path: .shared-history
          fetch-depth: 0
          persist-credentials: false
      - name: Check contract consumer lock (EA-01C)
        if: hashFiles('.baobab/repository.yaml', 'contracts.lock.yaml') != ''
        shell: bash
        run: python .foundation/scripts/contract_lock.py check --repository-root . --shared-repo .shared-history --mode auto
      - name: Report Shared contract drift (EA-01D)
        if: hashFiles('contracts.lock.yaml') != ''
        shell: bash
        run: python .foundation/scripts/contract_lock.py drift --repository-root . --shared-repo .shared-history >> "$GITHUB_STEP_SUMMARY"

# Node 24 Shared BXS package tests, independent of operational TMS/CP services.
name: Experience Foundations
on:
  pull_request:
    paths:
      - 'packages/experience-*/**'
      - 'docs/experience/**'
      - '.github/workflows/experience-foundations.yml'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-experience-package*'
      - '.github/workflows/verify-experience-registry.yml'
  push:
    branches: [main]
    paths:
      - 'packages/experience-*/**'
      - 'docs/experience/**'
      - '.github/workflows/experience-foundations.yml'
      - 'pnpm-lock.yaml'
      - 'scripts/verify-experience-package*'
      - '.github/workflows/verify-experience-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  quality:
    name: Experience package build and tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check approved runtime major
        run: node -e "if(process.versions.node.split('.')[0]!=='24')process.exit(1)"
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Verify release evidence checker rejects tampered artifacts
        run: node --test scripts/verify-experience-package.test.mjs
      - name: Lint and validate
        run: |
          pnpm --filter @baobab-platform/experience-tokens lint
          pnpm --filter @baobab-platform/experience-geo-core lint
      - name: Test negative cases
        run: |
          pnpm --filter @baobab-platform/experience-tokens test
          pnpm --filter @baobab-platform/experience-geo-core test
      - name: Build neutral evidence dependency before UI typecheck
        run: pnpm --filter @baobab-platform/experience-geo-core build
      - name: Validate source-labelled charts and accessible table fallbacks
        run: |
          pnpm --filter @baobab-platform/experience-charts lint
          pnpm --filter @baobab-platform/experience-charts test
          pnpm --filter @baobab-platform/experience-charts build
          test -s packages/experience-charts/dist/index.d.ts
      - name: Optional geospatial adapter typecheck and model negatives
        run: |
          pnpm --filter @baobab-platform/experience-ui build
          pnpm --filter @baobab-platform/experience-geo-maplibre lint
          pnpm --filter @baobab-platform/experience-geo-maplibre test
      - name: Accessible UI typecheck and semantic tests
        run: |
          pnpm --filter @baobab-platform/experience-ui lint
          pnpm --filter @baobab-platform/experience-ui test
      - name: Build packages
        run: |
          pnpm --filter @baobab-platform/experience-tokens build
          pnpm --filter @baobab-platform/experience-geo-core build
          cp -R packages/experience-tokens/dist /tmp/experience-first
          pnpm --filter @baobab-platform/experience-tokens build
          diff -ru /tmp/experience-first packages/experience-tokens/dist
          test -s packages/experience-tokens/dist/themes/thamani.css
          test -s packages/experience-geo-core/dist/index.d.ts
          test -s packages/experience-ui/dist/index.js
          test -s packages/experience-ui/dist/index.d.ts

  storybook-browser:
    name: Storybook / Chromium a11y and visual contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Locked workspace install
        run: pnpm install --frozen-lockfile
      - name: Build Shared tokens and UI
        run: |
          pnpm --filter @baobab-platform/experience-tokens build
          pnpm --filter @baobab-platform/experience-geo-core build
          pnpm --filter @baobab-platform/experience-ui build
          pnpm --filter @baobab-platform/experience-geo-maplibre build
      - name: Typecheck Storybook integration
        run: pnpm --filter @baobab-platform/experience-storybook typecheck
      - name: Build Storybook static
        run: pnpm --filter @baobab-platform/experience-storybook build
      - name: Install Chromium
        run: pnpm --filter @baobab-platform/experience-storybook exec playwright install --with-deps chromium
      - name: Real-browser semantic, visual and accessibility checks
        run: pnpm --filter @baobab-platform/experience-storybook test:e2e
      - name: Preserve visual review and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.7.5
        with:
          name: bxs-storybook-browser-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            packages/experience-storybook/test-results/
            packages/experience-storybook/playwright-report/
            packages/experience-storybook/tests/foundations.spec.ts-snapshots/

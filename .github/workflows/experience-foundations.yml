# Node 24 Shared BXS package tests, independent of operational TMS/CP services.
name: Experience Foundations
on:
  pull_request:
    paths:
      - 'packages/experience-*/**'
      - 'docs/experience/**'
      - '.github/workflows/experience-foundations.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'packages/experience-*/**'
      - 'docs/experience/**'
      - '.github/workflows/experience-foundations.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  quality:
    name: Experience package build and tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Check approved runtime major
        run: node -e "if(process.versions.node.split('.')[0]!=='24')process.exit(1)"
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Lint and validate
        run: |
          pnpm --filter @baobab-platform/experience-tokens lint
          pnpm --filter @baobab-platform/experience-geo-core lint
      - name: Test negative cases
        run: |
          pnpm --filter @baobab-platform/experience-tokens test
          pnpm --filter @baobab-platform/experience-geo-core test
      - name: Accessible UI typecheck and semantic tests
        run: |
          pnpm --filter @baobab-platform/experience-ui lint
          pnpm --filter @baobab-platform/experience-ui test
      - name: Build packages
        run: |
          pnpm --filter @baobab-platform/experience-tokens build
          pnpm --filter @baobab-platform/experience-geo-core build
          cp -R packages/experience-tokens/dist /tmp/experience-first
          pnpm --filter @baobab-platform/experience-tokens build
          diff -ru /tmp/experience-first packages/experience-tokens/dist
          test -s packages/experience-tokens/dist/themes/thamani.css
          test -s packages/experience-geo-core/dist/index.d.ts
          test -s packages/experience-ui/dist/index.js
          test -s packages/experience-ui/dist/index.d.ts

# ==============================================================================
# BAOBAB-PLATFORM Shared Engineering Infrastructure
# Reusable Workflow: CodeQL Static Analysis
#
# File: .github/workflows/security-codeql.yml
#
# PURPOSE:
#   Runs GitHub's CodeQL SAST engine against the calling repository for
#   whichever languages it declares via the `languages` input, uploading
#   results to that repository's own Security tab (GitHub-native — no
#   external service, no license). Fulfils the "CodeQL integration" item
#   under this repository's own README.md > Roadmap > Security.
#
# WHY A `languages` INPUT RATHER THAN A FIXED LANGUAGE:
#   Today only baobab-platform/baobab has a language CodeQL can analyse (Python).
#   baobab-platform/baobab-dev is Dockerfile/shell — CodeQL has no first-class
#   extractor for either, so it isn't a consumer of this workflow, not
#   because the workflow doesn't support it, but because there is nothing
#   here for it to analyse yet. This is still a legitimate "one
#   implementation, many consumers" candidate per this repository's own
#   Guiding Principle: baobab's other planned services (frontend, mobile)
#   will add JS/TS/other CodeQL-supported languages later, and every
#   future consumer reuses this same file by passing a different
#   `languages` value — nothing here is baobab-specific.
#
# INPUT FORMAT:
#   `languages` is a JSON array STRING (e.g. '["python"]' or
#   '["python","javascript-typescript"]'), not a plain comma list — it is
#   fed straight into `fromJSON()` to build the matrix below. See
#   https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning
#   for supported language identifiers.
#
# build-mode:
#   Defaults to "none" — correct for interpreted languages (Python,
#   JavaScript/TypeScript, Ruby) where CodeQL extracts source directly
#   with no compile step. A future compiled-language consumer (Go, Java,
#   C/C++) would need to override this to "autobuild" or "manual"; that
#   is a per-consumer decision, not something this workflow should guess.
#
# WHY THE SARIF UPLOAD IS ITS OWN STEP (not analyze's built-in auto-upload):
#   codeql-action/analyze's implicit upload (its default `upload: always`)
#   needs to resolve which calling job it's running in by re-fetching and
#   parsing the *calling* repository's own workflow YAML, looking for a
#   job literally named "analyze" with a step that uses this action. That
#   lookup only succeeds when a consumer calls this workflow directly. A
#   consumer that calls it through its own `workflow_call` job (every
#   consumer of this file does — see baobab-platform/baobab-erp's
#   .github/workflows/security.yml) never has a job named "analyze" in
#   its own YAML (that job id only exists here), so the lookup always
#   fails: "Could not get upload input to github/codeql-action/analyze
#   since the workflow has no job named analyze"
#   (job_status: JOB_STATUS_CONFIGURATION_ERROR), even though the CodeQL
#   query evaluation itself completed successfully. Setting
#   `upload: never` on analyze and uploading via a separate, explicit
#   upload-sarif step avoids this: upload-sarif computes its analysis key
#   from the `category`/`matrix` inputs given to it directly, not by
#   parsing the calling workflow for a job name, so it isn't subject to
#   the same lookup regardless of how many workflow_call levels sit above
#   it. sarif_file/checkout_path are left at their defaults, which match
#   analyze's own `output` default ("../results") by convention.
#
# PERMISSIONS:
#   `security-events: write` is required to upload SARIF results to the
#   calling repository's Security tab; `actions: read` is required by
#   CodeQL on private repositories to read workflow run information. Both
#   are declared as a CEILING here — same pattern as every other reusable
#   workflow in this repository — the calling job must grant at least
#   this much itself.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Split the SARIF upload into its own explicit upload-sarif step
#   (analyze: upload: never) -- analyze's implicit auto-upload cannot
#   resolve its calling job through a second workflow_call level and
#   always failed for every consumer of this workflow with
#   JOB_STATUS_CONFIGURATION_ERROR ("workflow has no job named analyze").
# * Initial version.
# ==============================================================================

name: Reusable — CodeQL Static Analysis

on:
  workflow_call:
    inputs:
      languages:
        description: 'JSON array string of CodeQL language identifiers, e.g. ''["python"]''.'
        type: string
        required: false
        default: '["python"]'
      build-mode:
        description: 'CodeQL build mode for every language in the matrix: "none" (interpreted languages), "autobuild", or "manual".'
        type: string
        required: false
        default: "none"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
          upload: never

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
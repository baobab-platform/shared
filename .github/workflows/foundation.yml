name: Foundation Repository Gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  foundation:
    # Self-consumer: full gate on PR/push; scheduled runs use security-deep so
    # deep monitoring is explicit in the product profile (Phase 4 separation).
    uses: ./.github/workflows/foundation-repository-gates.yml
    with:
      foundation_ref: "${{ github.sha }}"
      profile: ${{ github.event_name == 'schedule' && 'security-deep' || 'full' }}
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false

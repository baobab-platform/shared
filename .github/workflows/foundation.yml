name: Foundation Repository Gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  foundation:
    uses: ./.github/workflows/foundation-repository-gates.yml
    with:
      foundation_ref: "${{ github.sha }}"
      dependency_review_enabled: false
      advanced_security_enabled: false
      legacy_metadata_enabled: false

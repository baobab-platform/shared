name: Foundation Repository Gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  foundation:
    uses: ./.github/workflows/foundation-repository-gates.yml
    with:
      dockerfile: "containers/baobab-contracts/Dockerfile"
      build_context: "."
      dependency_review_enabled: false
      legacy_metadata_enabled: false

# ==============================================================================
# BAOBAB-PLATFORM Shared Engineering Infrastructure
# Repository CI: baobab-platform/shared's own checks
#
# File: .github/workflows/ci.yml
#
# PURPOSE:
#   Unlike every other file in .github/workflows/, this one is NOT a
#   reusable workflow for consumers to call — it's this repository's own
#   CI, verifying baobab-platform/shared's own files stay compliant with the
#   policies it hands out to everyone else.
#
#   Before this file existed, nothing actually ran on baobab-platform/shared's own
#   commits: greetings.yml, pages-zensical.yml, enforce-action-pinning.yml,
#   and enforce-dependabot-config.yml all declare only `on: workflow_call`,
#   since a called workflow can't own a real repository-event trigger.
#   That gap is exactly how a corrupted enforce-action-pinning.yml (raw
#   patch text committed as the file's content, invalid YAML) reached main
#   undetected — nothing was checking this repo's own files on push/PR.
#   This workflow closes that gap by dogfooding both governance checks
#   against this repository itself.
#
# WHY LOCAL PATH REFERENCES BELOW
# (./.github/workflows/enforce-action-pinning.yml,
# ./.github/workflows/enforce-dependabot-config.yml) RATHER THAN PINNED
# baobab-platform/shared/...@<sha> REFERENCES:
#   Calling a reusable workflow by relative path within the SAME
#   repository always resolves to the exact commit currently checked
#   out — it is not a separate fetch of a possibly-different ref, so
#   there is no immutability gap to pin against. This is one of the few
#   places in this repository (alongside genuinely local composite
#   actions such as .github/actions/derive-value-from-yaml) where an
#   unpinned `uses:` is correct rather than a policy violation —
#   enforce-action-pinning.yml's own checker deliberately skips local
#   (`./`) references for the same reason, so neither line below will
#   flag itself.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Added scripts/validate-topology-contracts.py to the governance-contracts
#   job, covering the new contracts/topology/v1 package (ADR-BCP-025, gate
#   ER-01): engine releases, deployment observations and release drift.
# * Added scripts/event_contexts.py and its tests to the governance-contracts
#   job: the event context registry and event-type registry (ADR-SHARED-018,
#   T-COMPAT-02).
# * Added scripts/tests/test_contract_lock.py to the governance-contracts job:
#   contract consumer lock validation and Shared drift reporting (EA Plan
#   v2.0 EA-01A/C/D).
# * Added scripts/capability_catalogue.py and its tests to the
#   governance-contracts job: the Canonical Capability Catalogue, capability
#   provider declarations and transitional EngineRegistration bundles
#   (ADR-SHARED-017, EA-02).
# * Added scripts/validate-control-plane-contracts.py to the
#   governance-contracts job: control-plane/v1 administrative read models
#   (canonical registry, capability explanation; ADR-BCP-022).
# * Added scripts/validate-commercial-contracts.py to the governance-contracts
#   job: product/v1 subscription classification, subscriptions/v1 and
#   payments/v1 (ADR-SHARED-011, ADR-BCP-018 gate ORG-11).
# * Added scripts/validate-admission-contracts.py to the governance-contracts
#   job, covering the new contracts/admission/v1 package (ADR-BCP-017
#   ClientApplication, AdmissionDecision, lifecycle and events).
# * Added scripts/validate-trade-document-contracts.py to enforce RTD-04 TradeDocument v2 identity, lifecycle, versioning, artifact and compatibility invariants.
# * Added scripts/validate-cross-engine-reference-contracts.py for RTD-05 owner, scope, pinning and identity-separation invariants.
# * Added scripts/validate-regulatory-document-exchange-contracts.py for RTD-06 requirement/evidence choreography and deferred event activation.
# * Added scripts/validate-documents-event-activation.py for RTD-07 documents stewardship, producer activation and legacy-v1 quarantine.
# * Added scripts/validate-regulations-event-activation.py for RTD-08 namespace registration, Regulations stewardship and producer activation.
# * Added scripts/validate-intelligence-namespace-boundary.py for RTD-09 intelligence namespace reservation and no-premature-promotion invariants.
# * Added scripts/validate-event-registry.py to the governance-contracts job:
#   every event type in every asyncapi.yaml is canonical com.baobab-platform.*
#   and registered once platform-wide, its payload resolves, every example
#   envelope validates, and no contract mentions a legacy com.nabhold.* type
#   (ADR-SHARED-008). The job now sets up Python with the Foundation fixture
#   runtime for real JSON Schema Draft 2020-12 validation.
# * Added scripts/validate-organisation-contracts.py to the
#   governance-contracts job, covering contracts/organisation/v1
#   (ADR-BCP-018). It is the first contract gate that performs real JSON
#   Schema Draft 2020-12 validation with cross-schema $refs resolved, so the
#   job now sets up Python with the Foundation fixture runtime.
# * Added scripts/validate-capability-contracts.rb to the governance-contracts
#   job, covering the new contracts/capability/v1 package (ADR-BCP-002 through
#   ADR-BCP-009, ADR-SHARED-007 Phase 1).
# * Added a dependabot-config job dogfooding enforce-dependabot-config.yml
#   against this repository's own .github/dependabot.yml, alongside the
#   existing action-pinning self-check.
# * Initial version — added after discovering baobab-platform/shared had no CI on
#   itself, following a corrupted enforce-action-pinning.yml reaching
#   main undetected.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "contracts/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "scripts/validate-governance-contracts.rb"
      - "scripts/validate-cross-engine-contracts.rb"
      - "scripts/validate-erp-contracts.rb"
      - "scripts/validate-identity-events-contracts.rb"
      - "scripts/validate-authorization-contracts.rb"
      - "scripts/validate-capability-contracts.rb"
      - "scripts/validate-trade-contracts.rb"
      - "scripts/validate-trade-document-contracts.py"
      - "scripts/validate-cross-engine-reference-contracts.py"
      - "scripts/validate-regulatory-document-exchange-contracts.py"
      - "scripts/validate-documents-event-activation.py"
      - "scripts/validate-regulations-event-activation.py"
      - "scripts/validate-intelligence-namespace-boundary.py"
      - "scripts/validate-event-registry.py"
      - "scripts/validate-organisation-contracts.py"
      - "scripts/validate-admission-contracts.py"
      - "scripts/validate-administration-contracts.py"
      - "scripts/validate-evidence-contracts.py"
      - "scripts/validate-commercial-contracts.py"
      - "scripts/validate-control-plane-contracts.py"
      - "scripts/validate-topology-contracts.py"
      - "scripts/validate-identity-runtime-contracts.py"
      - "scripts/validate-federation-contracts.py"
      - "scripts/capability_catalogue.py"
      - "scripts/contract_lock.py"
      - "scripts/event_contexts.py"
      - ".baobab/contract-consumer-lock.schema.json"
      - "scripts/tests/**"
      - ".github/foundation-tests/requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - "contracts/**"
      - "docs/adr/**"
      - "docs/architecture/**"
      - "scripts/validate-governance-contracts.rb"
      - "scripts/validate-cross-engine-contracts.rb"
      - "scripts/validate-erp-contracts.rb"
      - "scripts/validate-identity-events-contracts.rb"
      - "scripts/validate-authorization-contracts.rb"
      - "scripts/validate-capability-contracts.rb"
      - "scripts/validate-trade-contracts.rb"
      - "scripts/validate-trade-document-contracts.py"
      - "scripts/validate-cross-engine-reference-contracts.py"
      - "scripts/validate-regulatory-document-exchange-contracts.py"
      - "scripts/validate-documents-event-activation.py"
      - "scripts/validate-regulations-event-activation.py"
      - "scripts/validate-intelligence-namespace-boundary.py"
      - "scripts/validate-event-registry.py"
      - "scripts/validate-organisation-contracts.py"
      - "scripts/validate-admission-contracts.py"
      - "scripts/validate-administration-contracts.py"
      - "scripts/validate-evidence-contracts.py"
      - "scripts/validate-commercial-contracts.py"
      - "scripts/validate-control-plane-contracts.py"
      - "scripts/validate-topology-contracts.py"
      - "scripts/validate-identity-runtime-contracts.py"
      - "scripts/validate-federation-contracts.py"
      - "scripts/capability_catalogue.py"
      - "scripts/contract_lock.py"
      - "scripts/event_contexts.py"
      - ".baobab/contract-consumer-lock.schema.json"
      - "scripts/tests/**"
      - ".github/foundation-tests/requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-contracts:
    name: Validate canonical contracts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tenancy, identity, product and example invariants
        run: ruby scripts/validate-governance-contracts.rb
      - name: Validate event, error, trace and idempotency invariants
        run: ruby scripts/validate-cross-engine-contracts.rb
      - name: Validate ERP boundary and system-of-record invariants
        run: ruby scripts/validate-erp-contracts.rb
      - name: Validate identity-events envelope composition and examples
        run: ruby scripts/validate-identity-events-contracts.rb
      - name: Validate reason-code registry, assurance and delegation contracts
        run: ruby scripts/validate-authorization-contracts.rb
      - name: Validate capability-centric contracts
        run: ruby scripts/validate-capability-contracts.rb
      - name: Validate Trade B2B boundary contracts
        run: ruby scripts/validate-trade-contracts.rb
      - uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6 (main, 2026-09-09)
        with:
          python-version: "3.13"
      - name: Install JSON Schema runtime
        run: python -m pip install --disable-pip-version-check -r .github/foundation-tests/requirements.txt
      - name: Validate TradeDocument v2 contracts (ADR-SHARED-020 / RTD-04)
        run: python scripts/validate-trade-document-contracts.py
      - name: Validate cross-engine object references (ADR-SHARED-021 / RTD-05)
        run: python scripts/validate-cross-engine-reference-contracts.py
      - name: Validate Regulations Trade Docs exchange (ADR-SHARED-022 / RTD-06)
        run: python scripts/validate-regulatory-document-exchange-contracts.py
      - name: Validate documents event activation (ADR-SHARED-023 / RTD-07)
        run: python scripts/validate-documents-event-activation.py
      - name: Validate Regulations event activation (ADR-SHARED-024 / RTD-08)
        run: python scripts/validate-regulations-event-activation.py
      - name: Validate intelligence namespace boundary (ADR-SHARED-025 / RTD-09)
        run: python scripts/validate-intelligence-namespace-boundary.py
      - name: Validate identity runtime profiles (MP2-A)
        run: python scripts/validate-identity-runtime-contracts.py
      - name: Test identity runtime profile invariants
        run: python scripts/tests/test_identity_runtime_contracts.py
      - name: Validate federation trust and evidence contracts (MP2-B)
        run: python scripts/validate-federation-contracts.py
      - name: Test federation trust and evidence invariants
        run: python scripts/tests/test_federation_contracts.py
      - name: Test offline schema reference resolution
        run: python scripts/tests/test_schema_reference_resolution.py
      - name: Validate the platform event registry (ADR-SHARED-008)
        run: python scripts/validate-event-registry.py
      - name: Validate organisation contracts and examples (Draft 2020-12)
        run: python scripts/validate-organisation-contracts.py
      - name: Validate admission contracts, lifecycle and examples (Draft 2020-12)
        run: python scripts/validate-admission-contracts.py
      - name: Validate administrative authority contracts (ADR-BCP-020, Draft 2020-12)
        run: python scripts/validate-administration-contracts.py
      - name: Validate evidence and verification contracts (ADR-BCP-023, Draft 2020-12)
        run: python scripts/validate-evidence-contracts.py
      - name: Validate classification, billing and payment contracts (Draft 2020-12)
        run: python scripts/validate-commercial-contracts.py
      - name: Validate Control Plane administrative read models (Draft 2020-12)
        run: python scripts/validate-control-plane-contracts.py
      - name: Validate engine release and deployment observation contracts (ADR-BCP-025, Draft 2020-12)
        run: python scripts/validate-topology-contracts.py
      - name: Validate the canonical capability catalogue and provider declarations (ADR-SHARED-017)
        run: python scripts/capability_catalogue.py validate-catalogue
      - name: Test capability catalogue and provider declaration validation (ADR-SHARED-017)
        run: python scripts/tests/test_capability_catalogue.py
      - name: Test explicit validator audience registration
        run: python scripts/tests/test_authorization_contracts.py
      - name: Test contract consumer lock validation and drift reporting (EA-01)
        run: python scripts/tests/test_contract_lock.py
      - name: Validate the event context and event-type registries (ADR-SHARED-018)
        run: python scripts/event_contexts.py
      - name: Test event context and event-type registry validation (ADR-SHARED-018)
        run: python scripts/tests/test_event_contexts.py

  action-pinning:
    name: Enforce action pinning (self-check)
    permissions:
      contents: read
    uses: ./.github/workflows/enforce-action-pinning.yml

  dependabot-config:
    name: Enforce dependabot.yml policy (self-check)
    permissions:
      contents: read
    uses: ./.github/workflows/enforce-dependabot-config.yml



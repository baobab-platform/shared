# ==============================================================================
# BAOBAB-PLATFORM Shared Engineering Infrastructure
# Reusable Workflow: Enforce Action Pinning
#
# File: .github/workflows/enforce-action-pinning.yml
#
# PURPOSE:
#   Fails CI if any `uses:` reference in the calling repository's
#   .github/workflows/**/*.yml or .github/actions/**/action.yml is not
#   pinned to a full 40-character commit SHA. This is the org-wide
#   action-pinning policy (README.md > "Immutable Dependencies") expressed
#   as an automated check, applying to every action reference — third-party
#   actions AND baobab-platform/shared's own reusable workflows/composite actions
#   consumed via `uses: baobab-platform/shared/...@<sha>`. A floating tag (`@v4`,
#   `@v1`), a branch name, or `@main` all fail this check; only a
#   40-character hex commit SHA passes.
#
# WHAT THIS DOES NOT CHECK:
#   - Docker-backed actions (`uses: docker://...`) are flagged separately
#     if not pinned by @sha256: digest, but digest pinning is a distinct
#     mechanism from commit-SHA pinning and isn't the primary target here.
#   - Whether the pinned SHA is itself trustworthy/verified against
#     upstream — that's a human review responsibility at PR time, this
#     check only confirms the *form* of the reference is immutable.
#   - Local actions (`uses: ./path/to/action`) are skipped; they have no
#     ref to pin, they're pinned by definition (same commit as the caller).
#
# DEPENDENCY-FREE BY DESIGN:
#   Implemented in plain bash rather than a third-party pinning-linter
#   action, specifically so this enforcement mechanism doesn't itself
#   introduce another action reference that needs to be kept pinned and
#   updated.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Initial version.
# ==============================================================================

name: Reusable — Enforce Action Pinning

on:
  workflow_call:
    inputs:
      path:
        description: "Root directory to scan for .github/workflows and .github/actions, relative to the repo root."
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  check:
    name: Check action references are SHA-pinned
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for unpinned action references
        working-directory: ${{ inputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          violations=0

          while IFS= read -r -d '' file; do
            while IFS= read -r grepline; do
              lineno="${grepline%%:*}"
              content="${grepline#*:}"

              # Pull the token immediately after 'uses:', stripping quotes.
              val="$(printf '%s' "$content" \
                | sed -E 's/^[^:]*uses:[[:space:]]*//' \
                | sed -E "s/[\"']//g" \
                | awk '{print $1}')"

              [[ -z "$val" ]] && continue

              # Local actions have no ref to pin — same commit as the caller.
              if [[ "$val" == ./* || "$val" == ../* ]]; then
                continue
              fi

              # Docker actions pin by digest, not commit SHA.
              if [[ "$val" == docker://* ]]; then
                if [[ "$val" != *@sha256:* ]]; then
                  echo "::error file=${file},line=${lineno}::Docker action not pinned by digest (expected @sha256:...): ${val}"
                  violations=$((violations + 1))
                fi
                continue
              fi

              if [[ "$val" != *@* ]]; then
                echo "::error file=${file},line=${lineno}::Action has no ref at all (expected @<40-char-commit-sha>): ${val}"
                violations=$((violations + 1))
                continue
              fi

              ref="${val##*@}"
              if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error file=${file},line=${lineno}::Action not pinned to a full-length commit SHA: ${val}"
                violations=$((violations + 1))
              fi
            # Anchored so a comment merely *mentioning* `uses:` in prose
            # (e.g. a header note about the calling repository's own job)
            # never matches — only an actual YAML `uses:` key does.
            done < <(grep -nE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*' "$file" || true)
          done < <(find .github -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 2>/dev/null)

          if [[ $violations -gt 0 ]]; then
            echo ""
            echo "Found ${violations} action reference(s) not pinned to a full-length commit SHA."
            echo "See: https://github.com/baobab-platform/shared/blob/main/README.md#immutable-dependencies"
            exit 1
          fi

          echo "All action references are pinned to full-length commit SHAs."
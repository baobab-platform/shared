name: "Reusable — Foundation Product: Container"
# Container policy, image build/scan, and SBOM for release validation.
# Call from release pipelines or when container_artifact is the primary gate.
# Defaults release_require_zero_exceptions so active waivers cannot ship unnoticed.
on:
  workflow_call:
    secrets:
      SHARED_READ_TOKEN:
        description: Read-only credential for the private baobab-platform/shared repository; defaults to github.token for Shared itself.
        required: false
    inputs:
      foundation_ref:
        description: Exact shared commit used by the caller; policy files are loaded from this ref.
        type: string
        required: true
      release_require_zero_exceptions: { type: boolean, default: true }
      container_ignore_unfixed: { type: boolean, default: false }
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  foundation:
    uses: ./.github/workflows/foundation-repository-gates.yml
    secrets:
      SHARED_READ_TOKEN: "${{ secrets.SHARED_READ_TOKEN }}"
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      profile: container
      release_require_zero_exceptions: "${{ inputs.release_require_zero_exceptions }}"
      container_ignore_unfixed: "${{ inputs.container_ignore_unfixed }}"

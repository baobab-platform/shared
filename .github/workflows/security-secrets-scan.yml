# ==============================================================================
# BAOBAB-PLATFORM Shared Engineering Infrastructure
# Reusable Workflow: Secret Scanning (gitleaks)
#
# File: .github/workflows/security-secrets-scan.yml
#
# PURPOSE:
#   Scans the calling repository's git history for accidentally committed
#   secrets (API keys, tokens, credentials, private keys) using gitleaks,
#   and fails CI if any are found. Language-agnostic — usable by any
#   consuming repository regardless of toolchain, unlike security-python.yml.
#
# WHY THE RAW GITLEAKS BINARY, NOT gitleaks/gitleaks-action:
#   gitleaks-action (the official GitHub Action wrapper) requires a paid
#   GITLEAKS_LICENSE for any repository owned by an organization beyond a
#   single free "Starter" repo (confirmed against gitleaks-action's own
#   v2 documentation) — every baobab-platform repository is org-owned, and this
#   workflow is meant to be adopted by more than one of them, so the
#   wrapper action would put every consumer behind a paywall baobab-platform has
#   not agreed to. `gitleaks` itself (the CLI/engine) is Apache-2.0 and
#   genuinely free with no license key — this workflow installs and runs
#   that binary directly instead, the same "avoid the paid/unpinned
#   wrapper, use the underlying tool directly" call already made for
#   Trivy in baobab-dev's publish.yml (there for pinning reasons, here
#   for licensing reasons — same resolution).
#
# WHY THIS INSTALL STEP VERIFIES AGAINST A DOWNLOADED checksums.txt
# RATHER THAN A HARDCODED SHA256 (unlike publish.yml's Trivy install,
# which hardcodes per-platform SHA256 literals):
#   GitHub's own release-asset URLs (github.com/*/releases/download/...)
#   are disallowed by robots.txt for the fetch tooling available while
#   authoring this file, so the exact per-platform SHA256 for the pinned
#   gitleaks version below could not be independently confirmed at
#   authoring time. Hardcoding a value that could not be verified would
#   be worse than not hardcoding one at all — a wrong literal either
#   breaks every run or, worse, could be silently accepted if copied
#   from an untrusted source. Instead, this step downloads gitleaks'
#   own published checksums.txt for the SAME pinned tag alongside the
#   release tarball and verifies the tarball against the matching line
#   in that file — genuine cryptographic verification against a file
#   the gitleaks project itself publishes for this exact version, just
#   performed at CI-run-time rather than embedded as a literal here. If
#   a maintainer later confirms the per-platform hashes independently,
#   switching to hardcoded literals (matching the Trivy pattern) is a
#   reasonable follow-up — not required, but an option.
#
# WHY fetch-depth DEFAULTS TO 0 HERE (unlike this repository's other
# reusable workflows, which default to a shallow fetch):
#   gitleaks scans git history, not just the working tree. A shallow
#   checkout would only let it see the single most recent commit,
#   silently missing a secret committed and later removed in an earlier
#   commit — exactly the scenario secret scanning exists to catch.
#
# WHY THE SCAN IS SCOPED TO THE CHECKED-OUT REF (--log-opts="HEAD"):
#   gitleaks detect with no --log-opts defaults to a `git log --all`-style
#   traversal: every ref reachable in the local clone, not just the one
#   actually checked out. actions/checkout with fetch-depth: 0 (required
#   above) creates a local tracking branch for every remote branch as a
#   side effect of fetching full history, so without this scoping, one
#   consumer repository's totally unrelated branch containing a flagged
#   string reds every *other* open PR's secrets check in that repository
#   — the check stops answering "does this ref's own history contain a
#   secret" and starts answering "does any branch anywhere in this repo
#   contain one," which is a different (and far noisier) question.
#   --log-opts="HEAD" restores the former: gitleaks walks only the
#   checked-out ref's own ancestry (a PR's own commits plus its base
#   branch's history, or a push's own branch history), while fetch-depth: 0
#   still gives it that ancestry's full, non-shallow depth — the two
#   settings address different axes (which branch vs. how much of it) and
#   both are needed together.
#
# WHY log-opts IS AN INPUT (default "HEAD"):
#   Foundation runs this scan at three scopes. A pull request scans only its
#   own commits ("<base-sha>..HEAD") so an old secret already on the base
#   branch does not red every PR; a push scans the checked-out ref's full
#   ancestry ("HEAD", the historical default); the scheduled deep scan walks
#   every fetched ref ("--all"). Only those three shapes are accepted, so the
#   value can never smuggle other git-log options into the scan.
#
# CHANGE LOG (most recent first)
# ------------------------------------------------------------------------------
# * Added the log-opts input (HEAD | --all | <40-hex-sha>..HEAD) so Foundation
#   can scope the scan to a PR, a branch, or the whole repository.
# * Scoped the gitleaks scan to the checked-out ref (--log-opts="HEAD") --
#   without it, gitleaks' default `git log --all`-equivalent traversal
#   walked every branch fetch-depth: 0 pulled in, so one unrelated open
#   branch's flagged string could red every other PR's secrets check.
# * Initial version.
# ==============================================================================

name: Reusable — Secret Scanning (gitleaks)

on:
  workflow_call:
    inputs:
      path:
        description: "Root directory to scan, relative to the repo root."
        type: string
        required: false
        default: "."
      fetch-depth:
        description: "Git fetch depth for checkout. 0 = full history (recommended — see file header for why a shallow fetch defeats the purpose of this check)."
        type: number
        required: false
        default: 0
      log-opts:
        description: "History to scan: HEAD (checked-out ref, default), --all (every fetched ref), or <40-hex base sha>..HEAD (a pull request's own commits)."
        type: string
        required: false
        default: "HEAD"

permissions:
  contents: read

env:
  # Bump deliberately, not automatically — see CHANGE LOG above when this
  # changes. Re-verify the checksums.txt URL still exists for a new
  # version before bumping.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      # Downloads the release tarball for the pinned GITLEAKS_VERSION and
      # this runner's architecture, plus that SAME version's own published
      # checksums.txt, and verifies the tarball against it before it is
      # ever executed — see file header "WHY THIS INSTALL STEP VERIFIES
      # AGAINST A DOWNLOADED checksums.txt" for why this differs from
      # publish.yml's hardcoded-SHA256 Trivy install.
      - name: Install gitleaks (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64)  ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" ;;
            aarch64) ASSET="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" ;;
            *) echo "::error::Unsupported architecture $(uname -m) for gitleaks install"; exit 1 ;;
          esac

          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL -o "${ASSET}" "${BASE_URL}/${ASSET}"
          curl -fsSL -o checksums.txt "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify only the line for our own asset — the checksums file
          # covers every platform's asset, we only downloaded one.
          grep " ${ASSET}\$" checksums.txt > checksum-line.txt
          if [[ ! -s checksum-line.txt ]]; then
            echo "::error::No checksum entry found for ${ASSET} in checksums.txt — refusing to install an unverified binary."
            exit 1
          fi
          sha256sum -c checksum-line.txt

          tar -xzf "${ASSET}" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${ASSET}" checksums.txt checksum-line.txt
          gitleaks version

      # `detect` (not `protect`) scans git history by default — this is
      # the "did a secret ever land in this repo" check, not a pre-commit
      # hook. --log-opts="HEAD" scopes that history to the checked-out
      # ref's own ancestry (see file header "WHY THE SCAN IS SCOPED TO
      # THE CHECKED-OUT REF"). --redact keeps the actual secret value out
      # of CI logs while still reporting file, line and rule ID. Exit code
      # is non-zero (and this step therefore fails the job) if anything is
      # found.
      - name: Run gitleaks
        shell: bash
        env:
          SCAN_PATH: "${{ inputs.path }}"
          LOG_OPTS: "${{ inputs.log-opts }}"
        run: |
          set -euo pipefail
          if [[ ! "$LOG_OPTS" =~ ^(HEAD|--all|[0-9a-f]{40}\.\.HEAD)$ ]]; then
            echo "::error::Unsupported log-opts '${LOG_OPTS}'; expected HEAD, --all or <40-hex sha>..HEAD"
            exit 1
          fi
          echo "::notice::gitleaks history scope: ${LOG_OPTS}"
          gitleaks detect \
            --source "$SCAN_PATH" \
            --log-opts="$LOG_OPTS" \
            --redact \
            --verbose \
            --no-banner
            
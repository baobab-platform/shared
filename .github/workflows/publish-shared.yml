# ==============================================================================
# NABHOLD GROUP AFRICA — nabhold/shared
#
# Publish versioned @nabhold/* packages to GitHub Packages.
#
# Release model:
#
#   Feature PR
#      │
#      ├── code change
#      └── .changeset/*.md
#             │
#             ▼
#          tag release
#             │
#             ▼
#      Changesets Action
#             │
#             ├── pending changesets
#             │       │
#             │       ▼
#             │   Version Packages PR
#             │
#             └── no pending changesets
#                     │
#                     ▼
#                  build
#                     │
#                     ▼
#             changeset publish
#                     │
#                     ▼
#          npm.pkg.github.com/@nabhold/*
#
# Current publishable packages include:
#   - @nabhold/contracts-ts
#   - @nabhold/supplier-domain
#
# Future non-private @nabhold/* workspace packages are automatically handled
# by Changesets once they contain valid package.json metadata.
#
# IMPORTANT:
#   GitHub Container Registry (ghcr.io) is NOT the npm registry.
#   npm packages publish to:
#
#       https://npm.pkg.github.com
#
# ==============================================================================
name: Publish Shared Packages

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "changeset-config.json"
      - "npmrc"
      - "turbo.json"
      - ".github/workflows/publish-shared.yml"

  # Allows an authorised maintainer to re-run the release process manually.
  workflow_dispatch:

# Never allow two releases of shared contracts/packages to run concurrently.
concurrency:
  group: shared-packages-release-${{ github.ref }}
  cancel-in-progress: false

# Deny everything by default.
permissions:
  contents: read

jobs:
  # ============================================================================
  # Gate 1 — Verify
  #
  # Performs all validation with read-only permissions before the publishing
  # job is granted any write capabilities.
  # ============================================================================
  verify:
    name: Verify publishable packages
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if ! git merge-base --is-ancestor \
            "${GITHUB_SHA}" \
            "origin/main"; then

            echo "::error::Release tag must reference a commit contained in main."
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version comes from:
        #
        #   package.json
        #   "packageManager": "pnpm@11.24.0"
        #
        # Do not duplicate the pnpm version here.

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@nabhold"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint workspace
        run: pnpm lint

      - name: Run package tests
        run: pnpm -r --if-present run test

      - name: Build workspace
        run: pnpm build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show publishable workspace packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Publishable @nabhold packages:"
          echo

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = path.join(process.cwd(), "packages");

          if (!fs.existsSync(root)) {
            throw new Error("packages/ directory does not exist");
          }

          const packages = [];

          for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;

            const manifest = path.join(root, entry.name, "package.json");
            if (!fs.existsSync(manifest)) continue;

            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));

            if (pkg.private === true) continue;

            if (!pkg.name) {
              throw new Error(
                `Publishable package ${entry.name} has no package name`
              );
            }

            if (!pkg.version) {
              throw new Error(
                `Publishable package ${pkg.name} has no version`
              );
            }

            if (!pkg.name.startsWith("@nabhold/")) {
              throw new Error(
                `Unexpected package scope: ${pkg.name}. ` +
                `Published shared packages must use @nabhold/*.`
              );
            }

            packages.push({
              name: pkg.name,
              version: pkg.version,
              directory: entry.name,
            });
          }

          if (packages.length === 0) {
            throw new Error("No publishable workspace packages found");
          }

          for (const pkg of packages) {
            console.log(
              `- ${pkg.name}@${pkg.version} (${pkg.directory})`
            );
          }
          NODE

  # ============================================================================
  # Gate 2 — Version or Publish
  #
  # Changesets controls the two-phase release lifecycle:
  #
  # 1. If .changeset files remain:
  #       create/update the "Version Packages" PR.
  #
  # 2. After the Version Packages PR is merged:
  #       package.json versions have been updated and changesets consumed.
  #       The next main-branch run publishes those versions.
  #
  # ============================================================================
  release:
    name: Version or publish packages
    needs:
      - verify

    runs-on: ubuntu-26.04

    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@nabhold"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Version Packages PR or publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Root package.json:
          #
          # "release": "turbo run build && changeset publish"
          #
          # Therefore publishing always rebuilds packages in the same runner
          # before they are sent to GitHub Packages.
          publish: pnpm release

          # Keep release commits/PRs predictable.
          title: "chore(release): version shared packages"
          commit: "chore(release): version shared packages"

          # This repository already has GitHub-release infrastructure.
          # Changesets should nevertheless create package releases/tags when
          # publishing package versions.
          createGithubReleases: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: always()
        shell: bash
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          {
            echo "## Nabhold Shared Package Release"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Published | \`${PUBLISHED:-false}\` |"
            echo "| Pending changesets | \`${HAS_CHANGESETS:-unknown}\` |"
            echo "| Version PR | \`${PR_NUMBER:-none}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PUBLISHED:-false}" == "true" ]]; then
            {
              echo "### Published packages"
              echo
              echo '```json'
              echo "${PACKAGES:-[]}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
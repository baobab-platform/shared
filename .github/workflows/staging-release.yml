name: Shared Tagged Staging Release
on:
  push:
    tags: ['v*.*.*-staging']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-staging')
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/reusable-staging-image.yml
    with:
      dockerfile: containers/baobab-contracts/Dockerfile
      image: ghcr.io/baobab-platform/baobab-contracts
  packages:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-staging')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and reviewed prerelease package versions
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging$ ]]
          git merge-base --is-ancestor HEAD origin/main
          python - <<'CHECK'
          import json,pathlib,re
          pending=[x for x in pathlib.Path('.changeset').glob('*.md') if x.name!='README.md']
          if pending: raise SystemExit('Merge Changesets version PR before cutting a staging tag')
          packages=[json.loads(p.read_text()) for p in pathlib.Path('packages').glob('*/package.json')]
          public=[p for p in packages if not p.get('private',False)]
          if not public or any(not p['name'].startswith('@baobab-platform/') or not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging(?:\.[0-9]+)?',p['version']) for p in public):
              raise SystemExit('All publishable versions must be reviewed staging prereleases; stable versions cannot be retagged')
          CHECK
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@baobab-platform'
      - name: Verify and publish already-versioned packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm -r --if-present run test
          pnpm build
          pnpm exec changeset publish --tag staging

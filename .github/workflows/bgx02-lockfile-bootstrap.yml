# One-use, branch-restricted pnpm lock reconciliation for the optional
# deck.gl peer metadata. Self-removes after committing only pnpm-lock.yaml.
# Ordinary frozen-lockfile CI remains mandatory on the resulting source head.
name: BGX-02 reconcile optional peer lockfile
on:
  push:
    branches: [feat/bgx02-deckgl-evidence-overlay]
    paths: [.github/workflows/bgx02-lockfile-bootstrap.yml]
permissions:
  contents: write
  packages: read
jobs:
  lockfile:
    if: ${{ github.repository == 'baobab-platform/shared' && github.ref == 'refs/heads/feat/bgx02-deckgl-evidence-overlay' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Approved Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Reconcile only lockfile and remove temporary write workflow
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test "$(node -p 'require("./package.json").packageManager')" = pnpm@11.24.0
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile --lockfile-only
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git rm -- .github/workflows/bgx02-lockfile-bootstrap.yml
          git commit -m "build(bgx02): reconcile optional deck.gl peers with pnpm 11 lockfile"
          git push origin HEAD:refs/heads/feat/bgx02-deckgl-evidence-overlay

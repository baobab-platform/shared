name: Shared TMS Native Authority Design Conformance
on:
  pull_request:
    paths:
      - "proposals/tms-native-execution/**"
      - "docs/architecture/proposals/tms-native-execution-authority-v1.md"
      - "test/tms-native-execution-proposal.test.mjs"
      - "test/tms-native-authority/**"
      - ".github/workflows/tms-native-authority-proposal.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architecture-conformance:
    name: Accepted design schema and semantic negatives — no runtime qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout Shared candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install isolated locked schema-test dependencies
        run: npm ci --prefix test/tms-native-authority --ignore-scripts --no-audit --no-fund
      - name: Validate decisions and independently bound semantic expectations
        run: node --test test/tms-native-execution-proposal.test.mjs

name: Reusable — Foundation CodeQL

on:
  workflow_call:
    inputs:
      enabled:
        description: >
          Caller opt-in for CodeQL. Must be true only when GitHub Advanced
          Security is licensed and enabled for private repositories (public
          repositories may opt in without GHAS). Never set true on a private
          repo without GHAS — the planner will refuse CodeQL and emit
          SAST / Not available instead of attempting an upload that fails.
        type: boolean
        default: false
      python: { type: boolean, default: false }
      node: { type: boolean, default: false }
      go: { type: boolean, default: false }
      java: { type: boolean, default: false }
      rust: { type: boolean, default: false }
      exceptions: { type: string, default: "{}" }

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: "${{ steps.matrix.outputs.matrix }}"
      mode: "${{ steps.matrix.outputs.mode }}"
      status_name: "${{ steps.matrix.outputs.status_name }}"
      reason: "${{ steps.matrix.outputs.reason }}"
    steps:
      - id: matrix
        env:
          ENABLED: "${{ inputs.enabled }}"
          PYTHON: "${{ inputs.python }}"
          NODE: "${{ inputs.node }}"
          GO: "${{ inputs.go }}"
          JAVA: "${{ inputs.java }}"
          RUST: "${{ inputs.rust }}"
          WAIVED: "${{ fromJSON(inputs.exceptions).sast != null }}"
          VISIBILITY: "${{ github.event.repository.visibility }}"
        shell: ruby {0}
        run: |
          require "json"

          entries = []
          entries << { language: "python", mode: "none" } if ENV["PYTHON"] == "true"
          entries << { language: "javascript-typescript", mode: "none" } if ENV["NODE"] == "true"
          entries << { language: "go", mode: "autobuild" } if ENV["GO"] == "true"
          entries << { language: "java-kotlin", mode: "autobuild" } if ENV["JAVA"] == "true"
          entries << { language: "rust", mode: "none" } if ENV["RUST"] == "true"

          enabled = ENV["ENABLED"] == "true"
          waived = ENV["WAIVED"] == "true"
          visibility = (ENV["VISIBILITY"] || "").strip
          private = visibility == "private"
          ghas_claim = enabled
          codeql_available = !private || ghas_claim

          mode =
            if waived
              "waived"
            elsif entries.empty?
              "no_languages"
            elsif !enabled
              "not_available"
            elsif !codeql_available
              "not_available"
            else
              "codeql"
            end

          status_name =
            case mode
            when "waived" then "Waived"
            when "no_languages" then "No languages"
            when "not_available" then "Not available"
            else "CodeQL"
            end

          reason =
            case mode
            when "waived"
              "CodeQL waived by an approved repository exception"
            when "no_languages"
              "No CodeQL-supported languages were classified for this repository"
            when "not_available"
              if private && !enabled
                "CodeQL not available: private repository without advanced_security_enabled (GHAS) opt-in; portable Trivy remains the baseline SAST path"
              elsif private && enabled && !codeql_available
                "CodeQL not available for this private repository under current policy"
              elsif !enabled
                "CodeQL not requested (advanced_security_enabled=false); portable Trivy remains the baseline SAST path"
              else
                "CodeQL not available"
              end
            else
              if private
                "CodeQL enabled for private repository; caller asserts GitHub Advanced Security is licensed and enabled"
              else
                "CodeQL enabled for public repository"
              end
            end

          warn "::warning::#{reason}" if mode == "waived"
          puts "::notice::SAST decision: mode=#{mode} visibility=#{visibility.empty? ? 'unknown' : visibility} enabled=#{enabled} languages=#{entries.map { |e| e[:language] }.join(',')}"
          puts "::notice::#{reason}"

          decision = {
            schema_version: 1,
            mode: mode,
            status_name: status_name,
            reason: reason,
            visibility: visibility.empty? ? "unknown" : visibility,
            enabled: enabled,
            languages: entries.map { |e| e[:language] }
          }
          File.write("foundation-sast-decision.json", JSON.pretty_generate(decision))

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "matrix=#{JSON.generate({ include: entries })}"
            output.puts "mode=#{mode}"
            output.puts "status_name=#{status_name}"
            output.puts "reason=#{reason.gsub("\n", " ")}"
          end

      - name: Upload SAST decision evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-sast-decision
          path: foundation-sast-decision.json
          retention-days: 90
          if-no-files-found: ignore

  analyze:
    if: needs.plan.outputs.mode == 'codeql'
    needs: plan
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          languages: "${{ matrix.language }}"
          build-mode: "${{ matrix.mode }}"
      - uses: github/codeql-action/analyze@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  status:
    if: always() && needs.plan.outputs.mode != 'codeql'
    needs: plan
    name: SAST / ${{ needs.plan.outputs.status_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Record SAST coverage decision
        env:
          MODE: "${{ needs.plan.outputs.mode }}"
          REASON: "${{ needs.plan.outputs.reason }}"
        run: |
          set -euo pipefail
          echo "::notice::${REASON}"
          echo "SAST mode=${MODE}"
          echo "${REASON}"

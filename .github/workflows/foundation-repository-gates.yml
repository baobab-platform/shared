name: Reusable — Foundation Repository Gates
on:
  workflow_call:
    inputs:
      foundation_ref:
        description: Exact shared commit used by the caller; policy files are loaded from this ref.
        type: string
        required: true
      profile:
        description: >
          Product profile selecting which gate families run. full is the
          compatibility default (all families). Prefer distinct product
          entrypoints (foundation-product-*.yml) when only one family is needed.
          Values: full | contract | security-pr | security-deep | container
        type: string
        default: full
      dockerfile: { type: string, default: "Dockerfile" }
      build_context: { type: string, default: "." }
      dependency_review_enabled: { type: boolean, default: false }
      advanced_security_enabled:
        description: >
          Opt-in for GHAS-backed controls (CodeQL and private dependency review).
          Public + true runs CodeQL; public/private + false emits SAST / Not available
          without attempting upload; private + true runs CodeQL only when the caller
          asserts GHAS is licensed and enabled. Default false is safe for private repos.
        type: boolean
        default: false
      legacy_metadata_enabled:
        description: Temporary cohort-migration bridge for .nabhold/environment.yaml; remove after Gate 11.
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  classify:
    uses: ./.github/workflows/reusable-foundation-classify.yml
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"
  baseline:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-baseline.yml
    with:
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  reproducibility:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-reproducibility.yml
    with:
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      infrastructure: "${{ needs.classify.outputs.infrastructure == 'true' }}"
      package_managers: "${{ needs.classify.outputs.package_managers }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  runtime:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-runtime.yml
    with:
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      infrastructure: "${{ needs.classify.outputs.infrastructure == 'true' }}"
      package_managers: "${{ needs.classify.outputs.package_managers }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  environment:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-environment.yml
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      required: "${{ needs.classify.outputs.environment_required == 'true' }}"
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"
  security:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'security-pr' || inputs.profile == 'security-deep' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      dependency_review_enabled: "${{ inputs.dependency_review_enabled }}"
      advanced_security_enabled: "${{ inputs.advanced_security_enabled }}"
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  container:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'container' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-container.yml
    with:
      enabled: "${{ needs.classify.outputs.container_artifact == 'true' }}"
      dockerfile: "${{ needs.classify.outputs.container_dockerfile }}"
      build_context: "${{ needs.classify.outputs.container_context }}"
      runtime: "${{ needs.classify.outputs.container_runtime == 'true' }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  result:
    name: Foundation / Result
    if: always()
    needs: [classify, baseline, reproducibility, runtime, environment, security, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate activated gates
        env:
          RESULTS: "${{ toJSON(needs) }}"
          PROFILE: "${{ inputs.profile }}"
        shell: ruby {0}
        run: |
          require "json"
          needs = JSON.parse(ENV.fetch("RESULTS"))
          profile = ENV.fetch("PROFILE")
          allowed = %w[full contract security-pr security-deep container]
          abort "unsupported Foundation profile: #{profile.inspect}" unless allowed.include?(profile)
          # Skipped jobs (profile-gated) are success for the aggregator.
          failed = needs.select { |_, value| !%w[success skipped].include?(value.fetch("result")) }
          puts "profile=#{profile}"
          puts needs.map { |name, value| "#{name}=#{value.fetch('result')}" }.join("\n")
          abort "required Foundation gates failed: #{failed.keys.join(', ')}" unless failed.empty?

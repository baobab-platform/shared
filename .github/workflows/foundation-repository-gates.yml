name: Reusable — Foundation Repository Gates
on:
  workflow_call:
    inputs:
      foundation_ref:
        description: Exact shared commit used by the caller; policy files are loaded from this ref.
        type: string
        required: true
      profile:
        description: >
          Product profile selecting which gate families run. full is the
          compatibility default (all families). Prefer distinct product
          entrypoints (foundation-product-*.yml) when only one family is needed.
          Values: full | contract | security-pr | security-deep | container
        type: string
        default: full
      dockerfile: { type: string, default: "Dockerfile" }
      build_context: { type: string, default: "." }
      dependency_review_enabled: { type: boolean, default: false }
      advanced_security_enabled:
        description: >
          Opt-in for GHAS-backed controls (CodeQL and private dependency review).
          Public + true runs CodeQL; public/private + false emits SAST / Not available
          without attempting upload; private + true runs CodeQL only when the caller
          asserts GHAS is licensed and enabled. Default false is safe for private repos.
        type: boolean
        default: false
      legacy_metadata_enabled:
        description: Temporary cohort-migration bridge for .nabhold/environment.yaml; remove after Gate 11.
        type: boolean
        default: true
      release_require_zero_exceptions:
        description: >
          When true, Foundation / Result fails if any repository exceptions are active.
          Intended for release/container pipelines; default false preserves waiver behaviour.
        type: boolean
        default: false
      container_ignore_unfixed:
        description: >
          Opt-in for the container gate to ignore vulnerabilities that have no fixed
          version upstream (trivy --ignore-unfixed). Findings with an available fix
          still fail. Default false keeps the strict scan.
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  classify:
    uses: ./.github/workflows/reusable-foundation-classify.yml
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"
  baseline:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-baseline.yml
    with:
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  reproducibility:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-reproducibility.yml
    with:
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      infrastructure: "${{ needs.classify.outputs.infrastructure == 'true' }}"
      package_managers: "${{ needs.classify.outputs.package_managers }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  runtime:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-runtime.yml
    with:
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      infrastructure: "${{ needs.classify.outputs.infrastructure == 'true' }}"
      package_managers: "${{ needs.classify.outputs.package_managers }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  environment:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'contract' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-environment.yml
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      required: "${{ needs.classify.outputs.environment_required == 'true' }}"
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"
  security:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'security-pr' || inputs.profile == 'security-deep' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      dependency_review_enabled: "${{ inputs.dependency_review_enabled }}"
      advanced_security_enabled: "${{ inputs.advanced_security_enabled }}"
      python: "${{ needs.classify.outputs.python == 'true' }}"
      node: "${{ needs.classify.outputs.node == 'true' }}"
      go: "${{ needs.classify.outputs.go == 'true' }}"
      java: "${{ needs.classify.outputs.java == 'true' }}"
      rust: "${{ needs.classify.outputs.rust == 'true' }}"
      infrastructure: "${{ needs.classify.outputs.infrastructure == 'true' }}"
      package_managers: "${{ needs.classify.outputs.package_managers }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  container:
    if: ${{ inputs.profile == 'full' || inputs.profile == 'container' }}
    needs: classify
    uses: ./.github/workflows/reusable-foundation-container.yml
    with:
      enabled: "${{ needs.classify.outputs.container_artifact == 'true' }}"
      dockerfile: "${{ needs.classify.outputs.container_dockerfile }}"
      build_context: "${{ needs.classify.outputs.container_context }}"
      runtime: "${{ needs.classify.outputs.container_runtime == 'true' }}"
      ignore_unfixed: "${{ inputs.container_ignore_unfixed }}"
      exceptions: "${{ needs.classify.outputs.exceptions }}"
  result:
    name: Foundation / Result
    if: always()
    needs: [classify, baseline, reproducibility, runtime, environment, security, container]
    runs-on: ubuntu-26.04
    steps:
      - name: Evaluate activated gates and publish exception evidence
        env:
          RESULTS: "${{ toJSON(needs) }}"
          PROFILE: "${{ inputs.profile }}"
          EXCEPTIONS: "${{ needs.classify.outputs.exceptions }}"
          REQUIRE_ZERO: "${{ inputs.release_require_zero_exceptions }}"
        shell: ruby {0}
        run: |
          require "json"
          require "fileutils"

          needs = JSON.parse(ENV.fetch("RESULTS"))
          profile = ENV.fetch("PROFILE")
          families = {
            "full" => %w[classify baseline reproducibility runtime environment security container],
            "contract" => %w[classify baseline reproducibility runtime environment],
            "security-pr" => %w[classify security],
            "security-deep" => %w[classify security],
            "container" => %w[classify container]
          }
          abort "unsupported Foundation profile: #{profile.inspect}" unless families.key?(profile)
          active = families.fetch(profile)

          # Gates in the profile must succeed. Only gates outside it may be
          # skipped; any other skip is unexplained and fails the aggregate.
          failed = needs.reject do |name, value|
            value.fetch("result") == (active.include?(name) ? "success" : "skipped")
          end
          puts "profile=#{profile}"
          puts needs.map { |name, value| "#{name}=#{value.fetch('result')}" }.join("\n")

          exceptions =
            begin
              JSON.parse(ENV.fetch("EXCEPTIONS", "{}") || "{}")
            rescue JSON::ParserError
              {}
            end
          exceptions = {} unless exceptions.is_a?(Hash)
          count = exceptions.keys.length

          FileUtils.mkdir_p(".foundation-evidence")
          evidence = {
            "schema_version" => 1,
            "profile" => profile,
            "exception_count" => count,
            "exceptions" => exceptions,
            "gate_results" => needs.transform_values { |v| v.fetch("result") }
          }
          File.write(".foundation-evidence/foundation-exceptions.json", JSON.pretty_generate(evidence))

          summary = []
          summary << "## Foundation / Result"
          summary << ""
          summary << "Profile: **#{profile}**"
          summary << "Active exceptions: **#{count}**"
          if count.positive?
            summary << ""
            summary << "| Control | Approver | Expires |"
            summary << "|---|---|---|"
            exceptions.each do |control, body|
              next unless body.is_a?(Hash)
              summary << "| #{control} | #{body['approved_by']} | #{body['expires']} |"
            end
          end
          File.write(ENV.fetch("GITHUB_STEP_SUMMARY"), summary.join("\n") + "\n")

          if ENV.fetch("REQUIRE_ZERO") == "true" && count.positive?
            abort "release_require_zero_exceptions is set but #{count} exception(s) remain active: #{exceptions.keys.join(', ')}"
          end

          abort "required Foundation gates failed: #{failed.keys.join(', ')}" unless failed.empty?

      - name: Upload foundation-exceptions.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-exceptions
          path: .foundation-evidence/foundation-exceptions.json
          retention-days: 90
          if-no-files-found: ignore

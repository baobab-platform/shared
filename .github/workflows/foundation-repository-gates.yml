# ==============================================================================
# BAOBAB-PLATFORM GROUP AFRICA
# Reusable — Foundation Repository Gates
#
# Target path: baobab-platform/shared/.github/workflows/foundation-repository-gates.yml
#
# Purpose
# -------
# workflow_call gate every repo's own .github/workflows/foundation.yml calls
# (see baobab-platform/baobab-dev's for the calling convention). Validates a
# repo's .baobab/environment.yaml + .devcontainer/devcontainer.json against
# the Development Environment Contract, checks reproducibility inputs
# (lockfiles, SHA-pinned Actions, no floating base-image tags), and runs a
# Trivy dependency/secret/container scan.
#
# 2026-09-03: repository-contract job's PROFILE_BASELINES map updated —
# added "infra" (baobab-dev's new Terraform+AWS CLI profile) and fixed
# "frontend-e2e" (previously missing from the profile whitelist entirely,
# so frontend-e2e repos could never actually pass this job). See
# baobab-platform/shared's contracts/development-environment/schema.yaml for the
# profile definitions this file's PROFILE_BASELINES map mirrors.
#
# 2026-09-05: repository-contract job's minimum_version check fixed —
# it compared `minimum.start_with?(baseline[:minimum])`, a literal string
# prefix test, not a version floor. Any repo legitimately declaring a
# `minimum_version` newer than a baseline's exact string (e.g. "1.3.0"
# against the "full" profile's "1.2.6" floor) failed this job outright,
# even though nothing was actually incompatible — confirmed against
# baobab-platform/baobab-pulse, whose Foundation Repository Gates run has failed
# on every push since it legitimately moved to baobab-dev 1.3.0. Now a
# real Gem::Version `>=` comparison, so any release at or above a
# profile's floor passes, not only ones whose string happens to start
# with the floor's exact text.
#
# 2026-09-05 (later same day): the Gem::Version `>=` fix above broke every
# `frontend`-profile repo instead. baobab-platform/baobab-platform, baobab-platform/zuribeans,
# baobab-platform/thamani, and baobab-platform/shared's own declaration (this repo) all
# follow the documented convention (see engine-template's
# environment.yaml.example: "use the SAME version in both minimum_version
# here and the image tag") of writing `minimum_version` WITH the profile
# suffix baked in, e.g. "1.2.6-frontend" — not the bare "1.2.6" the old
# PROFILE_BASELINES design assumed. Gem::Version treats the "-frontend"
# text as a prerelease marker, so "1.2.6-frontend" sorts BELOW "1.2.6" and
# the floor check failed for all four, identically, confirmed by
# reproducing this job's exact failure against baobab-platform/shared's own
# checkout. Fixed by normalizing `minimum_version` to its bare numeric
# core (stripping the profile's own suffix if present) before the floor
# comparison, and building `expected` from that bare core plus the
# suffix — which now works whether a repo's declared `minimum_version`
# already carries the suffix (frontend/frontend-e2e's real convention) or
# doesn't (full/infra's real convention, e.g. baobab-platform/infrastructure's
# bare "1.4.0-rc.0").
#
# 2026-09-16: repository-contract job gained a NEW check — after
# confirming the devcontainer file's TEXT contains the expected
# `ghcr.io/baobab-platform/baobab-dev:<tag>` string (the check above), it now also
# confirms that tag actually RESOLVES on GHCR. Root cause for adding this:
# every check above only proves internal consistency between a repo's own
# environment.yaml and its own devcontainer file — it says nothing about
# whether the image those two files agree on actually exists. That gap is
# exactly how Codespaces ended up stuck in recovery mode for zuribeans and
# other consumer repos: a repo's contract and devcontainer.json can agree
# on a tag (passing every check above) while that tag was never
# successfully published, or was published then removed/retagged —
# developers only find out when `docker pull`/Codespaces creation fails
# locally, with no CI signal beforehand. Deliberately does NOT reach
# across repos to read baobab-dev's own release notes or another
# consumer's files (GITHUB_TOKEN cannot access other repositories'
# contents regardless of org membership — this is a hard platform
# restriction, not a permissions oversight); it only needs `packages:
# read` to query GHCR directly for the tag THIS repo itself already
# declares, which is a registry API call, not a cross-repo GitHub API
# call, so the restriction above doesn't apply to it. Self-contained per
# repo: each consuming repo's own Foundation Repository Gates run catches
# its own dead pin, on every PR/push, before it reaches a developer's
# Codespace.
# ==============================================================================

name: Reusable — Foundation Repository Gates

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile path; leave empty when the repository has no image.
        required: false
        type: string
        default: "Dockerfile"
      build_context:
        description: Docker build context used when dockerfile exists.
        required: false
        type: string
        default: "."
      dependency_review_enabled:
        description: Enable only after the repository dependency graph is enabled.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && inputs.dependency_review_enabled
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  repository-contract:
    runs-on: ubuntu-26.04
    # packages: read ADDED 2026-09-16 — needed for the new "Verify pinned
    # baobab-dev image resolves on GHCR" step below (crane digest lookup).
    # contents: read repeated explicitly because a job-level permissions:
    # block REPLACES the workflow-level default rather than adding to it.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Codespaces and environment contract
        id: contract
        shell: ruby {0}
        run: |
          require "yaml"
          require "rubygems/version"

          declaration_path = ".baobab/environment.yaml"
          devcontainer_path = ".devcontainer/devcontainer.json"
          abort "#{declaration_path} is required" unless File.file?(declaration_path)
          abort "#{devcontainer_path} is required" unless File.file?(devcontainer_path)

          declaration = YAML.safe_load_file(declaration_path, aliases: true)
          abort "invalid environment contract name" unless declaration.dig("schema", "name") == "baobab-platform-development-environment-contract"
          abort "unsupported environment contract version" unless declaration.dig("schema", "version").to_s == "1.0"
          abort "environment provider must be baobab-dev" unless declaration.dig("environment", "provider") == "baobab-dev"

          # Per-profile floor: the minimum baobab-dev version each profile must declare, and
          # the image tag suffix baobab-dev publishes for it (mirrors baobab-platform/shared's own
          # contracts/development-environment/schema.yaml `profiles.*.image_tag_pattern`,
          # duplicated here because this job only checks out the *calling* repo, not
          # baobab-platform/shared itself, so it cannot read that file at runtime).
          #
          # A repo's declared `minimum_version` may or may not already carry the profile's
          # own suffix (e.g. "1.2.6-frontend" vs. bare "1.2.6") — both conventions are in
          # live use across the org, so `minimum_version` is normalized to its bare numeric
          # core below before any comparison or tag construction, regardless of which form
          # a given repo wrote.
          #
          # Bumping an EXISTING profile's `minimum` here raises the floor for every repo
          # already on that profile and will break their CI until they bump their own
          # environment.yaml in step — do that deliberately, in its own PR, coordinated
          # with the repos on that profile, not as a drive-by edit alongside an unrelated
          # change. Adding a brand-new profile entry (as with "infra" below) is always
          # safe: by definition no existing repo declares it yet.
          PROFILE_BASELINES = {
            "full"         => { minimum: "1.2.6",      suffix: "" },
            "frontend"     => { minimum: "1.2.6",      suffix: "-frontend" },
            "frontend-e2e" => { minimum: "1.2.6",      suffix: "-frontend-e2e" },
            "infra"        => { minimum: "1.4.0-rc.0", suffix: "-infra" },
          }.freeze

          profile = declaration.dig("environment", "profile")
          abort "profile must be one of: #{PROFILE_BASELINES.keys.join(', ')}" unless PROFILE_BASELINES.key?(profile)

          baseline = PROFILE_BASELINES.fetch(profile)
          declared = declaration.dig("environment", "minimum_version").to_s
          bare = baseline[:suffix].empty? ? declared : declared.delete_suffix(baseline[:suffix])
          abort "profile '#{profile}' declares an unparseable minimum_version: #{declared.inspect}" unless Gem::Version.correct?(bare)
          abort "profile '#{profile}' requires baobab-dev >= v#{baseline[:minimum]}, got v#{declared}" unless Gem::Version.new(bare) >= Gem::Version.new(baseline[:minimum])

          expected = "ghcr.io/baobab-platform/baobab-dev:#{bare}#{baseline[:suffix]}"
          devcontainer = Dir.glob(".devcontainer/**/*").select { |path| File.file?(path) }.map { |path| File.read(path) }.join("\n")
          abort "devcontainer must use #{expected}" unless devcontainer.include?(expected)

          policy = declaration.fetch("compatibility_policy")
          %w[strict_runtime_versions allow_newer_patch_versions allow_newer_minor_versions allow_older_versions].each do |field|
            abort "compatibility_policy.#{field} must be boolean" unless [true, false].include?(policy[field])
          end

          capabilities = declaration.dig("validation", "required_capabilities")
          abort "required_capabilities must not be empty" unless capabilities.is_a?(Array) && !capabilities.empty?

          # Handed to the "Verify pinned baobab-dev image resolves on GHCR"
          # step below — computed once here, not re-derived from
          # environment.yaml a second time in bash, so the two steps can
          # never disagree about which tag is actually "the" declared one.
          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
            f.puts "expected_image=#{expected}"
          end

      - name: Enforce reproducibility inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            [[ -f pnpm-lock.yaml || -f package-lock.json || -f yarn.lock ]] || {
              echo "::error::Node repositories require a committed lockfile"; exit 1;
            }
          fi
          if [[ -f go.mod ]]; then
            [[ -f go.sum ]] || { echo "::error::Go repositories require go.sum"; exit 1; }
          fi
          if [[ -f Dockerfile ]] && grep -Eq '^FROM[[:space:]]+[^[:space:]]+:(latest|edge)([[:space:]]|$)' Dockerfile; then
            echo "::error::Dockerfile base images must use explicit release versions"; exit 1
          fi
          violations=0
          while IFS= read -r line; do
            reference=$(sed -E 's/.*uses:[[:space:]]*//' <<< "$line" | awk '{print $1}')
            [[ "$reference" == ./* || "$reference" =~ @[0-9a-f]{40}$ ]] || {
              echo "::error::Action is not pinned to a full commit SHA: $reference"; violations=$((violations + 1));
            }
          done < <(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -exec grep -hE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*' {} + 2>/dev/null || true)
          (( violations == 0 ))

      # ------------------------------------------------------------------
      # Verify pinned baobab-dev image resolves on GHCR
      # ------------------------------------------------------------------
      # See this file's 2026-09-16 header note for the full rationale.
      # Everything above proves the repo's OWN files agree with each
      # other; nothing above proves the image they agree on still exists.
      # This closes that gap with a live registry lookup against the
      # exact `expected_image` the contract step above already computed.
      #
      # docker/login-action + a checksummed crane binary, same pattern
      # baobab-platform/baobab-dev's own publish.yml and registry-integrity.yml
      # use — kept identical rather than inventing a second convention.
      # GHCR auth here only needs `packages: read` (this job's own
      # permissions: block above); it is a registry API call scoped to
      # this token's org-visible packages, NOT the repo-scoped Contents
      # API, so it does not run into the cross-repo GITHUB_TOKEN
      # restriction this file's header note explains.
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane CLI tool
        env:
          CRANE_VERSION: "0.21.9"
          CRANE_SHA256: "5c16d8ddb971cb1d5e6ed8b1e743da8224414eeba2c2762d8f1a61b2f095699e"
        run: |
          set -euo pipefail
          ASSET="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL -o "${ASSET}" "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${ASSET}"
          echo "${CRANE_SHA256}  ${ASSET}" | sha256sum -c -
          tar -xzf "${ASSET}" crane
          chmod +x crane
          sudo mv crane /usr/local/bin/crane
          crane version

      - name: Verify pinned baobab-dev image resolves on GHCR
        env:
          EXPECTED_IMAGE: ${{ steps.contract.outputs.expected_image }}
        run: |
          set -euo pipefail
          if ! digest=$(crane digest "${EXPECTED_IMAGE}" 2>&1); then
            echo "::error::${EXPECTED_IMAGE} is declared in .baobab/environment.yaml and referenced in .devcontainer/**, but GHCR cannot resolve it: ${digest}"
            echo "::error::This is the exact failure mode that leaves Codespaces stuck in recovery mode and 'docker pull' failing locally for every developer on this repo — the contract says this tag exists, but it doesn't (yet, or anymore)."
            exit 1
          fi
          echo "Resolved ${EXPECTED_IMAGE} -> ${digest}"

  vulnerability-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Scan repository dependencies and secrets
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-version-check .
      - name: Detect container build
        id: container
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ -n "$DOCKERFILE" && -f "$DOCKERFILE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container for scanning
        if: steps.container.outputs.enabled == 'true'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: docker build --file "$DOCKERFILE" --tag foundation-scan:${{ github.sha }} "$BUILD_CONTEXT"
      - name: Scan built container
        if: steps.container.outputs.enabled == 'true'
        run: trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --skip-version-check foundation-scan:${{ github.sha }}

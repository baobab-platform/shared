name: "Reusable — Foundation Product: Security"
# PR security (security-pr) or scheduled deep security (security-deep).
# Same control jobs today; profile documents intent and branch-protection naming.
# Prefer dependency_review_enabled on pull_request; keep advanced_security_enabled
# true only when GHAS is licensed for the caller.
on:
  workflow_call:
    inputs:
      foundation_ref:
        description: Exact shared commit used by the caller; policy files are loaded from this ref.
        type: string
        required: true
      mode:
        description: "pr (default) or deep (scheduled / history-oriented monitoring)"
        type: string
        default: pr
      dependency_review_enabled: { type: boolean, default: false }
      advanced_security_enabled: { type: boolean, default: false }
      legacy_metadata_enabled: { type: boolean, default: true }
permissions:
  contents: read
  packages: read
  actions: read
  security-events: write
jobs:
  foundation:
    uses: ./.github/workflows/foundation-repository-gates.yml
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
    with:
      foundation_ref: "${{ inputs.foundation_ref }}"
      profile: "${{ inputs.mode == 'deep' && 'security-deep' || 'security-pr' }}"
      dependency_review_enabled: "${{ inputs.dependency_review_enabled }}"
      advanced_security_enabled: "${{ inputs.advanced_security_enabled }}"
      legacy_metadata_enabled: "${{ inputs.legacy_metadata_enabled }}"

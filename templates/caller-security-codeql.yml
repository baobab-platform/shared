# Target path: baobab-platform/shared/templates/caller-security-codeql.yml
#
# FIX 2026-09-04: replaces the all-zeros placeholder SHA
# (0000000000000000000000000000000000000000) that shipped on 2026-08-25
# with a TODO claiming "security-codeql.yml does not exist in
# baobab-platform/shared yet as of this writing." Stale since later that same
# day: security-codeql.yml shipped in the v1.1.0 tag. As checked in
# before this fix, copying this template verbatim would fail immediately
# at the first `uses:` step with an "unable to resolve action" error.
# Verified live via `git ls-remote --tags
# https://github.com/baobab-platform/shared.git v1.1.0` and `git cat-file -e
# f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464:.github/workflows/security-codeql.yml`
# on 2026-09-04.
#
# Copy into <repo>/.github/workflows/security-codeql.yml
# Adjust `languages` for this repo (JSON array string — see
# security-codeql.yml's own header for the input format and supported
# identifiers), resolve the TODO below, then delete this comment block.
#
# Only adopt this in a repo that has at least one CodeQL-supported
# language. CodeQL has no extractor for plain shell scripts or
# Dockerfiles — a repo whose source is only those (e.g. baobab-platform/baobab-dev
# today) has nothing for this workflow to analyse and should skip it
# until that changes.

name: Security — CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    # Pin is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA). Re-verify before merging if this file is
    # more than a few weeks old: `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git` and prefer the newest tag
    # that actually contains security-codeql.yml.
    uses: baobab-platform/shared/.github/workflows/security-codeql.yml@f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464 # v1.1.0
    with:
      languages: '["python"]'
# Target path: baobab-platform/shared/templates/caller-security-secrets-scan.yml
#
# FIX 2026-09-04: replaces the all-zeros placeholder SHA
# (0000000000000000000000000000000000000000) that shipped on 2026-08-25
# with a TODO claiming "security-secrets-scan.yml does not exist in
# baobab-platform/shared yet as of this writing." That was true for a few hours
# on 2026-08-25 and has been stale ever since: security-secrets-scan.yml
# shipped later that same day in the v1.1.0 tag. As checked in before this
# fix, copying this template verbatim would fail immediately at the first
# `uses:` step with an "unable to resolve action" error. Verified live via
# `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.1.0` and
# `git cat-file -e f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464:.github/workflows/security-secrets-scan.yml`
# on 2026-09-04.
#
# Copy into <repo>/.github/workflows/security-secrets-scan.yml
# Resolve the TODO below, then delete this comment block.

name: Security — Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of code changes — catches a secret that was
    # already committed before this check existed, or a scanner-rule
    # update from a new gitleaks version, without requiring a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    # Pin is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA). Re-verify before merging if this file is
    # more than a few weeks old: `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git` and prefer the newest tag
    # that actually contains security-secrets-scan.yml.
    uses: baobab-platform/shared/.github/workflows/security-secrets-scan.yml@f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464 # v1.1.0
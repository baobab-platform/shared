# BA-SEC-DEP-001: Baobab Dependency & Security Maintenance Policy v1.0
#
# Copy this starter into the consuming repository's .github/dependabot.yml.
# Review the package manager(s), manifests, paths, labels and timezone first.
# Do not copy optional ecosystems that have no manifests in the repository.
# The default branch is authoritative for security updates: do not add
# target-branch just to spell out "main".
#
# Security updates are advisory-driven, NOT limited to the weekly schedule.
# Routine groups explicitly apply to version-updates only; major updates
# are reviewed separately. Keep SHA-pinned Actions and review provenance.
# The CI conformance gate can be adopted in strict mode once the repository
# passes the targeted migration and safe exception review.
#
# Policy: docs/governance/baobab-dependency-security-maintenance-policy-v1.0.md
# Reusable validation: .github/workflows/enforce-dependabot-config.yml
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    groups:
      actions-routine-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"


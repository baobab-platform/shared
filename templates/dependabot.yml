#
# Maven, Cargo, Terraform, Docker or docker-compose:
# add only real directories/manifests and the same schedule/limit/label/
# commit-message fields. Docker FROM scratch contains no upstream base image;
# do not add meaningless image entries. Toolchains controlled by baobab-dev's
# versions.yaml and versions.lock retain their independent version authority.
#
# Dependencies with known advisories must be triaged outside the routine PR
# schedule. Unconditional "ignore" rules need explicit, expiring security
# review; prefer narrow version-update-only constraints where appropriate.

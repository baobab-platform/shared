# Target path: baobab-platform/shared/templates/caller-release.yml
#
# FIX 2026-09-04: the pin below previously pointed at baobab-platform/shared's
# v1.0.0 tag SHA (ad5cdb028023cd6b9c48cd8d7e6151ef4ab0cd73) — a real,
# resolvable commit, which made the problem harder to spot than the
# other three caller templates' obvious all-zeros placeholders. v1.0.0
# predates release.yml entirely: confirmed via `git ls-tree v1.0.0 --
# .github/workflows/release.yml` (empty) vs. `git ls-tree v1.1.0 --
# .github/workflows/release.yml` (present) on 2026-09-03. Anyone who
# copied this template as checked-in got a pin that looked valid but
# didn't contain the referenced workflow. Re-pinned below to v1.1.0,
# verified live via `git cat-file -e
# f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464:.github/workflows/release.yml`
# on 2026-09-04.
#
# Copy into <repo>/.github/workflows/release.yml
# Adjust the changelog-path input and the "files" TODO below for this
# repository, then delete this comment block.
#
# Assumes: a "Keep a Changelog"-style CHANGELOG.md at the repo root with
# version headings shaped "# [<version>]" or "## [<version>]" (see
# baobab-platform/shared's own CHANGELOG.md, or baobab's, for the convention this
# matches). A repo without that heading style should set changelog-path to
# "" and rely on generate-release-notes alone.
#
# NOT a fit for a repository whose release is inseparable from a bespoke
# artifact pipeline (container build/sign/attest, package publish, etc.) —
# see baobab-platform/shared/.github/workflows/release.yml's own header. Keep that
# kind of release-creation step local to the repo instead of adopting this.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    # Pin is baobab-platform/shared's v1.1.0 tag (annotated — peeled commit, not
    # the tag object's own SHA) — the earliest tag that actually contains
    # release.yml. Re-verify before merging if this file is more than a
    # few weeks old: `git ls-remote --tags
    # https://github.com/baobab-platform/shared.git` and confirm whichever tag
    # you pin to actually contains .github/workflows/release.yml, not
    # just that the tag itself resolves.
    uses: baobab-platform/shared/.github/workflows/release.yml@f8df9b90ffe8fef5cbf6d14a9bcf868f723d1464 # v1.1.0
    with:
      changelog-path: "CHANGELOG.md"
      # TODO: set to true only once this repo actually publishes something
      # (a package, a container image, a doc site with a version-pinned
      # URL) that belongs in the release notes as a download/reference —
      # leave "" (no files) for a repo whose release is notes-only.
      # files: |
      #   dist/*.whl
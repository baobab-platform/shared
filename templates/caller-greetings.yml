# Copy into <repo>/.github/workflows/greetings.yml
# Adjust issue-message/pr-message for this repository, then delete this
# comment block.
#
# Do NOT add a checkout step to the `greet` job below. This workflow uses
# pull_request_target specifically so the bot can comment using the base
# repository's token even on PRs from forks — see
# baobab-platform/shared/.github/workflows/greetings.yml's header for why that's
# safe only as long as the PR's own code is never checked out or executed.

name: Greet First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  greet:
    permissions:
      issues: write
      pull-requests: write
    # SHA is baobab-platform/shared's v1.0.0 tag (annotated — this is the peeled
    # commit, not the tag object's own SHA), verified live via
    # `git ls-remote --tags https://github.com/baobab-platform/shared.git v1.0.0`
    # on 2026-08-25. Dependabot should pick up future baobab-platform/shared
    # releases from here automatically (see enforce-dependabot-config.yml)
    # — re-verify manually if a bump PR looks off, since Dependabot has a
    # documented issue resolving updates cleanly the first time a
    # previously-untagged pin moves onto an actual tag.
    uses: baobab-platform/shared/.github/workflows/greetings.yml@ad5cdb028023cd6b9c48cd8d7e6151ef4ab0cd73 # v1.0.0
    with:
      issue-message: "Thanks for opening your first issue here — a maintainer will take a look shortly."
      pr-message: "Thanks for your first pull request here — a maintainer will review it shortly."